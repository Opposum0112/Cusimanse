kind: workload-profile
version: 2
id: npm-lifecycle
purpose: Deterministic local npm postinstall fixture workload.
requirements:
  execution: disposable
  os: linux
  workload: npm-lifecycle
  network: localhost-only
  instrumentation: [process, syscall, filesystem, network]
runtime: disposable-lima-vm
runtime_handler: npm-lifecycle
instrumentation: recipes/instrumentation/security-research.yaml
fixture: packages/npm-fixture
agent_may_modify: false
