kind: host-profile
version: 2
id: linux-lima
purpose: Linux disposable-VM capability for agent-operated security research.
platforms: [linux, macos, windows_wsl2]
host_recipe: recipes/host/security-research.yaml
compute_recipe: recipes/lima/security-research.yaml
capabilities:
  os: linux
  execution_boundaries: [disposable-vm]
  network_modes: [controlled, localhost-only]
  instrumentation: [process, syscall, filesystem, network]
execution:
  boundary: disposable-lima-vm
  api: cmd/cusimanse
  agent_may_generate_provisioning: false
  agent_may_generate_instrumentation: false
  agent_may_operate: true
policy:
  enforcement: scripts/policyctl
  required_checks: [vm, network, credentials, mounts]
