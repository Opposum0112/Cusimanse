id: install-all
kind: installation
mode: preflight-then-install
host_checks: [os, architecture, ram, free_disk, virtualization, qemu, lima, git, bash, python3]
required_host_tools: [git, bash, python3, qemu-system-x86_64, limactl]
optional_host_tools: [jq, yq, rg, tcpdump, strace, lsof, bpftrace, numbat, crewai]
install_plan:
  debian_like:
    packages: [qemu-system-x86, qemu-utils, curl, git, python3, python3-pip]
    lima: use-supported-platform-package
  macos:
    packages: [lima, qemu, git, python3]
    method: supported-package-manager
  python:
    crewai:
      package: crewai
      scope: user
      method: python3 -m pip install --user crewai
      optional: true
  windows:
    status: NOT_DEPLOYED
policy:
  fail_if_required_prerequisite_missing: true
  install_only_declared_packages: true
  unknown_remote_installers: deny
  rerun_preflight_after_install: true
  crewai_optional: true
