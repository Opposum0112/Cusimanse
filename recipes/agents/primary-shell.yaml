version: 2
id: primary-shell
kind: agent-shell-contract
purpose: >-
  Define the terminal-first interface through which the selected primary agent owns
  the complete Cusimanse operator, execution and orchestration cycle.
operator_model:
  host_bootstrap: scripts-only
  operator_shell: selected-primary-agent
  lifecycle_authority: primary-agent
  security_boundary: disposable-vm-and-os-controls
  execution_mode: agent-shell-driven

required_sequence:
  - discover
  - validate
  - preflight
  - plan
  - review
  - request_approval
  - provision_vm
  - start_instrumentation
  - execute_workload
  - collect_evidence
  - reduce_evidence
  - forensics
  - independent_verification
  - report
  - preserve_evidence
  - destroy_vm

shell_rules:
  - The selected primary agent shell is the authoritative operator interface after bootstrap.
  - Host scripts bootstrap prerequisites, validate repository state and prepare configuration only.
  - Do not use a second orchestration controller to duplicate the primary agent lifecycle.
  - Every privileged or destructive action must pass the declared approval and policy gates.
  - Evidence must be written to the declared evidence paths before VM destruction.
  - Model output is not evidence; evidence is collected from runtime artifacts and independently verified.
  - Learning proposals are generated by the primary agent but require validation and human approval before promotion.

adapter_cli:
  goose:
    interactive: "goose"
    run: "goose run --recipe recipes/goose/project.yaml --params experiment=go-install-001 --params section=project"
  opencode:
    interactive: "opencode"
    run: "opencode run '<PROMPT>'"
  grok-build:
    interactive: "grok"
    run: "grok -p '<PROMPT>'"
  antigravity:
    interactive: "agy"
    run: "agy -p '<PROMPT>'"
    note: "Verify the installed Antigravity CLI help on the target host before runtime acceptance."
  pi:
    interactive: "pi"
    run: "pi -p '<PROMPT>'"
  hermes:
    interactive: "hermes"
    run: "hermes"
    note: "Hermes is TUI-first; send the Cusimanse run prompt in the interactive shell."
  codex:
    interactive: "codex"
    run: "codex"
    note: "Verify the installed Codex CLI help for the current non-interactive invocation."
  prime-intellect:
    interactive: "prime-agent"
    run: "prime-agent -p '<PROMPT>'"
  claude-code:
    interactive: "claude"
    run: "claude '<PROMPT>'"
  devin:
    interactive: provider-managed
    run: provider-managed

runtime_test:
  prompt_file: docs/agent-shell-runbook.md
  reference_experiment: experiments/go-install-001
  required_outputs:
    - audit record
    - evidence index
    - finding report
    - verification result
    - preservation manifest
  acceptance_rule: "CLI availability is not runtime PASS; complete a disposable-VM test and preserve evidence."
