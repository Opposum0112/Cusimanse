version: 2
kind: agent-adapter-installation
purpose: Interactive, idempotent selection of optional primary-agent adapters.
mandatory:
  - goose
optional_adapters:
  opencode:
    command: opencode
    unix_install: scripts/install.sh
    windows: native-installer-or-wsl2
  hermes:
    command: hermes
    unix_install: scripts/install.sh
    windows: native-installer-or-wsl2
  antigravity:
    command: agy
    unix_install: scripts/install.sh
    windows: native-installer-or-wsl2
  pi:
    command: pi
    package: '@earendil-works/pi-coding-agent@0.74.0'
    unix_install: npm install -g @earendil-works/pi-coding-agent@0.74.0
    windows: npm install -g @earendil-works/pi-coding-agent@0.74.0
selection:
  interactive: true
  environment_variable: CUSIMANSE_INSTALL_ADAPTERS
  noninteractive_all: all
  noninteractive_list: opencode,hermes,antigravity,pi
idempotency:
  check_command_before_install: true
  rerun_safe: true
supply_chain:
  pinned_known_versions: [goose: '1.50.0', numbat: '0.2.0', omniroute: '3.8.50', pi: '0.74.0']
  remote_installer_scripts_must_be_downloaded_then_syntax_checked: true
  secrets_not_in_recipe: true
fallback:
  unsupported_platform: report_and_stop_before_full_experiment
  failed_optional_adapter: PARTIAL
  required_goose_failure: FAIL
