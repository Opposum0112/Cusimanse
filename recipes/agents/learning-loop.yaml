version: 1
id: learning-loop
kind: learning-contract
purpose: >-
  Allow a primary operator to learn from verified runs while preventing autonomous
  mutation of security boundaries, credentials, or privileged policy.
loop:
  - collect_run_outcomes
  - normalize_observations
  - compare_against_prior_runs
  - identify_reproducible_improvements
  - create_change_proposal
  - run_validation
  - request_human_review
  - promote_after_approval
  - checkpoint_and_audit
  - rollback_on_regression
allowed_updates:
  - adapter command templates
  - recipe defaults
  - evidence reduction heuristics
  - routing hints
  - non-security workflow optimizations
forbidden_updates:
  - security boundary
  - host mounts
  - credentials
  - privilege grants
  - network allowlists
  - approval requirements
  - evidence integrity rules
promotion:
  required:
    - reproducible_evidence
    - validation_pass
    - independent_verification
    - human_approval
  automatic_promotion: false
