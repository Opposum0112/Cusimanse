version: 2
id: adapter-matrix
kind: adapter-registry
operator_model:
  exactly_one_primary_shell: true
  shell_driven: true
  orchestration_owner: selected-primary-agent-shell
  execution_owner: selected-primary-agent-shell
  lifecycle_owner: selected-primary-agent-shell
  host_scripts: bootstrap-validation-preflight-only
primary_candidates:
  goose:
    status: reference
    install: goose
    shell: goose
    prompt: "goose run --text '<PROMPT>'"
    config_recipe: recipes/adapters/goose.yaml
  opencode:
    status: candidate
    install: opencode
    shell: opencode
    prompt: "opencode run '<PROMPT>'"
    config_recipe: recipes/adapters/opencode.yaml
  grok-build:
    status: candidate
    install: manual-or-provider-specific
    shell: grok
    prompt: "grok -p '<PROMPT>'"
    config_recipe: recipes/adapters/grok-build.yaml
  antigravity:
    status: candidate
    install: manual-or-provider-specific
    shell: agy
    prompt: "verify native prompt mode with agy --help"
    config_recipe: recipes/adapters/antigravity.yaml
  pi:
    status: candidate
    install: pi
    shell: pi
    prompt: "pi -p '<PROMPT>'"
    config_recipe: recipes/adapters/pi.yaml
  hermes:
    status: candidate
    install: manual-or-provider-specific
    shell: hermes
    prompt: "TUI-first; use installed Hermes interactive prompt flow"
    config_recipe: recipes/adapters/hermes.yaml
  codex:
    status: candidate
    install: codex
    shell: codex
    prompt: "verify native non-interactive mode with codex --help"
    config_recipe: recipes/adapters/codex.yaml
  prime-intellect:
    status: candidate
    install: prime-agent
    shell: prime-agent
    prompt: "prime-agent -p '<PROMPT>'"
    config_recipe: recipes/adapters/prime-intellect.yaml
enterprise_adapters:
  claude-code:
    status: enterprise-candidate
    install: claude
    shell: claude
    prompt: "verify native mode with claude --help"
    config_recipe: recipes/adapters/claude-code.yaml
  devin:
    status: enterprise-candidate
    install: provider-managed
    shell: provider-managed
    prompt: provider-managed
    config_recipe: recipes/adapters/devin.yaml
selection:
  exactly_one_primary: true
  interactive: true
  preflight_selected_only: true
  unavailable: NOT_DEPLOYED
common_contract: recipes/agents/primary-agent.yaml
shell_contract: recipes/agents/primary-shell.yaml
learning_contract: recipes/agents/learning-loop.yaml
security_boundary: disposable-vm-and-os-controls
