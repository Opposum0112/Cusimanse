version: 4
kind: primary-agent-adapter-matrix
purpose: >-
  Define the supported handoff from one agent-neutral Cusimanse experiment to
  each primary agent. Goose is the native reference operator. Other agents use
  the same contract, experiment configuration and prompt library without
  mutating trusted configuration.
reference:
  agent: goose
  mode: native-recipe
  command: goose run --recipe <recipe> --interactive
  prompt_library: prompts/experiments/<experiment>.md
  capabilities: [recipes, subrecipes, summon, skills, MCP/extensions, delegation]
  operator_sequence:
    - "cusimanse doctor"
    - "cusimanse validate"
    - "cusimanse preflight"
    - "goose recipe validate <recipe>"
    - "cusimanse resolve <experiment>"
    - "cusimanse policy explain/check <action>"
    - "cusimanse policy require <action> after researcher approval"
    - "cusimanse --approved run <experiment> <session-id>"
    - "cusimanse observability report <session-id>"
    - "preserve evidence and verify before destroy"
adapters:
  opencode:
    command: opencode
    mode: prompt-handoff
    prompt_reference: prompts/experiments/<experiment>.md
    adapter_guidance: prompts/operators/opencode.md
    native_capabilities: [agents, plugins, MCP]
    orchestration: native-agent-capabilities
    invocation: "opencode <prompt-reference-or-project-session>"
    validation: reference-experiment
  hermes:
    command: hermes
    mode: prompt-handoff
    prompt_reference: prompts/experiments/<experiment>.md
    adapter_guidance: prompts/operators/hermes.md
    native_capabilities: [tools, skills, delegation]
    orchestration: native-agent-capabilities
    invocation: "hermes <prompt-reference-or-project-session>"
    validation: reference-experiment
  antigravity:
    command: agy
    mode: prompt-handoff
    prompt_reference: prompts/experiments/<experiment>.md
    adapter_guidance: prompts/operators/antigravity.md
    native_capabilities: [agents, tools, delegation]
    orchestration: native-agent-capabilities
    invocation: "agy <prompt-reference-or-project-session>"
    validation: reference-experiment
  pi:
    command: pi
    mode: prompt-handoff
    prompt_reference: prompts/experiments/<experiment>.md
    adapter_guidance: prompts/operators/pi.md
    native_capabilities: [extensions, skills, packages]
    orchestration: native-agent-capabilities
    invocation: "pi <prompt-reference-or-project-session>"
    validation: reference-experiment
adapter_contract:
  inputs: [contract, experiment_configuration, experiment_prompt, adapter_guidance]
  recipe_source_of_truth: true
  prompt_is_handoff_only: true
  recipe_mutation: forbidden
  trusted_profile_mutation: forbidden
  policy_mutation: forbidden
  execution_boundary: Lima/QEMU + guest OS
  required_outputs: [session.yaml, evidence, verification, research-report]
  unsupported_capability: record_as_partial
  operator_authority: "Only the Go capability API and declared policy may authorize execution."
  adapter_rule: "An adapter may plan, delegate and analyze, but must invoke Cusimanse for capability execution."
validation:
  prompt_file_required: true
  adapter_guidance_required: true
  cli_presence_is_insufficient: true
  pass_requires_runtime_evidence: true
  pass_requires_independent_verification: true
  unvalidated_status: NOT_DEPLOYED
