version: 4
kind: agent-adapter-matrix
purpose: Declare supported primary terminal agents and their native orchestration capability.
observability: recipes/agent-monitoring/observability.yaml
selection_rule: exactly_one_primary_agent
orchestration_rule: selected_primary_agent_owns_lifecycle_and_native_multiagent_delegation
adapters:
  goose:
    role: primary-agent
    executable: goose
    orchestration: native-subagents
  opencode:
    role: primary-agent
    executable: opencode
    orchestration: native-or-configured-agent-capabilities
  grok-build:
    role: primary-agent
    executable: grok
    orchestration: native-agent-capabilities
  antigravity:
    role: primary-agent
    executable: agy
    orchestration: native-agent-capabilities
  pi:
    role: primary-agent
    executable: pi
    orchestration: native-agent-capabilities
  hermes:
    role: primary-agent
    executable: hermes
    orchestration: native-agent-capabilities
  codex:
    role: primary-agent
    executable: codex
    orchestration: native-agent-capabilities
  prime-intellect:
    role: primary-agent
    executable: prime-agent
    orchestration: native-agent-capabilities
  claude-code:
    role: primary-agent
    executable: claude
    orchestration: native-agent-capabilities
  devin:
    role: primary-agent
    executable: provider-managed
    orchestration: provider-managed
enterprise_adapters:
  enterprise-claude-code:
    role: primary-agent
    executable: claude
    orchestration: native-agent-capabilities
  enterprise-devin:
    role: primary-agent
    executable: provider-managed
    orchestration: provider-managed
policy:
  one_primary_shell: true
  primary_agent_owns_orchestration: true
  competing_orchestrator: deny
  security_boundary: disposable-vm-and-os-controls
