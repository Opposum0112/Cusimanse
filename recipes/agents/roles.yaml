version: 1
id: agent-roles
kind: agents
roles:
  planner:
    purpose: plan experiment from Markdown and YAML
    capabilities: [read_repo, read_recipes, write_blackboard]
    apply: false
  reviewer:
    purpose: review safety, policy and execution plan
    capabilities: [read_repo, read_recipes, policy_check]
    apply: false
  executor:
    purpose: execute approved recipe operations through the primary Goose operator
    capabilities: [goose_tools, approved_shell, vm_operations]
    apply: true
  researcher:
    purpose: investigate declared research questions through an approved multi-agent crew
    capabilities: [read_repo, read_recipes, evidence_read, analysis]
    apply: false
  runtime-analyst:
    purpose: analyse runtime telemetry produced by the experiment
    capabilities: [telemetry_read, evidence_read, analysis]
    apply: false
  forensics:
    purpose: collect, reduce, analyse and report evidence
    capabilities: [evidence_read, hash, analysis, report]
    apply: false
  independent-reviewer:
    purpose: independently verify findings
    capabilities: [evidence_read, verification]
    apply: false
  reporter:
    purpose: produce reproducible experiment reports
    capabilities: [evidence_read, verification, report]
    apply: false

orchestration:
  primary_operator: goose
  optional_frameworks:
    crewai:
      recipe: recipes/orchestration/crewai.yaml
      role_based: true
      cannot_bypass_primary_operator: true
