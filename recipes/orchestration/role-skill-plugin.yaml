version: 1
id: role-and-skill-plugin-contract
kind: modular-plugin-contract
purpose: >-
  Define provider-neutral, declarative role and skill plugins that can be selected
  by a campaign and executed by the selected primary agent without changing the
  experiment contract or security boundary.

plugin_model:
  role:
    required:
      - id
      - purpose
      - input
      - output
      - apply
    optional:
      - skills
      - tools
      - mcp
      - acceptance
  skill:
    required:
      - id
      - source
      - purpose
      - trust
    optional:
      - capability
      - risk
      - evaluation
      - provenance

composition:
  roles_select_skills: true
  roles_select_tools: true
  roles_select_mcp: true
  primary_agent_executes: true
  blackboard_is_result_sink: true
  recipe_changes_reviewed: true

role_result:
  required:
    - role_id
    - execution_id
    - input_refs
    - output_refs
    - evidence_refs
    - status
  statuses:
    - PASS
    - PARTIAL
    - FAIL
    - NOT_DEPLOYED

skill_lifecycle:
  candidate: generated_or_imported_capability
  reviewed: provenance_and_capability_reviewed
  replayed: replayed_on_distinct_artifact
  verified: independently_verified
  validated: human_approved_version
  rollback: required

safety:
  plugin_isolation_boundary: false
  role_can_grant_privilege: false
  skill_can_grant_privilege: false
  retrieval_grants_execution: false
  direct_host_execution: deny
  bypass_policy: deny
  bypass_vm_boundary: deny
  self_approval: deny
  secrets_in_plugin_source: deny
  model_output_is_evidence: false
  evidence_preserved_before_destroy: true
