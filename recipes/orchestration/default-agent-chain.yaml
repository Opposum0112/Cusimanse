id: default-agent-chain
kind: orchestration
stages:
  - id: plan
    agent: planner
    action: read recipe and produce execution plan
  - id: review
    agent: reviewer
    action: validate policy, VM, instrumentation and workload
    requires_approval: true
  - id: provision
    agent: executor
    action: materialize the approved disposable-VM experiment
  - id: instrument
    agent: executor
    action: start selected collectors before workload
  - id: workload
    agent: executor
    action: execute workload inside disposable VM
  - id: collect
    agent: forensics
    action: preserve and hash evidence
  - id: analyse
    agent: forensics
    action: deterministic reduction then AI-assisted analysis
  - id: verify
    agent: independent-reviewer
    action: independently verify findings
  - id: report
    agent: reporter
    action: write experiment report
  - id: cleanup
    agent: executor
    action: destroy VM after evidence preservation
optional_role_orchestration:
  crewai:
    recipe: recipes/orchestration/crewai.yaml
    entrypoint: after-plan-before-execution
    purpose: coordinate specialist research roles without replacing selected primary-agent lifecycle authority
policy:
  fail_closed: true
  require_explicit_apply: true
