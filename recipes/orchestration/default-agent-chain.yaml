id: default-agent-chain
kind: orchestration
session_state: recipes/session/session-state.yaml
learning_workflow: recipes/session/learning-workflow.yaml
model: >-
  The selected primary agent is the only project lifecycle authority. It may use
  its native multi-agent/subagent capabilities to delegate the declared specialist
  roles. Cusimanse does not require a competing orchestration framework.
stages:
  - id: plan
    agent: planner
    action: read contract and recipe and produce execution plan
    checkpoint_session: true
  - id: review
    agent: reviewer
    action: validate policy, compute, instrumentation and workload
    requires_approval: true
    checkpoint_session: true
  - id: provision
    agent: executor
    action: materialize the approved disposable-compute experiment
    checkpoint_session: true
  - id: instrument
    agent: executor
    action: start selected collectors before workload
    checkpoint_session: true
  - id: workload
    agent: executor
    action: execute workload inside disposable compute
    checkpoint_session: true
  - id: collect
    agent: forensics
    action: preserve and hash evidence
    checkpoint_session: true
  - id: analyse
    agent: forensics
    action: deterministic reduction then AI-assisted analysis
    checkpoint_session: true
  - id: verify
    agent: independent-reviewer
    action: independently verify findings
    checkpoint_session: true
  - id: report
    agent: reporter
    action: write experiment report and preservation manifest
    checkpoint_session: true
  - id: dashboard-finalize
    agent: reporter
    action: finalize token accounting and clear the active session dashboard
    checkpoint_session: true
  - id: cleanup
    agent: executor
    action: destroy compute only after evidence preservation
    checkpoint_session: true
optional_state_and_task_helpers:
  langgraph:
    recipe: recipes/orchestration/langgraph.yaml
    entrypoint: learning-only-when-selected
    purpose: optional stateful learning checkpoints; never lifecycle authority
  taskflow:
    recipe: recipes/orchestration/taskflow.yaml
    entrypoint: learning-only-when-selected
    purpose: optional replayable learning task decomposition; never lifecycle authority
policy:
  fail_closed: true
  require_explicit_apply: true
  competing_orchestrator: deny
  primary_agent_native_orchestration: preferred
