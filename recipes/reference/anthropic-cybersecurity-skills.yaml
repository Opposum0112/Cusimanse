version: 3
id: anthropic-cybersecurity-skills
kind: upstream-skill-catalog
source:
  repository: https://github.com/mukul975/Anthropic-Cybersecurity-Skills
  index: index.json
  source_snapshot: 2026-08-24
  source_inventory: 818
status: review-catalog
selection_policy:
  copy_after_review: true
  never_auto_execute: true
  inspect_skill_md: true
  inspect_scripts_and_resources: true
  review_dependencies: true
  review_network_access: true
  review_privileges: true
  review_secrets: true
  review_destructive_actions: true
  license_and_provenance_required: true
selected_skill_families:
  malware_and_binary:
    - analyzing-linux-elf-malware
    - analyzing-linux-system-artifacts
    - analyzing-linux-audit-logs-for-intrusion
    - analyzing-golang-malware-with-ghidra
    - analyzing-bootkit-and-rootkit-samples
    - analyzing-linux-kernel-rootkits
    - analyzing-heap-spray-exploitation
    - analyzing-macro-malware-in-office-documents
    - analyzing-malicious-pdf-with-peepdf
    - analyzing-android-malware-with-apktool
    - analyzing-cobalt-strike-beacon-configuration
    - analyzing-cobaltstrike-malleable-c2-profiles
  forensics:
    - acquiring-disk-image-with-dd-and-dcfldd
    - analyzing-disk-image-with-autopsy
    - analyzing-browser-forensics-with-hindsight
    - analyzing-lnk-file-and-jump-list-artifacts
  network_and_detection:
    - analyzing-command-and-control-communication
    - analyzing-dns-logs-for-exfiltration
    - analyzing-indicators-of-compromise
    - analyzing-campaign-attribution-evidence
    - analyzing-api-gateway-access-logs
    - analyzing-apt-group-with-mitre-navigator
    - analyzing-certificate-transparency-for-phishing
  cloud_and_platform:
    - analyzing-azure-activity-logs-for-threats
    - analyzing-cloud-storage-access-patterns
    - analyzing-kubernetes-audit-logs
    - analyzing-docker-container-forensics
  application_security:
    - analyzing-ethereum-smart-contract-vulnerabilities
  governance_and_compliance:
    - achieving-cmmc-level-2-compliance
  phishing_and_email:
    - analyzing-email-headers-for-phishing-investigation
  additional_defensive_families:
    - incident-response
    - threat-hunting
    - digital-forensics
    - endpoint-security
    - vulnerability-management
    - devsecops
    - identity-access-management
    - web-application-security
    - container-security
    - network-security
    - mobile-security
review_exclusions:
  - offensive credential-access and privilege-escalation procedures remain catalog-only until separately approved
  - exploitation, persistence and destructive procedures require explicit authorization
  - public enrichment must not receive private workload data
  - skills requiring secrets, host-wide privileges, or external writes remain NOT_DEPLOYED until reviewed
integration:
  target_registry: recipes/skills/registry.yaml
  security_boundary: disposable-vm-and-os-controls
  evidence_rule: external skill output is not evidence until captured, hashed and independently verified
rules:
  - upstream skills are not copied wholesale without review
  - unsupported dependencies are NOT_DEPLOYED
  - record upstream path and source revision in audit metadata
  - skill presence never grants privilege
  - skills are instructions, not security boundaries
