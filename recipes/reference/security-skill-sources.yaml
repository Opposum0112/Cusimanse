version: 1
id: security-skill-sources
kind: external-skill-catalog
purpose: identify useful external security-oriented agent skills without treating external content as trusted by default

sources:
  openai-skills:
    url: https://github.com/openai/skills
    useful-skills:
      - security-best-practices
      - security-threat-model
      - security-ownership-map
      - skill-creator
    trust: external-source-review-required
    import: selective
  anthropic-skills:
    url: https://github.com/anthropics/skills
    useful-skills:
      - skill-creator
      - security-review-community-candidates
    trust: external-source-review-required
    import: selective
  agent-skills-standard:
    url: https://agentskills.io/
    purpose: interoperable skill structure and metadata conventions
    trust: specification-reference
  skills-directory:
    url: https://skills.sh/
    purpose: discover community skills
    trust: untrusted-discovery-index
    import: never-automatic

security_review:
  required_before_import:
    - verify upstream owner and exact source path
    - inspect SKILL.md and all referenced scripts/resources
    - identify requested tools and privilege requirements
    - check for network access, secret handling and destructive operations
    - record license and provenance
    - adapt to Cusimanse security boundary and policy model
  rules:
    - external skill content is never trusted merely because of namespace or branding
    - copied skills are repository-reviewed before registry activation
    - community skills are NOT_DEPLOYED until explicitly reviewed
    - skills never grant privileges
