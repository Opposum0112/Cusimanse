version: 1
id: mcp-sources
kind: external-mcp-catalog
purpose: discover MCP servers without granting them implicit trust

sources:
  model-context-protocol:
    url: https://modelcontextprotocol.io/
    purpose: MCP specification and interoperability reference
    trust: specification-reference
  mcp-registry:
    url: https://registry.modelcontextprotocol.io/
    purpose: server discovery and metadata
    trust: discovery-index
  github:
    url: https://github.com/modelcontextprotocol/servers
    purpose: reference MCP server implementations
    trust: upstream-reference-review-required

security_review:
  required_before_activation:
    - verify exact repository/server provenance
    - inspect tool schemas and write capabilities
    - identify filesystem, shell, network and credential access
    - bind locally unless a reviewed deployment requires otherwise
    - record owner, purpose and approval requirements in registry
    - test in a disposable environment when server behavior is not obvious
  rules:
    - discovery does not imply approval
    - unknown servers are NOT_DEPLOYED
    - public exposure is denied by default
    - secrets are never passed through MCP arguments
    - privileged, VM-control and write capabilities require approval
