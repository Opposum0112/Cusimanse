version: 1
id: security-framework-reference
kind: framework-catalog
purpose: common security, threat-modeling, detection and control frameworks used to structure research contracts
frameworks:
  mitre-attack:
    use: adversary tactics, techniques and procedures mapping
    evidence: observed behavior or independently corroborated artifacts
  mitre-atlas:
    use: AI/ML attack and defense research mapping
    evidence: tested model, agent or system behavior
  nist-csf-2:
    use: cybersecurity outcomes and control coverage
    evidence: documented implementation and verification
  nist-sp-800-61:
    use: incident-response lifecycle and handling structure
    evidence: incident artifacts and response records
  nist-sp-800-53:
    use: security and privacy control catalog
    evidence: control implementation and assessment results
  nist-sp-800-115:
    use: technical security testing methodology
    evidence: authorized test procedure and results
  cis-controls-v8:
    use: prioritized defensive safeguards and gap analysis
    evidence: configuration or control verification
  owasp-asvs:
    use: application security verification requirements
    evidence: test results mapped to requirements
  owasp-top-10:
    use: web application risk classification
    evidence: reproducible finding and affected behavior
  owasp-llm-top-10:
    use: LLM application risk taxonomy
    evidence: controlled prompt/application test results
  owasp-agentic-ai:
    use: agentic application risk taxonomy
    evidence: controlled agent/tool/workflow behavior
  sigma:
    use: portable log detection engineering
    evidence: test corpus and detection results
  yara:
    use: file and artifact pattern detection
    evidence: rule match plus artifact provenance
  suricata:
    use: network IDS/NSM detection
    evidence: packet/flow capture and rule result
  sca-sbom:
    use: software supply-chain and component analysis
    evidence: SBOM, provenance and reproducible package data
  ssdf:
    use: secure software development practices
    evidence: repository/process artifacts and verification
mapping:
  research_contract_fields: [objective, scope, threat_model, hypothesis, method, evidence, acceptance, framework_mappings]
  detection_validation: [mitre-attack, sigma, yara, suricata, nist-csf-2]
  ai_agent_research: [mitre-atlas, owasp-llm-top-10, owasp-agentic-ai]
  application_security: [owasp-asvs, owasp-top-10]
  defensive_baseline: [cis-controls-v8, nist-csf-2, nist-sp-800-53]
  incident_analysis: [nist-sp-800-61, mitre-attack]
  testing_methodology: [nist-sp-800-115]
rules:
  - framework_mapping_is_context_not_evidence: true
  - use_current_upstream_taxonomy: true
  - record_framework_version_when_available: true
  - unsupported_mapping: NOT_DEPLOYED
