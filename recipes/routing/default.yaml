version: 1
id: default-routing
kind: routing
gateway_stack: recipes/gateways/model-gateways.yaml
gateways:
  primary:
    provider: litellm
    endpoint: http://127.0.0.1:4000
    credentials: environment-only
  fallback:
    provider: omniroute
    endpoint: http://127.0.0.1:20128/v1
    credentials: environment-only
harness: goose
roles:
  planner: configurable
  researcher: configurable
  runtime_analyst: configurable
  forensics: configurable
  detection: configurable
  verifier: configurable
  analysis: configurable
  report_generator: configurable
fallback: configured-provider
telemetry:
  opentelemetry: true
  bind: 127.0.0.1
security:
  forward_host_credentials: false
  gateways_are_not_security_boundary: true
