version: 1
id: go-control-plane
name: Portable Go execution layer
purpose: >-
  Define the deterministic Go package used by Goose as the portable execution
  substrate for recipe loading, capability detection, policy enforcement,
  workload execution, evidence handling and reporting.
architecture:
  library: pkg/lab
  cli: cmd/labctl
  compatibility_cli: scripts/bin/labctl
  principle: goose_reasons_go_executes
interfaces:
  recipe_engine: load_validate_resolve
  capability_engine: detect_os_arch_virtualization_tools
  policy_engine: enforce_credentials_mounts_apply_boundary
  vm_backend: provision_start_exec_collect_destroy
  instrumentation: start_stop_collect
  evidence: preserve_hash_reduce_manifest
  monitoring: start_stop_collect
  reporting: generate_report_dashboard
  git: stage_commit_push_when_recipe_permits
backends:
  vm:
    - lima-qemu
    - wsl2
  routing:
    - litellm
    - omniroute
portability:
  runtime_capability_detection: required
  unsupported_capability: NOT_DEPLOYED
  platform_specific_code: behind_backend_interfaces
  cross_compile: enabled
migration:
  from: scripts/labctl Python controller
  strategy: move deterministic primitives into Go incrementally
  python_role: compatibility_until_go_parity
  parity_required_before_retirement: true
goose_contract:
  may_request: [plan, validate, preflight, install, provision, instrument, execute, collect, reduce, report]
  must_use_control_plane: true
  may_bypass_policy: false
  may_execute_untrusted_workload_on_host: false
