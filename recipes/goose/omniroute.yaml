version: 1
id: goose-omniroute-routing
purpose: optional OpenAI-compatible model routing and token-aware optimization
provider: omniroute
endpoint: "http://127.0.0.1:4000/v1"
models:
  planner: configurable
  reviewer: configurable
  executor: configurable
  forensic-reviewer: configurable
  report-generator: configurable
routing:
  strategy: role-and-cost-aware
  fallback: configured-gateway
  preserve_evidence_outside_context: true
optimization:
  cache_reusable_context: true
  summarize_before_large_context: true
  limit_parallelism: 4
telemetry:
  opentelemetry: true
  redact_secrets: true
  bind: 127.0.0.1
