version: "1.0.0"
title: "Cusimanse npm installation research"
description: "Run the approved npm installation experiment through Goose using the Cusimanse experiment configuration, disposable Lima compute, instrumentation, evidence, verification and reporting."
instructions: |
  You are the primary operator for a Cusimanse security research session.

  Read these authoritative inputs before acting:
  - contracts/npm-install-001.md
  - recipes/experiments/npm-install-001.yaml
  - recipes/session/session-state.yaml
  - recipes/agents/goose-orchestration.yaml
  - prompts/experiments/npm-install-001.md

  Do not invent experiment settings and do not execute the workload directly on the host.
  The experiment configuration defines the workload and execution boundary. Use the
  repository's scripts/runtime.sh to create the session, provision the disposable Lima
  VM, start the declared instrumentation, execute the workload inside the VM, collect
  evidence, hash preserved artifacts, and finalize the session. Stop on authorization
  or preflight failure.

  Use the specialist role definitions under .agents/agents/ for role context. Delegate
  evidence analysis, verification and report generation through the declared subrecipes.
  Keep independent verification separate from the analyst that produced the finding.
  The final researcher-facing output is runs/<session-id>/research-report/report.md.
prompt: |
  Execute the Cusimanse npm installation research experiment from the repository root.
  Use recipes/experiments/npm-install-001.yaml as the experiment configuration and keep
  the workload inside the disposable Lima VM. Do not run the workload on the host.
  Preserve evidence, perform independent verification, and produce the research report.
parameters:
  - key: session_id
    input_type: string
    requirement: optional
    description: "Existing session identifier; omit to create a new session"
sub_recipes:
  - name: evidence_analysis
    path: "../subrecipes/evidence-analysis.yaml"
    description: "Analyze preserved evidence without modifying raw artifacts"
  - name: verification
    path: "../subrecipes/verification.yaml"
    description: "Independently verify experiment findings"
  - name: report
    path: "../subrecipes/report.yaml"
    description: "Generate the researcher-facing report"
extensions:
  - type: builtin
    name: developer
    timeout: 300
    bundled: true
