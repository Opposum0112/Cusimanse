version: 1
id: goose-token-dashboard
purpose: generate token and cost observability from gateway/agent traces
agent: report-generator
inputs:
  - gateway telemetry
  - Phoenix/OpenTelemetry traces
  - Goose run metadata
fields:
  - run_id
  - stage
  - agent
  - model
  - prompt_tokens
  - completion_tokens
  - total_tokens
  - latency_ms
  - estimated_cost
  - cache_hit
  - retry_count
aggregation:
  by: [run_id, stage, agent, model]
outputs:
  json: reports/token-usage/usage.json
  csv: reports/token-usage/usage.csv
  markdown: reports/token-usage/dashboard.md
optimisation:
  summarize_repeated_context: true
  prefer_cached_context: true
  route_simple_tasks_to_lower_cost_model: true
  preserve_full_evidence_outside_llm_context: true
