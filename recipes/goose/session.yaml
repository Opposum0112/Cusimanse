version: "1.0.0"
title: Cusimanse Goose session
description: Single operator recipe for every schema-backed experiment.
parameters:
  - key: experiment
    input_type: string
    requirement: required
    description: Experiment id matching experiments/<id>.yaml
instructions: |
  You are the only operator for this Cusimanse session.
  Load experiments/{{ experiment }}.yaml as the researcher contract.
  Load recipes/experiments/{{ experiment }}.yaml as the runtime requirements.
  Call the Go CLI at cmd/cusimanse. Do not invent limactl, host npm, or extra packages.
  Sequence:
  1. go run ./cmd/cusimanse validate
  2. go run ./cmd/cusimanse preflight
  3. go run ./cmd/cusimanse resolve {{ experiment }}
  4. Ask the researcher to approve execution.
  5. go run ./cmd/cusimanse --approved run {{ experiment }}
  6. Summon verifier, then reporter, using roles/bindings.yaml and
     recipes/subrecipes/{verification,report}.yaml.
  Read only runs/ after execute. Write analysis and the research report under the session.
  Gateway (LiteLLM/OmniRoute) and ClawMetry/Numbat are integrations, not authority.
prompt: |
  Operate experiment {{ experiment }} from experiments/{{ experiment }}.yaml
  through go run ./cmd/cusimanse, then analyze, independently verify and report.
extensions:
  - type: builtin
    name: developer
    timeout: 300
    bundled: true
  - type: platform
    name: summon
    timeout: 300
sub_recipes:
  - name: evidence_analysis
    path: "../subrecipes/evidence-analysis.yaml"
  - name: verification
    path: "../subrecipes/verification.yaml"
  - name: report
    path: "../subrecipes/report.yaml"
