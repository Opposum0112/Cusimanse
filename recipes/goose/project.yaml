version: 1
id: goose-project
name: AI Security Lab
harness: goose
role: agentic_operator_executor
source_of_truth:
  markdown: "01-*.md"
  recipe: recipes/goose/project.yaml
execution:
  orchestrator: goose
  operator: goose
  executor: goose
  policy_cli: policyctl
  shell_role: recovery-debugging-only
workloads:
  directory: recipes/workloads/
vm_profiles:
  directory: recipes/lima/profiles/
instrumentation:
  directory: recipes/instrumentation/
monitoring:
  directory: recipes/agent-monitoring/
components:
  orchestration: recipes/goose/orchestration.yaml
  gateway: recipes/gateway/default-gateway.yaml
  harness_router: recipes/gateway/harness-router.yaml
  reporting: recipes/goose/reporting.yaml
  token_dashboard: recipes/goose/token-dashboard.yaml
  installation: recipes/install/install-all.yaml
  stage_map: recipes/stages/stage-map.yaml
policy:
  cli: policyctl
  config: host policy only
portability:
  unsupported_capability: NOT_DEPLOYED
safety:
  disposable_vm_required: true
  host_credentials: deny
  host_mounts: deny
  preserve_evidence_before_destroy: true
  independent_verification: required
  human_approval_for_privileged_operations: true
  goose_is_security_boundary: false
