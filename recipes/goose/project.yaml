version: "1.0.0"
title: AI Security Lab
description: Run the AI Security Lab as a modular Goose workflow.
instructions: |
  Operate this repository as the AI Security Lab project operator.

  Read the numbered Markdown contract for the selected section, then read
  recipes/goose/project.yaml and the referenced modular YAML recipes.
  Resolve prerequisites before execution. Run the installation recipe when
  required. Never invent a capability that is not declared by a recipe.

  Workflow:
    discover -> validate -> preflight -> install -> plan -> audit/review ->
    approve -> provision -> instrument -> execute -> collect -> reduce ->
    forensic -> independent verification -> report -> destroy.

  The selected experiment is {{ experiment }}.
  The selected section is {{ section }}.

  Use the MCP registry and skill registry to determine which agent capabilities
  are available. Record every material tool/skill/MCP decision in the audit
  record. Use policyctl only for host/security policy configuration and for
  the token-usage web dashboard. Do not create or invoke another project
  controller.

  Safety rules:
    - untrusted workloads run only in disposable Lima/QEMU VMs;
    - host credentials and unrestricted host mounts are denied;
    - privileged/destructive actions require human approval;
    - evidence is preserved and hashed before VM destruction;
    - raw evidence stays outside LLM context when deterministic reduction works;
    - findings require independent verification;
    - unavailable capabilities are NOT_DEPLOYED;
    - never claim a component was exercised without runtime evidence.

  For section-only execution, perform prerequisites first and stop at the
  requested section. For project execution, run the complete lifecycle.
parameters:
  - key: experiment
    input_type: string
    requirement: required
    description: Experiment recipe ID, for example go-install-001.
  - key: section
    input_type: string
    requirement: optional
    default: project
    description: Project or one numbered section (01-11).
sub_recipes:
  - name: installation
    path: ../install/project-bootstrap.yaml
  - name: mcp-bootstrap
    path: ../mcp/bootstrap.yaml
  - name: skill-bootstrap
    path: ../skills/bootstrap.yaml
  - name: audit
    path: ../audit/default.yaml
recipe_families:
  experiments: ../experiments/
  installation: ../install/install-all.yaml
  mcp: ../mcp/registry.yaml
  skills: ../skills/registry.yaml
  audit: ../audit/default.yaml
  workloads: ../workloads/
  host_profiles: ../host/
  vm_profiles: ../lima/profiles/
  tools: ../tools/
  instrumentation: ../instrumentation/
  agent_monitoring: ../agent-monitoring/
  agents: ../agents/
  orchestration: ../orchestration/default-agent-chain.yaml
  routing: ../routing/
  reporting: ../reporting/
  token_dashboard: ../token/default.yaml
  stages: ../stages/
extensions:
  - type: builtin
    name: developer
