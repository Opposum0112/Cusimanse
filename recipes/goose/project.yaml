version: "1.0.0"
title: "Cusimanse Security Research"
description: "Goose-native research workflow using contracts, Skills, MCP extensions, subagents and optional isolated Container Use environments."
parameters:
  - key: experiment
    input_type: select
    requirement: user_prompt
    description: "Reference experiment to run"
    options:
      - go-install-001
      - npm-install-001
  - key: question
    input_type: string
    requirement: user_prompt
    description: "Research question or hypothesis"
instructions: |
  You are the primary Goose operator for a controlled Cusimanse security research experiment.

  First load the selected experiment recipe and its Markdown contract. The contract defines
  research intent, scope, authorization, safety expectations, evidence requirements and acceptance.
  The Goose recipe defines executable workflow configuration.

  Use Goose-native capabilities only: Plan/Todo, Skills, Summon subagents/subrecipes, configured
  MCP extensions, Developer tools and Container Use when isolation is appropriate. Do not invoke
  a second orchestration framework or custom control-plane service.

  Execute this lifecycle:
  1. Read and understand the contract and selected recipe.
  2. Confirm the research question and authorization.
  3. Plan the work with Goose Plan/Todo.
  4. Delegate bounded specialist analysis through Summon when useful.
  5. Select an isolated environment when the workload warrants it.
  6. Execute only the declared workload.
  7. Preserve observable outputs and artifacts under the experiment run directory.
  8. Ask a separate verification subrecipe to inspect the evidence.
  9. Write a researcher-facing report with observed facts, inference, verification, limitations and reproduction steps.

  Model output is not evidence. Never claim a security property that is not supported by observed artifacts.
prompt: |
  Run the Cusimanse experiment {{ experiment }} for this research question:

  {{ question }}

  Start by loading the experiment contract and recipe. Use Goose-native planning, Skills,
  Summon/subrecipes and configured MCP tools. Prefer Container Use when an isolated environment
  is needed. Preserve evidence and produce the final research report.
extensions:
  - type: platform
    name: summon
    description: "Goose-native subagent and subrecipe delegation"
sub_recipes:
  - name: verification
    path: "./subrecipes/verification.yaml"
    description: "Independently inspect experiment evidence and report verification status"
  - name: evidence-analysis
    path: "./subrecipes/evidence-analysis.yaml"
    description: "Analyze captured experiment artifacts without changing the workload"
settings:
  max_turns: 50
