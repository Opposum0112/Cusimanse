version: "1.0.0"
title: "Independent verification"
description: "Check experiment conclusions against the recorded evidence."
parameters:
  - key: evidence_path
    input_type: string
    requirement: user_prompt
    description: "Path to the captured evidence"
  - key: findings
    input_type: string
    requirement: user_prompt
    description: "Findings to verify"
prompt: |
  Independently verify these findings against the evidence at {{ evidence_path }}:

  {{ findings }}

  Do not trust the parent agent's conclusion. Inspect the underlying artifacts, identify
  unsupported claims, and return PASS, PARTIAL or FAIL with concise evidence references.
instructions: |
  Verification is an independent review of recorded artifacts. Do not modify evidence or invent missing observations.
