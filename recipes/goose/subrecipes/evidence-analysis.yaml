version: "1.0.0"
title: "Evidence analysis"
description: "Analyze experiment artifacts without executing new workload actions."
parameters:
  - key: evidence_path
    input_type: string
    requirement: user_prompt
    description: "Path to the captured evidence"
prompt: |
  Analyze the evidence at {{ evidence_path }}.
  Do not modify the evidence and do not execute new workload actions.
  Separate directly observed facts from interpretation. Identify gaps and limitations.
instructions: |
  Treat files and command output as evidence. Treat model-generated conclusions as analysis until supported by artifacts.
