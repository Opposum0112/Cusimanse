arch: "default"
vmType: "qemu"
cpus: 4
memory: "4GiB"
disk: "30GiB"
mounts: []
networks:
  - lima: user-v2
ssh:
  loadDotSSHPubKeys: false
provision:
  - mode: system
    script: |
      set -eux
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl git golang-go nodejs npm strace tcpdump iproute2 iputils-ping dnsutils lsof inotify-tools file psmisc procps
      rm -rf /var/lib/apt/lists/*
