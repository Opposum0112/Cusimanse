version: 1
id: detection-validation
kind: recipe
purpose: validate evidence-backed detections against captured runtime and static artifacts
inputs:
  required: [run_id]
  optional: [rule_set, baseline, attack_mapping]
preconditions:
  - evidence exists and is hashed
  - telemetry collection completed
  - detection content is versioned
  - workload authorization is established
stages:
  - id: normalize
    action: deterministic-reduce
    outputs: [normalized-events, iocs]
  - id: static-check
    action: validate-rules
    families: [yara, sigma, suricata]
  - id: replay
    action: replay-against-captured-evidence
    isolation: no-network-by-default
  - id: correlate
    action: correlate-detections-with-evidence
  - id: attack-map
    action: map-confirmed-behavior
    framework: mitre-attack
  - id: independent-review
    action: challenge-detection-result
  - id: report
    action: emit-detection-validation-report
acceptance:
  true_positive: evidence-backed-match
  false_positive: benign-baseline-match
  inconclusive: insufficient-evidence
  missing_capability: NOT_DEPLOYED
controls:
  no_live_unapproved_payloads: true
  no_public_mcp: true
  preserve_evidence_before_destroy: true
  independent_verification: required
  external_reference_data: enrichment-only
outputs:
  - detections/
  - validation/
  - verification/
  - reports/detection-validation.json
