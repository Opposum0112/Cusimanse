id: security-research-taskflow
version: 1.0
kind: taskflow-reference
purpose: "Taskflow-style campaign sequencing consumed by the Cusimanse execution layer"
tasks:
  - id: discover
    agent_role: hunter
    must_complete: true
  - id: analyze
    agent_role: soc_analyst
    depends_on: [discover]
    must_complete: true
  - id: detection
    agent_role: detection_engineer
    depends_on: [analyze]
    must_complete: true
  - id: tool_validation
    agent_role: tool_integrator
    depends_on: [detection]
    must_complete: true
  - id: independent_verification
    agent_role: verifier
    depends_on: [tool_validation]
    must_complete: true
  - id: skill_promotion
    agent_role: reviewer
    depends_on: [independent_verification]
    approval: human
execution:
  state_engine: langgraph
  evidence_authority: cusimanse-case-store
  security_boundary: lima-qemu-vm
  missing_capability: NOT_DEPLOYED
