kind: host-toolchain
version: 6
purpose: >-
  Declarative host inventory. Host tools needed to operate the experiment are
  separated from Linux guest instrumentation tools. Preflight selects the host
  capability group for the current platform; guest-only tools are never treated
  as native macOS or Windows requirements.
common:
  commands: [git, bash, curl, python3, node, npm, go, jq, yq, rg, goose]
  python_packages: [phoenix, opentelemetry-api, opentelemetry-sdk, opentelemetry-exporter-otlp]
platforms:
  linux:
    commands: [limactl, qemu-system-x86_64]
  macos:
    commands: [limactl, qemu-system-aarch64]
    notes: x86_64 QEMU is not required on Apple Silicon; Linux-only collectors run in the Lima guest.
  windows_wsl2:
    commands: [limactl, qemu-system-x86_64]
    notes: Full reference experiments use WSL2 because the guest instrumentation stack is Linux based.
  windows_native:
    commands: []
    experiment_ready: false
    notes: Native Windows may inspect the repository and install agents, but reference VM experiments require WSL2.
guest:
  commands: [strace, tcpdump, ss, ip, dig, getent, lsof, find, stat, sha256sum, inotifywait, file, ps, pgrep]
mandatory_services:
  gateways: [litellm, omniroute]
  observability: [numbat, aegis, phoenix, opentelemetry, clawmetry]
  primary_agent: goose
configuration:
  root: ~/.config/cusimanse/
  gateway: ~/.config/cusimanse/litellm.yaml
  gateway_environment: ~/.config/cusimanse/omniroute.env
  observability_environment: ~/.config/cusimanse/observability.env
  goose_environment: ~/.config/cusimanse/goose.env
  aegis_checkout: ~/.local/share/cusimanse/aegis/
  python_environment: ~/.local/share/cusimanse/venv/
access:
  path_prepend: "$HOME/.local/bin:$HOME/go/bin"
  inventory_command: ./scripts/tools.sh list
  version_command: ./scripts/tools.sh versions
  config_command: ./scripts/tools.sh config
  secrets_not_printed: true
optional_adapters:
  recipe: recipes/agents/adapter-installation.yaml
installation:
  entrypoint: ./scripts/install.sh
  windows_entrypoint: ./scripts/install.ps1
  idempotent: true
  configure_from_recipe: true
  fail_if_required_capability_unavailable: true
  unsupported_platform: report-and-stop-before-experiment
  remote_install_policy: download-to-temp-then-execute
