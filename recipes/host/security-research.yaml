kind: host-toolchain
version: 4
purpose: >-
  Declarative inventory for the complete host toolchain. The recipe is the
  source of truth for mandatory capabilities; scripts/install.sh implements
  it and scripts/tools.sh exposes the resulting inventory.
required:
  commands:
    - git
    - bash
    - curl
    - python3
    - ruby
    - node
    - npm
    - go
    - limactl
    - qemu-system-x86_64
    - goose
    - jq
    - yq
    - rg
    - strace
    - tcpdump
    - ss
    - ip
    - dig
    - getent
    - lsof
    - find
    - stat
    - sha256sum
    - inotifywait
    - file
    - ps
    - pgrep
    - litellm
    - omniroute
    - numbat
    - clawmetry
  python_packages: [phoenix, opentelemetry-api, opentelemetry-sdk, opentelemetry-exporter-otlp]
  host_observer: [aegis]
mandatory:
  gateways: [litellm, omniroute]
  observability: [numbat, aegis, phoenix, opentelemetry, clawmetry]
  primary_agent: goose
optional_adapters:
  recipe: recipes/agents/adapter-installation.yaml
configuration:
  root: ~/.config/cusimanse/
  gateway: ~/.config/cusimanse/litellm.yaml
  gateway_environment: ~/.config/cusimanse/omniroute.env
  observability_environment: ~/.config/cusimanse/observability.env
  goose_environment: ~/.config/cusimanse/goose.env
  aegis_checkout: ~/.local/share/cusimanse/aegis/
  python_environment: ~/.local/share/cusimanse/venv/
access:
  path_prepend: "$HOME/.local/bin:$HOME/go/bin"
  inventory_command: ./scripts/tools.sh list
  version_command: ./scripts/tools.sh versions
  config_command: ./scripts/tools.sh config
  secrets_not_printed: true
platforms:
  linux: [apt, dnf, pacman, zypper]
  macos: [homebrew]
  windows: [native-powershell-shim, wsl2]
  fallback: report-unsupported-and-stop-before-experiment
installation:
  entrypoint: ./scripts/install.sh
  windows_entrypoint: ./scripts/install.ps1
  idempotent: true
  configure_from_recipe: true
  fail_if_required_capability_unavailable: true
