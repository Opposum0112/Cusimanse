id: harness-router
kind: harness-router
harnesses:
  antigravity:
    enabled: true
    transport: mcp-or-shell
  opencode:
    enabled: true
    transport: mcp-or-shell
  goose:
    enabled: true
    transport: mcp-or-shell
  codex:
    enabled: true
    transport: mcp-or-shell
routing:
  planner: planner
  reviewer: reviewer
  executor: executor
  forensics: forensics
execution:
  controller: scripts/bin/labctl
  normal_shell: true
  agent_shell: false
  explicit_apply_required: true
