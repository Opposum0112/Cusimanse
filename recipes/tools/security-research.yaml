version: 3
id: security-research-tools
kind: tools
host:
  required:
    - git
    - bash
    - curl
    - python3
    - ruby
    - go
    - limactl
    - qemu
  optional:
    - jq
    - yq
    - rg
    - tcpdump
    - strace
    - lsof
    - numbat
    - miller
    - ponytail
    - node
    - npm
    - aegis
vm:
  required:
    - ps
    - pgrep
    - lsof
    - ss
    - ip
    - dig
    - getent
    - find
    - stat
    - sha256sum
  optional:
    - strace
    - tcpdump
    - bpftrace
    - node
    - npm
agent:
  interface: adapter
  tool_calls: observable
orchestration:
  owner: selected-primary-agent
  native_multiagent: preferred
  optional_learning_helpers: [langgraph, taskflow]
  competing_frameworks: false
rules:
  unknown_tools: NOT_DEPLOYED
  unknown_installers: deny
  host_credentials: deny
  orchestration_bypass: deny
notes:
  host_inventory_source: this recipe is the source of truth for host preparation and preflight capability checks
  lima_qemu_boundary: Lima is the VM lifecycle interface and QEMU is the default backend; provider-specific executable names are normalized by preflight
  vm_tools: workload-specific tools such as node/npm are installed inside disposable compute by the workload recipe, not required on the host
  learning_helpers: installed only when explicitly selected for post-research learning on the host/control plane
