version: 1
id: security-research-tools
kind: tools
host:
  required: [git, bash, limactl, qemu-system-x86_64]
  optional: [jq, yq, rg, tcpdump, strace, lsof, numbat]
vm:
  required: [ps, pgrep, lsof, ss, ip, dig, getent, find, stat, sha256sum]
  optional: [strace, tcpdump, bpftrace]
agent:
  interface: adapter
  tool_calls: observable
rules:
  unknown_tools: NOT_DEPLOYED
  unknown_installers: deny
  host_credentials: deny
