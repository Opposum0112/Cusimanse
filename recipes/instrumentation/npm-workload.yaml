schema: cusimanse.recipe/instrumentation/v1
name: npm-workload-instrumentation
plane: execution_instrumentation
purpose: Instrument an npm workload inside the disposable VM and preserve telemetry as evidence.
selection:
  stage: recipe_graph
  selected_by: experiment_recipe
  executed_by: primary_agent_adapter
workload:
  type: npm
  command: npm test
  working_directory: /workspace/target
instrumentation:
  telemetry:
    - process
    - filesystem
    - network
    - syscall
    - package-installation
  tools:
    - opentelemetry
    - strace
    - lsof
    - tcpdump
  optional_tools:
    - yara
  start_before_workload: true
  stop_after_workload: true
  vm_only: true
collection:
  raw_artifacts: evidence/runs/${run_id}/npm/
  telemetry: blackboard/runs/${run_id}/telemetry/
  audit: blackboard/runs/${run_id}/audit/
  hashes: blackboard/runs/${run_id}/provenance/hashes.sha256
analysis:
  role: recipes/roles/analysis-report-generator.yaml
  correlate: [workload-events, telemetry, audit, package-lock]
acceptance:
  no_host_execution: true
  evidence_preserved_before_vm_destroy: true
  independent_verification: required
