id: security-research-learning
version: 1.0
kind: campaign
hypothesis: "Discover, validate and safely reuse a security-analysis capability"
roles:
  - hunter
  - soc_analyst
  - detection_engineer
  - tool_integrator
stages:
  - id: discover
    purpose: identify the research question and required artifacts
  - id: retrieve
    purpose: retrieve candidate validated skills
  - id: plan
    purpose: construct an evidence-bounded execution plan
  - id: approve
    purpose: require approval for privileged, destructive or promotion actions
  - id: execute
    purpose: operate the disposable experiment
  - id: collect
    purpose: preserve raw evidence and provenance
  - id: analyze
    purpose: reduce evidence and form findings
  - id: verify
    purpose: independently verify important findings
  - id: learn
    purpose: create a candidate skill from a demonstrated reusable procedure
  - id: promote
    purpose: promote only an independently verified and approved skill
    gate: human_approval
promotion:
  minimum_validated_cases: 2
  minimum_distinct_artifacts: 2
  require_replay: true
  require_independent_verification: true
  require_human_approval: true
  require_provenance: true
  require_capability_manifest: true
  max_false_positive_rate: 0.20
safety:
  deny_tools:
    - raw_shell_unbounded
  credentials_in_skill_source: false
  public_mcp_exposure: false
  host_root_mounts: false
outputs:
  - case_state
  - evidence_manifest
  - findings
  - skill_candidate
  - verification_record
