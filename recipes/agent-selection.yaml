version: 3
id: agent-selection
kind: bootstrap-contract
selection:
  prompt: Select one primary Cusimanse operator shell
  exactly_one: true
  options:
    - goose
    - opencode
    - grok-build
    - antigravity
    - pi
    - hermes
    - codex
    - prime-intellect
  enterprise_options:
    - claude-code
    - devin
install:
  selected_only: true
preflight:
  selected_only: true
  checks:
    - command_or_api_available
    - provider_configuration_present_without_secret_output
    - common_contract_loads
    - primary_shell_contract_loads
    - yaml_recipes_load
    - policyctl_validate
    - audit_paths_available
    - evidence_paths_available
    - non_destructive_smoke_test
execution:
  mode: agent-shell-driven
  operator: selected_primary_agent
  orchestration: selected_primary_agent_shell
  execution: selected_primary_agent_shell
  lifecycle: selected_primary_agent_shell
  host_scripts: bootstrap-validation-configuration-only
  native_cli_required: true
  reference_contract: recipes/agents/primary-agent.yaml
  shell_contract: recipes/agents/primary-shell.yaml
state:
  bootstrap_path: .cusimanse/primary-agent.yaml
  session_path: runs/<session-id>/session.yaml
  session_records:
    - selected_adapter
    - adapter_version
    - interactive_command
    - run_command
    - prompt_ref
    - prompt_digest
  commit: false
  secrets: forbidden
failure:
  unavailable: NOT_DEPLOYED
  continue_with_unselected: false
