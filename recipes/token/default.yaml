version: 1
id: default-token-dashboard
kind: token-usage
owner: policyctl
session_contract: recipes/session/session-state.yaml
inputs:
  - gateway telemetry
  - OpenTelemetry traces
  - agent run metadata
fields: [session_id, run_id, stage, agent, model, prompt_tokens, completion_tokens, total_tokens, latency_ms, estimated_cost, cache_hit, retry_count]
outputs:
  json: reports/token-usage/usage.json
  csv: reports/token-usage/usage.csv
  markdown: reports/token-usage/dashboard.md
  session: runs/<session-id>/observability/token-usage.yaml
  dashboard_snapshot: runs/<session-id>/observability/dashboard.yaml
web_dashboard:
  command: policyctl token-dashboard
  bind: 127.0.0.1:8787
  public_exposure: deny
session_lifecycle:
  initialize: create_active_session
  checkpoint: record_observable_usage
  finalize: write_session_snapshot
  clear_active_view: true
  retain_history: true
optimization:
  summarize_repeated_context: true
  prefer_cached_context: true
  route_simple_tasks_to_lower_cost_model: true
  preserve_full_evidence_outside_llm_context: true
