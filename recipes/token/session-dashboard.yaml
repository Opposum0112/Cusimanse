version: 1
id: session-token-dashboard
kind: observability-recipe
purpose: maintain session-wise model and agent token usage
capture:
  - session-start
  - model-call
  - agent-turn
  - tool-call
  - session-end
fields: [timestamp, session_id, run_id, agent, model, provider, input_tokens, output_tokens, cached_tokens, total_tokens, duration_ms, task]
aggregation:
  - per-session
  - per-run
  - per-agent
  - per-model
persistence: evidence/token-usage/session.jsonl
update_mode: append-on-event
secrets: never-record
