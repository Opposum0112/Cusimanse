title: Cusimanse Go installation experiment
description: Run the approved Go installation workload in disposable Lima compute and produce evidence, verification and report artifacts.
instructions: |
  Operate the Cusimanse Go experiment using the companion configuration at
  recipes/experiments/go-install-001.yaml and contract contracts/go-install-001.md.
  Read the experiment configuration and session-state contract before acting.
  Create or resume the session, validate authorization and approvals, provision
  the declared Lima/QEMU VM, start every collector declared by the instrumentation
  profile before the workload, execute the declared workload inside the VM, collect
  and hash evidence, perform specialist analysis and independent verification,
  write the research report, preserve the evidence and only then destroy the VM.
  Never treat model output as evidence. Record unavailable capabilities as
  PARTIAL/NOT_DEPLOYED rather than silently changing the experiment. Use native
  Goose delegation and the semantic roles under .agents/agents/ when specialist
  work is required.

# Cusimanse metadata; the Goose-required fields above are the executable recipe contract.
cusimanse:
  version: 2
  experiment: recipes/experiments/go-install-001.yaml
  contract: contracts/go-install-001.md
  prompt_reference: prompts/experiments/go-install-001.md
  session_state: recipes/session/session-state.yaml
  roles: .agents/agents/
  orchestration: recipes/agents/goose-orchestration.yaml
  subrecipes:
    - recipes/subrecipes/evidence-analysis.yaml
    - recipes/subrecipes/verification.yaml
    - recipes/subrecipes/report.yaml
  gateways: recipes/gateway/mandatory.yaml
  observability: recipes/observability/mandatory.yaml
  skills: recipes/skills/registry.yaml
  mcp: recipes/mcp/registry.yaml
