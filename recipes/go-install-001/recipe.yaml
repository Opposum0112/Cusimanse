version: "1.0.0"
title: "Cusimanse Go installation research"
description: "Run the approved Go installation experiment in disposable Lima compute and produce preserved evidence, independent verification and a research report."
instructions: |
  You are the primary Goose operator for a Cusimanse security research session.

  Read contracts/go-install-001.md and recipes/experiments/go-install-001.yaml first.
  The companion file is Cusimanse experiment configuration; this file is the executable
  Goose recipe. Do not invent experiment settings.

  First execute the deterministic runtime harness from the repository root:
    ./scripts/run-experiment.sh go-install-001
  The harness creates the session, validates the recipe, provisions disposable Lima/QEMU,
  starts the declared guest collectors before the workload, executes the approved workload,
  captures raw evidence and hashes it. It stops at EVIDENCE_COLLECTED and leaves the
  session available for you.

  Then read the generated runs/<session-id>/session.yaml and evidence. Use the specialist
  role definitions under .agents/agents/. Delegate evidence analysis, forensics/detection,
  independent verification and report generation through the registered Goose subrecipes.
  Keep verification independent from analysis. Replace the provisional analysis,
  verification and report status files with substantive, evidence-cited results.

  After verification succeeds, advance the session through REPORTED and PRESERVED,
  hash the final artifact set again, destroy the disposable VM, then checkpoint DESTROYED
  and COMPLETE. Never execute the workload on the host and never treat model output as evidence.
  Record unavailable capabilities as PARTIAL/NOT_DEPLOYED; never weaken policy or the VM boundary.
prompt: |
  Execute the Cusimanse Go installation experiment. Start with ./scripts/run-experiment.sh
  go-install-001, then analyze its preserved evidence, independently verify the findings,
  produce the final researcher report, preserve the final hashes and complete the session.
sub_recipes:
  - name: evidence_analysis
    path: "../subrecipes/evidence-analysis.yaml"
  - name: verification
    path: "../subrecipes/verification.yaml"
  - name: report
    path: "../subrecipes/report.yaml"
extensions:
  - type: builtin
    name: developer
    timeout: 300
    bundled: true
