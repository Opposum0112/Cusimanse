version: 1
title: Cusimanse Go installation experiment
description: Run the approved Go installation experiment in disposable Lima compute, collect evidence, verify results, and produce the researcher report.
instructions: |
  You are the primary operator for this Cusimanse experiment.

  Read contracts/go-install-001.md and recipes/experiments/go-install-001.yaml first. The companion experiment configuration is the authoritative Cusimanse configuration; this file is the executable Goose recipe wrapper.

  Create or resume the session using recipes/session/session-state.yaml. Validate authorization and approvals. Provision the declared Lima/QEMU VM and start every collector declared by the instrumentation profile before executing the workload.

  Execute only inside the disposable VM:
    go version
    go install ./packages/labprobe
    labprobe

  Preserve raw evidence, generate hashes and provenance, delegate analysis/verification/reporting through the declared subrecipes and semantic roles, and write the required session artifacts. Preserve evidence before destroying the VM.

  Never treat model output as evidence. Never run the workload on the host. Never change the contract or companion experiment configuration during execution. Record unavailable capabilities as PARTIAL/NOT_DEPLOYED.

# Only Goose schema fields above are executable recipe fields. Cusimanse metadata is namespaced to avoid pretending it is part of Goose's native recipe schema.
cusimanse:
  experiment: recipes/experiments/go-install-001.yaml
  contract: contracts/go-install-001.md
  prompt_reference: prompts/experiments/go-install-001.md
  session_state: recipes/session/session-state.yaml
  roles: .agents/agents/
  orchestration: recipes/agents/goose-orchestration.yaml
  subrecipes:
    - recipes/subrecipes/evidence-analysis.yaml
    - recipes/subrecipes/verification.yaml
    - recipes/subrecipes/report.yaml
  gateways: recipes/gateway/mandatory.yaml
  observability: recipes/observability/mandatory.yaml
  skills: recipes/skills/registry.yaml
  mcp: recipes/mcp/registry.yaml
