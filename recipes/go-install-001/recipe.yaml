version: "1.0.0"
title: "Cusimanse Go installation experiment"
description: "Run the approved Go installation workload in a disposable Lima VM, collect instrumentation evidence, verify findings and produce the researcher report."
instructions: |
  Act as the primary Goose operator.
  1. Read contracts/go-install-001.md.
  2. Run ./scripts/preflight.sh.
  3. Review scope and ask for approval before privileged or destructive actions.
  4. Create the disposable VM from recipes/lima/security-research.yaml.
  5. Start recipes/instrumentation/security-research.yaml collectors before the workload.
  6. Copy packages/labprobe into the VM and run exactly:
       go version
       go install ./packages/labprobe
  7. Store command output and collected observations under runs/<session-id>/evidence/.
  8. Delegate evidence analysis and independent verification to the listed subrecipes.
  9. Generate runs/<session-id>/research-report/report.md and report.yaml.
  10. Preserve hashes/provenance and destroy the VM.
  Model output is analysis, never evidence. Material findings must cite observable artifacts.
prompt: "Run the Go installation experiment from contracts/go-install-001.md and complete the full lifecycle."
extensions:
  - type: builtin
    name: developer
    timeout: 600
    bundled: true
sub_recipes:
  - name: evidence-analysis
    path: ../subrecipes/evidence-analysis.yaml
  - name: verification
    path: ../subrecipes/verification.yaml
  - name: report
    path: ../subrecipes/report.yaml
