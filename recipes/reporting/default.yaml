version: 1
id: default-reporting
kind: reporting
agent: goose
inputs: [evidence/, reports/goose/]
outputs:
  markdown: reports/goose/final-report.md
  yaml: reports/goose/final-report.yaml
rules:
  cite_evidence: true
  distinguish_observed_from_inferred: true
  include_versions: true
  include_failed_steps: true
  include_agent_actions: true
  no_unverified_security_claims: true
