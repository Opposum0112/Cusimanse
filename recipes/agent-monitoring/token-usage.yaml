schema: cusimanse.recipe/token-usage/v1
name: session-token-usage
plane: observability_governance
purpose: Track and inspect token consumption for every agent/model/tool session.
contract:
  skill: .agents/skills/token-optimization/SKILL.md
  command: cusimanse-token-dashboard
  policy_interface: policyctl token-dashboard
  bind_address: 127.0.0.1:8787
ledger:
  path: reports/token-usage/usage.json
  required_fields: [session_id, agent, model, input_tokens, output_tokens, total_tokens, tool_call_count, cache_usage, estimated_cost, optimization_notes]
validation:
  syntax: bash -n scripts/token-dashboard.sh
  data: valid-json-object-or-array
  security: localhost-only
  authorization: false
  note: token accounting is observability only and never authorizes execution.
