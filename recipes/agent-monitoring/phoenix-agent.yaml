id: phoenix-agent
kind: agent-monitoring
backend: phoenix
otel:
  endpoint: http://127.0.0.1:4317
  protocol: grpc
  service_name: cusimanse-agent
capture:
  traces: true
  spans: true
  tool_calls: true
  model_calls: true
  errors: true
  approvals: true
privacy:
  redact_secrets: true
  redact_environment: true
bind_address: 127.0.0.1
