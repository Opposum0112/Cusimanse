version: "1.0.0"
title: AI Security Lab audit layer
description: Produce a tamper-evident audit record for agent decisions and capability use.
instructions: |
  Maintain an append-only audit record for the current project run.

  Record at minimum:
    timestamp, run_id, section, experiment, agent_role, skill, mcp_server,
    tool, action, arguments_digest, policy_decision, approval_state,
    result_state, evidence_refs and error.

  Never record secrets or raw credentials. Hash sensitive argument material
  rather than storing it. Distinguish requested, approved, executed and
  observed actions. A plan is not evidence of execution.

  Store audit events under evidence/audit/ and include a manifest hash in the
  final report. If the audit layer is unavailable, report PARTIAL or
  NOT_DEPLOYED rather than fabricating events.
parameters:
  - key: run_id
    input_type: string
    requirement: required
    description: Stable identifier for the current project run.
