version: "1.0.0"
title: "Cusimanse npm installation research"
description: "Run the approved npm installation experiment in disposable Lima compute and produce preserved evidence, independent verification and a research report."
instructions: |
  You are the primary Goose operator for a Cusimanse security research session.

  Read contracts/npm-install-001.md and recipes/experiments/npm-install-001.yaml first.
  This Goose recipe is the executable handoff; the companion file is the Cusimanse
  experiment configuration. Do not invent experiment settings.

  First execute the deterministic runtime harness from the repository root:
    ./scripts/run-experiment.sh npm-install-001
  The harness creates the session, validates the recipe, provisions disposable Lima/QEMU,
  starts declared guest collectors before the workload, executes the approved baseline,
  captures raw evidence and hashes it. It stops at EVIDENCE_COLLECTED.

  Then read the generated session and evidence. Use .agents/agents/ specialist role
  definitions and the registered Goose subrecipes for evidence analysis, forensics/detection,
  independent verification and report generation. Keep verification independent from analysis.
  Replace provisional status files with substantive, evidence-cited results.

  After verification succeeds, advance the session through REPORTED and PRESERVED,
  hash the final artifact set, destroy the disposable VM, then checkpoint DESTROYED and
  COMPLETE. The baseline deliberately uses --ignore-scripts; do not enable lifecycle scripts
  in this experiment. Use npm-lifecycle-001 for the authorized local lifecycle control.
  Never execute the workload on the host and never treat model output as evidence.
prompt: |
  Execute the Cusimanse npm installation experiment. Start with ./scripts/run-experiment.sh
  npm-install-001, then analyze preserved evidence, independently verify findings, produce
  the final researcher report, preserve hashes and complete the session.
sub_recipes:
  - name: evidence_analysis
    path: "../subrecipes/evidence-analysis.yaml"
  - name: verification
    path: "../subrecipes/verification.yaml"
  - name: report
    path: "../subrecipes/report.yaml"
extensions:
  - type: builtin
    name: developer
    timeout: 300
    bundled: true
