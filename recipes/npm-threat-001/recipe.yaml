version: "1.0.0"
title: "Cusimanse controlled npm threat research"
description: "Run the controlled adversarial-like npm lifecycle fixture through the Go capability API without executing untrusted code on the host."
instructions: |
  You are the primary Goose operator for a Cusimanse threat-model session.
  Read contracts/npm-threat-001.md and recipes/experiments/npm-threat-001.yaml before execution.
  Resolve with: go run ./cmd/cusimanse resolve npm-threat-001
  After explicit researcher approval, operate with: go run ./cmd/cusimanse --approved run npm-threat-001
  The fixture is local and harmless. Do not add external destinations or execute it on the host.
  Delegate evidence analysis, independent verification and reporting through registered specialist roles.
  Preserve final evidence and provenance before destroying disposable compute.
prompt: |
  Operate npm-threat-001 through the Go capability API, analyze preserved evidence, independently
  verify findings, report, preserve artifacts and complete the lifecycle safely.
sub_recipes:
  - name: evidence_analysis
    path: "../subrecipes/evidence-analysis.yaml"
  - name: verification
    path: "../subrecipes/verification.yaml"
  - name: report
    path: "../subrecipes/report.yaml"
