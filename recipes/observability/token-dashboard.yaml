version: 1
id: token-dashboard
kind: session-observability
purpose: Track model/tool token usage per research session and finalize the active dashboard state at session completion.

ledger:
  path: reports/token-usage/usage.json
  session_path: runs/<session-id>/observability/token-usage.yaml
  required_fields: [session_id, started_at, completed_at, adapter, model, input_tokens, output_tokens, total_tokens]

session_lifecycle:
  initialize: create_active_session_snapshot
  checkpoint: update_after_observable_model_call
  finalize: write_completed_session_snapshot
  clear_active_view: true
  retain_history: true

required_end_state:
  dashboard_snapshot: runs/<session-id>/observability/dashboard.yaml
  active_session: null
  session_status: COMPLETE|PARTIAL|FAILED

safety:
  secrets_in_prompts: deny
  credentials_in_telemetry: deny
  observability_is_security_boundary: false
  missing_provider_metrics: PARTIAL
