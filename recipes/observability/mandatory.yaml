kind: host-observability
version: 3
required: true
mandatory_host_stack: true
installation:
  owner: scripts/install.sh
  lifecycle: install-configure-preflight-session-start-session-end
components:
  numbat:
    command: numbat
    mode: monitor-only
    records: ~/.numbat/cusimanse.ndjson
    access: ./scripts/tools.sh numbat
  aegis:
    source: antropos17/Aegis
    mode: monitor-only
    independent_observer: true
    data: ~/.local/share/cusimanse/aegis/
  phoenix:
    python_import: phoenix
    mode: telemetry
    ui: http://127.0.0.1:6006
  opentelemetry:
    python_import: opentelemetry
    mode: telemetry
    otlp_http: http://127.0.0.1:4318
  clawmetry:
    command: clawmetry
    mode: goose-session-and-token-visibility
    ui: http://127.0.0.1:8900
    per_run_snapshot: runs/<session-id>/observability/token-usage.yaml
configuration:
  generated_by_installer: true
  secret_source: environment-only
  environment: ~/.config/cusimanse/observability.env
correlation:
  required_fields: [experiment_id, session_id, run_id, agent_id, role, skill, capability, workload_id, trace_id, timestamp]
research_reporting:
  role: report-generator
  inputs: [requirements, evidence, specialist-analysis, independent-verification, observability]
  outputs: [runs/<session-id>/research-report/report.md, runs/<session-id>/research-report/report.yaml]
security:
  observers_are_not_security_boundaries: true
  telemetry_must_not_contain_credentials: true
  missing_observability_is_recorded_as_partial: true
