id: numbat
version: 1
component: observability
provider: perplexityai/numbat
install:
  method: go-install
  package: github.com/perplexityai/numbat/cmd/numbat@latest
  fallback: official-release
runtime:
  bind: 127.0.0.1:4318
  protocol: otlp-http
  mode: monitor
security:
  is_boundary: false
  outbound_default: deny-unless-configured
  credentials_from_agent_args: false
status: NOT_DEPLOYED
