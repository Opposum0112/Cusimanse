version: "1.0.0"
title: "npm installation research"
description: "Observe a pinned npm installation with Goose-native tools and produce a reproducible report."
prompt: |
  Run the npm installation experiment described by contracts/12-npm-install-001.md.
  Use Goose Plan/Todo to structure the work and Container Use when isolation is appropriate.
  Execute only:

    node --version
    npm --version
    mkdir -p /tmp/npm-test
    cd /tmp/npm-test && npm init -y
    cd /tmp/npm-test && npm install lodash@4.17.21 --ignore-scripts

  Preserve command output and generated package metadata in experiments/npm-install-001/runs/<run-id>/.
  Delegate evidence analysis and independent verification to the recipe subrecipes.
  Finish with a Markdown research report that separates observations from inference.
instructions: |
  Work only within the Cusimanse repository and the selected experiment environment.
  Do not execute package lifecycle scripts for this reference workload.
sub_recipes:
  - name: evidence-analysis
    path: "../subrecipes/evidence-analysis.yaml"
  - name: verification
    path: "../subrecipes/verification.yaml"
