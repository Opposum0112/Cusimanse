kind: cusimanse-experiment
version: 4
id: npm-install-001
purpose: Observe a pinned npm project bootstrap/install in disposable Lima compute without lifecycle hooks.
contract: contracts/npm-install-001.md
requirements:
  execution: disposable
  os: linux
  workload: npm-install
  instrumentation: [process, syscall, filesystem, network]
policy:
  enforcement: internal/policy
  policy_file: policies/host-policy.yaml
  mount_denylist: policies/mount-denylist.yaml
  permission_tiers: policies/permission-tiers.yaml
  required_checks: [vm, network, mounts]
session:
  state: recipes/session/session-state.yaml
threat_model:
  coverage: [process-observation, syscall-observation, filesystem-observation, network-observation, pinned-package-install]
  limitations: [ignore-scripts-does-not-test-postinstall, does-not-test-malicious-package, does-not-test-agent-escape]
agent:
  reference: goose
  adapters: recipes/agents/adapter-matrix.yaml
  orchestration: recipes/agents/goose-orchestration.yaml
subrecipes:
  - recipes/subrecipes/evidence-analysis.yaml
  - recipes/subrecipes/verification.yaml
  - recipes/subrecipes/report.yaml
gateways: recipes/gateway/mandatory.yaml
observability: recipes/observability/mandatory.yaml
skills: recipes/skills/registry.yaml
mcp: recipes/mcp/registry.yaml
