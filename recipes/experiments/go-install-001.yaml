kind: cusimanse-experiment
version: 2
id: go-install-001
purpose: Observe a Go installation and harmless local binary execution in disposable Lima compute.
contract: contracts/go-install-001.md
host:
  recipe: recipes/host/security-research.yaml
compute:
  recipe: recipes/lima/security-research.yaml
instrumentation:
  recipe: recipes/instrumentation/security-research.yaml
session:
  state: recipes/session/session-state.yaml
workload:
  execution: disposable-lima-vm
  commands:
    - go version
    - go install ./packages/labprobe
    - labprobe
threat_model:
  coverage:
    - process-observation
    - syscall-observation
    - filesystem-observation
    - network-observation
    - package-build-and-install
  limitations:
    - does-not-emulate-malicious-package
    - does-not-test-agent-escape
    - does-not-test-privilege-escalation
agent:
  reference: goose
  adapters: recipes/agents/adapter-matrix.yaml
  orchestration: recipes/agents/goose-orchestration.yaml
subrecipes:
  - recipes/subrecipes/evidence-analysis.yaml
  - recipes/subrecipes/verification.yaml
  - recipes/subrecipes/report.yaml
gateways: recipes/gateway/mandatory.yaml
observability: recipes/observability/mandatory.yaml
skills: recipes/skills/registry.yaml
mcp: recipes/mcp/registry.yaml
