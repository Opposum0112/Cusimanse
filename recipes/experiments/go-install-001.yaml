version: "1.0.0"
title: "Go installation research"
description: "Observe a Go installation workload with Goose-native tools and produce a reproducible report."
prompt: |
  Run the Go installation experiment described by contracts/08-go-install-001.md.
  Inspect the contract before execution. Use Goose Plan/Todo to structure the work.
  Use the Developer extension or Container Use for the workload environment.
  Execute only:

    go version
    go install ./packages/labprobe

  Preserve command output and generated artifacts in experiments/go-install-001/runs/<run-id>/.
  Delegate evidence analysis and independent verification to the recipe subrecipes.
  Finish with a Markdown research report that separates observations from inference.
instructions: |
  Work only within the Cusimanse repository and the selected experiment environment.
  Do not access unrelated credentials or host data. Do not execute additional package
  installation or network activity unless it is necessary for the declared workload.
sub_recipes:
  - name: evidence-analysis
    path: "../subrecipes/evidence-analysis.yaml"
  - name: verification
    path: "../subrecipes/verification.yaml"
