kind: cusimanse-experiment
version: 2
id: npm-lifecycle-001
purpose: Observe a controlled local npm postinstall behavior inside disposable Lima compute.
contract: contracts/npm-lifecycle-001.md
profiles:
  host: recipes/profiles/host/linux-lima.yaml
  workload: recipes/profiles/workload/npm-lifecycle.yaml
policy:
  enforcement: scripts/policyctl
  policy_file: policies/host-policy.yaml
  mount_denylist: policies/mount-denylist.yaml
  permission_tiers: policies/permission-tiers.yaml
  required_checks: [vm, network, credentials, mounts]
host:
  recipe: recipes/host/security-research.yaml
compute:
  recipe: recipes/lima/security-research.yaml
instrumentation:
  recipe: recipes/instrumentation/security-research.yaml
session:
  state: recipes/session/session-state.yaml
workload:
  execution: disposable-lima-vm
  profile: recipes/profiles/workload/npm-lifecycle.yaml
threat_model:
  coverage: [package-lifecycle-process, filesystem-behavior, localhost-network-behavior]
  limitations: [local-fixture-only, no-external-network, no-real-malware]
agent:
  reference: goose
  adapters: recipes/agents/adapter-matrix.yaml
  orchestration: recipes/agents/goose-orchestration.yaml
subrecipes:
  - recipes/subrecipes/evidence-analysis.yaml
  - recipes/subrecipes/verification.yaml
  - recipes/subrecipes/report.yaml
gateways: recipes/gateway/mandatory.yaml
observability: recipes/observability/mandatory.yaml
skills: recipes/skills/registry.yaml
mcp: recipes/mcp/registry.yaml
