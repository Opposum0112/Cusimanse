kind: cusimanse-experiment
version: 1
id: npm-threat-001
purpose: Exercise controlled package lifecycle behavior and localhost-only network observation in disposable Lima compute.
contract: contracts/npm-threat-001.md
policy:
  enforcement: scripts/policyctl
  policy_file: policies/host-policy.yaml
  mount_denylist: policies/mount-denylist.yaml
  permission_tiers: policies/permission-tiers.yaml
  required_checks:
    - vm
    - network
    - credentials
    - mounts
host:
  recipe: recipes/host/security-research.yaml
compute:
  recipe: recipes/lima/security-research.yaml
instrumentation:
  recipe: recipes/instrumentation/security-research.yaml
session:
  state: recipes/session/session-state.yaml
workload:
  execution: disposable-lima-vm
  commands:
    - node --version
    - npm --version
    - mkdir -p /tmp/npm-threat
    - cd /tmp/npm-threat && npm init -y
    - cd /tmp/npm-threat && npm install /workspace/packages/npm-fixture
    - test -f /tmp/cusimanse-npm-lifecycle-marker
threat_model:
  coverage:
    - controlled-malicious-postinstall
    - process-observation
    - syscall-observation
    - filesystem-observation
    - localhost-network-observation
    - package-lifecycle-execution
  limitations:
    - local-fixture-only
    - localhost-only-network-attempt
    - no-external-network
    - no-real-malware
    - does-not-test-agent-escape
agent:
  reference: goose
  adapters: recipes/agents/adapter-matrix.yaml
  orchestration: recipes/agents/goose-orchestration.yaml
subrecipes:
  - recipes/subrecipes/evidence-analysis.yaml
  - recipes/subrecipes/verification.yaml
  - recipes/subrecipes/report.yaml
gateways: recipes/gateway/mandatory.yaml
observability: recipes/observability/mandatory.yaml
skills: recipes/skills/registry.yaml
mcp: recipes/mcp/registry.yaml
