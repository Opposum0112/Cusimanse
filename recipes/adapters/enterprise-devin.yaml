version: 1
id: enterprise-devin
kind: enterprise-agent-adapter
status: candidate
command: provider-managed
contract: recipes/agents/primary-agent.yaml
enterprise:
  secrets: external-secret-store
  audit: required
  approvals: required-for-privileged-actions
  network: deny-by-default
execution:
  project_recipe: recipes/routing/project.yaml
  learning: recipes/agents/learning-loop.yaml
constraints:
  - provider availability must be verified during preflight
  - never bypass policy or VM controls
  - never expose host credentials
  - never claim PASS without evidence
