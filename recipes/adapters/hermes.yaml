version: 1
id: hermes
kind: primary-agent-adapter
status: candidate
identity:
  name: Hermes Agent
  role: operator-executor
contract: recipes/agents/primary-agent.yaml
entrypoint:
  command: hermes
  installation: provider-or-user-managed
shell:
  interactive: "hermes"
  oneshot: "hermes -z '<PROMPT>'"
  contract_input: recipes/agents/primary-agent.yaml
  runbook: docs/agent-shell-runbook.md
bootstrap:
  command: "./scripts/prerequisites.sh"
  selection: "CUSIMANSE_PRIMARY_ADAPTER=hermes"
capabilities:
  - yaml-contract-loading
  - planning
  - orchestration
  - approved-execution
  - observation
  - evidence-collection
  - checkpointing
  - learning-proposals
execution:
  lifecycle_owner: primary-agent-shell
  orchestration_owner: primary-agent-shell
preflight:
  - command-availability
  - provider-configuration-without-secret-output
  - contract-load
  - recipe-load
  - policy-validation
  - audit-path-validation
  - non-destructive-smoke-test
learning:
  contract: recipes/agents/learning-loop.yaml
  mode: evidence-bounded
  promotion: human-review-required
security:
  security_boundary: disposable-vm-and-os-controls
  approval_required_for: [privileged, destructive, host-write, network-policy-change]
  forbidden: [policy-bypass, credential-exfiltration, self-approval, evidence-fabrication]
acceptance:
  configured_only: NOT_DEPLOYED
  runtime_e2e: NOT_DEPLOYED
