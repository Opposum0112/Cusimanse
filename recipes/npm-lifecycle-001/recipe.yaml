version: "1.0.0"
title: "Cusimanse npm lifecycle behavior research"
description: "Run the controlled local npm postinstall fixture through the Go capability API and preserve observable evidence."
instructions: |
  You are the primary Goose operator for a Cusimanse security research session.
  Read contracts/npm-lifecycle-001.md and recipes/experiments/npm-lifecycle-001.yaml before execution.
  Resolve with: go run ./cmd/cusimanse resolve npm-lifecycle-001
  After explicit researcher approval, operate with: go run ./cmd/cusimanse --approved run npm-lifecycle-001
  Keep the fixture local and harmless. Do not add external destinations or weaken the VM boundary.
  Delegate evidence analysis and independent verification, then preserve artifacts before destruction.
prompt: |
  Operate npm-lifecycle-001 through the Go capability API, analyze and independently verify the
  captured evidence, report and preserve the final research artifacts.
sub_recipes:
  - name: evidence_analysis
    path: "../subrecipes/evidence-analysis.yaml"
  - name: verification
    path: "../subrecipes/verification.yaml"
  - name: report
    path: "../subrecipes/report.yaml"
