version: 2
id: research-session-state
kind: session-state-contract
purpose: >-
  Maintain one durable, replayable YAML state record for every Cusimanse research
  session, including selected profiles, adapter, native agent orchestration, policy,
  audit, artifacts, verification, learning and token accounting.

identity:
  required: [session_id, experiment_id, contract_ref, recipe_ref]
  immutable_after_start: [session_id, experiment_id, contract_ref, recipe_ref]

profiles:
  host_profile: required
  compute_profile: required
  tool_profile: required
  agent_profile: required
  adapter_profile: required
  orchestration_profile: required
  policy_profile: required
  observability_profile: required
  routing_profile: required
  reporting_profile: required

lifecycle:
  states: [CREATED, VALIDATED, PREFLIGHTED, PLANNED, AWAITING_APPROVAL, APPROVED, PROVISIONED, INSTRUMENTED, EXECUTING, EVIDENCE_COLLECTED, ANALYZING, VERIFYING, REPORTED, PRESERVED, DESTROYED, COMPLETE, PARTIAL, FAILED]
  current_state: CREATED
  current_stage: create
  stage_history_required: true
  checkpoint_after_each_stage: true

approvals:
  required_for: [privileged_action, destructive_action, network_policy_change, credential_access, skill_promotion]
  self_approval: false
  record_decision_and_actor: true

audit:
  required: true
  append_only: true
  event_path: evidence/audit/events.jsonl
  manifest_path: evidence/audit/manifest.sha256
  record_requested_approved_executed_observed: true

artifacts:
  root: runs/<session-id>/
  required:
    state: session.yaml
    audit: evidence/audit/events.jsonl
    evidence_index: evidence/index.yaml
    provenance: provenance/manifest.sha256
    analysis: analysis/summary.md
    verification: verification/result.md
    research_report: research-report/report.md
    preservation_manifest: preservation/manifest.yaml
    token_usage: observability/token-usage.yaml
    dashboard_snapshot: observability/dashboard.yaml
  raw_evidence_before_destroy: true
  hashes_before_destroy: true
  model_output_is_evidence: false

agent:
  selected_adapter: required
  interactive_command: required
  run_command: required
  prompt_ref: optional
  prompt_digest: optional
  operator_authority: primary-agent
  native_orchestration: preferred
  recipe_input: required

orchestration:
  owner: primary-agent
  specialist_roles: required
  framework: native-agent-capabilities
  optional_helpers: [langgraph, taskflow]
  competing_frameworks: false
  backend_is_security_boundary: false

learning:
  enabled: opt_in
  helper_install_scope: host-control-plane-only
  candidate_path: learning/candidates/
  candidate_library: skills/candidate/
  evaluation_path: learning/evaluations/
  replay_path: learning/replays/
  verification_path: learning/verification/
  promotion_path: learning/promotions/
  promotion_target: skills/validated/
  promotion_requires_human_approval: true
  base_contracts_immutable: true
  runtime_self_modification: false

observability:
  token_accounting_required: true
  dashboard_refresh_required_at_session_end: true
  final_dashboard_status: required
  missing_telemetry_state: [PARTIAL, NOT_DEPLOYED]

reproducibility:
  snapshot_inputs: true
  record_git_ref: true
  record_recipe_digests: true
  record_tool_versions: true
  record_adapter_version: true
