version: 6
id: learning-workflow
kind: learning-and-skill-improvement-contract
purpose: >-
  Controlled experience-to-skill loop inspired by Voyager-style automatic skill
  accumulation: successful reusable procedures are extracted from completed
  experiments, evaluated and replayed, then explicitly approved before entering
  the validated skill library. Learning never changes the base contract or
  execution boundary.
enabled:
  default: false
  session_key: learning.enabled
  explicit_value: true
  prerequisites: [research_report_complete, independent_verification_complete]
how_to_enable:
  - complete the normal experiment and independent verification
  - set runs/<session-id>/session.yaml learning.enabled to true
  - confirm the value is true
  - manually continue the primary agent and provide this recipe
  - require explicit human approval before promotion
operator:
  primary_agent: true
  mechanism: native-agent-subagents-and-skills
  memory_source: preserved-session-evidence
  competing_orchestrator: false
voyager_style_loop:
  principle: retrieve_prior_skill_then_create_or_refine_reusable_skill_from_experience
  stages:
    - retrieve: search validated skills and prior session evidence for reusable procedures
    - propose: extract a candidate skill from the verified experience and state its preconditions
    - execute: test the candidate against an authorized replay or fresh disposable VM
    - evaluate: compare outcome, evidence quality, cost and safety with acceptance criteria
    - refine: revise the candidate without changing the base contract
    - replay: run the candidate again on a separate authorized case or preserved fixture
    - independent_verification: challenge the result independently
    - human_approval: researcher reviews provenance, evidence and candidate behavior
    - promote: copy approved candidate to skills/validated/
    - rollback: disable/revert a promoted skill if regression or safety impact is found
artifacts:
  root: runs/<session-id>/learning/
  candidate: candidates/<candidate-id>.yaml
  evaluation: evaluations/<evaluation-id>.yaml
  replay: replays/<replay-id>.yaml
  verification: verification/<verification-id>.yaml
  promotion: promotions/<promotion-id>.yaml
skill_update_model:
  validated_library: skills/validated/
  candidate_library: skills/candidate/
  source_evidence: runs/<session-id>/evidence/
  provenance_required: true
  version_required: true
  rollback_metadata_required: true
additional_tools:
  default: none
  principle: use_native_goose_capabilities_first
  optional_helpers:
    task_decomposition: Taskflow
    graph_state: LangGraph
    note: helpers are host/control-plane tools only and are never required for the security boundary
  installation: ./scripts/install.sh
external_skill_sources:
  registry: recipes/skills/registry.yaml
  imported_skills_are_candidates: true
promotion_rules:
  evidence_required: true
  replay_required: true
  independent_verification_required: true
  human_approval_required: true
  self_approval: false
  base_contract_mutation: false
  automatic_privilege_grant: false
  automatic_security_policy_change: false
  validated_target: skills/validated/
