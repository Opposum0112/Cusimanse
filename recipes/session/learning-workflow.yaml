version: 2
id: learning-workflow
kind: learning-and-skill-improvement-contract
purpose: Evidence-bounded optional improvement after a research run.

when:
  default: after research report and verification
  trigger: primary-agent identifies a reusable improvement candidate
  not_part_of: workload execution unless explicitly declared

where:
  control_plane: primary-agent
  execution: disposable-compute-when-replay-requires_execution
  artifacts: runs/<session-id>/learning/
  promotion_target: skills/

tools:
  taskflow:
    purpose: split the improvement into replayable tasks
    installed: host/control-plane profile when selected
  langgraph:
    purpose: optional state/checkpoints for the learning graph
    installed: host/control-plane profile when selected
  crewai:
    purpose: optional specialist delegation
    installed: host/control-plane profile when selected
  security_boundary: false

workflow:
  - retrieve: use prior sessions, evidence and reviewed skills
  - taskflow: define small replayable improvement tasks
  - execute: run candidate through primary agent; use disposable compute if execution is required
  - evaluate: compare result with contract acceptance and safety requirements
  - refine: create candidate skill/recipe change without mutating base contract
  - replay: repeat on preserved or distinct evidence
  - independent_verification: challenge the candidate result independently
  - human_approval: approve or reject promotion
  - promote: publish only approved validated version
  - rollback: revert if regression or safety issue is discovered

outputs:
  candidate: learning/candidates/<candidate-id>.yaml
  evaluation: learning/evaluations/<evaluation-id>.yaml
  replay: learning/replays/<replay-id>.yaml
  verification: learning/verification/<verification-id>.yaml
  promotion: learning/promotions/<promotion-id>.yaml

promotion_rules:
  human_approval_required: true
  self_approval: false
  evidence_required: true
  replay_required: true
  independent_verification_required: true
  provenance_required: true
  automatic_privilege_grant: false
  automatic_security_policy_change: false
  base_contract_mutation: false
