version: 1
id: mcp-connectors
kind: connector-profiles
registry: recipes/mcp/registry.yaml
profiles:
  local-research:
    servers:
      - repo-read
      - evidence-read
      - git
      - filesystem
      - fetch
      - mitre-attack
      - nvd-cve
      - cisa-kev
      - sigma
      - yara
    defaults:
      transport: stdio
      bind_address: 127.0.0.1
      public_exposure: deny
  threat-intelligence:
    servers:
      - mitre-attack
      - cisa-kev
      - nvd-cve
      - urlhaus
      - malwarebazaar
      - abuseipdb
      - alienvault-otx
    defaults:
      access: read-only
      public_workload_data: deny
  runtime-observability:
    servers:
      - evidence-read
      - opentelemetry
    defaults:
      write_approval: required
      bind_address: 127.0.0.1
  repository-automation:
    servers:
      - repo-read
      - github
    defaults:
      read_access: allowed
      write_access: approval-required
selection:
  interactive: true
  persist_to_recipe: true
  unknown_connector: NOT_DEPLOYED
  unavailable_connector: NOT_DEPLOYED
security:
  secrets_in_arguments: deny
  private_workload_to_public_reference: deny
  connector_privilege_is_not_boundary: true
  audit_every_invocation: true
