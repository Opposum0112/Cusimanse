version: 1
kind: mcp-registry
purpose: Recipe-scoped MCP/extension declarations for Goose and compatible agents.
policy:
  public_exposure: deny
  credentials: environment-only
  security_boundary: false
  approval_required_for_new_server: true
native_goose:
  built_in_extensions:
    - developer
    - skills
    - summon
    - extension-manager
    - todo
  external_extensions: allowed
  protocol: MCP
entries:
  - id: experiment-tools
    mode: recipe-scoped
    command: recipe-defined
    enabled_by_experiment: true
  - id: gateway-observability
    mode: host-local
    command: recipe-defined
    enabled_by_host_install: true
cross_agent:
  rule: >-
    An MCP capability may be reused by another primary agent only when that
    agent supports the protocol and the same scope/credential rules can be
    enforced. Otherwise the capability is recorded as unavailable.
