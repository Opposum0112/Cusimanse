version: 4
id: mcp-registry
kind: mcp-registry
owner: project
sources:
  discovery: recipes/reference/mcp-sources.yaml
  security-research-data: recipes/reference/security-research-databases.yaml
policy:
  default_transport: stdio
  bind_address: 127.0.0.1
  public_exposure: deny
  privileged_tools: approval-required
  unknown_server: NOT_DEPLOYED
  external_enrichment: cite-and-audit
servers:
  repo-read:
    purpose: repository and recipe inspection
    access: read-only
    status: declared
  evidence-read:
    purpose: deterministic evidence queries
    access: read-only
    status: declared
  vm-control:
    purpose: disposable Lima lifecycle
    access: controlled
    approval: required
    status: declared
  policy:
    purpose: host/security policy checks
    access: policyctl-only
    approval: required
    status: declared
  mitre-attack:
    purpose: ATT&CK technique and software reference lookup
    access: read-only
    approval: not-required
    data_class: public-reference
    status: declared
  nvd-cve:
    purpose: CVE and vulnerability reference lookup
    access: read-only
    approval: not-required
    data_class: public-reference
    status: declared
  cisa-kev:
    purpose: known exploited vulnerability catalog lookup
    access: read-only
    approval: not-required
    data_class: public-reference
    status: declared
  sigma:
    purpose: detection rule research and validation references
    access: read-only
    approval: not-required
    data_class: public-reference
    status: declared
  yara:
    purpose: YARA rule research and local rule validation
    access: read-only
    approval: not-required
    data_class: local-or-public-reference
    status: declared
  urlhaus:
    purpose: malicious URL enrichment
    access: read-only
    approval: not-required
    data_class: public-reference
    status: optional
  malwarebazaar:
    purpose: malware hash and sample metadata enrichment
    access: read-only
    approval: not-required
    data_class: public-reference
    status: optional
  abuseipdb:
    purpose: IP reputation enrichment
    access: read-only
    approval: not-required
    data_class: public-reference
    status: optional
  alienvault-otx:
    purpose: IOC and threat-intelligence enrichment
    access: read-only
    approval: not-required
    data_class: public-reference
    status: optional
  opentelemetry:
    purpose: telemetry ingestion and correlation
    access: controlled
    approval: required-for-write
    data_class: runtime-telemetry
    status: declared
  github:
    purpose: repository, issue, pull-request and code research through an approved GitHub MCP connector
    access: read-only-by-default
    approval: required-for-write
    data_class: repository-metadata
    status: optional
  filesystem:
    purpose: controlled local workspace file inspection for analysis workflows
    access: workspace-scoped
    approval: required-for-write
    data_class: local-workload
    status: optional
  fetch:
    purpose: controlled public-reference retrieval for enrichment
    access: read-only
    approval: not-required
    data_class: public-reference
    status: optional
  git:
    purpose: local repository history and diff inspection
    access: read-only
    approval: required-for-write
    data_class: repository-metadata
    status: optional
  memory:
    purpose: scoped experiment context retrieval
    access: read-only
    approval: not-required
    data_class: experiment-context
    status: optional
registry_rules:
  - every server has an owner and purpose
  - every write/VM/privileged capability has an approval rule
  - every runtime use is written to the audit record
  - secrets are never passed through MCP arguments
  - public reference queries must not contain private workload data
  - external enrichment must record source and retrieval time
  - discovery does not imply approval
  - unknown or unavailable servers are NOT_DEPLOYED
  - MCP connectors cannot expand the VM/OS security boundary
