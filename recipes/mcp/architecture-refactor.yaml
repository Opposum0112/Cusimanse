id: architecture-refactor-mcp
version: 1
kind: mcp-profile
transport: stdio
bind: 127.0.0.1
public_exposure: deny
servers:
  - repo-read
  - evidence-read
  - vm-control
  - policy
  - mitre-attack
  - nvd-cve
  - cisa-kev
  - sigma
  - yara
  - opentelemetry
rules:
  secrets_in_arguments: deny
  privileged_actions: approval_required
  evidence_writes: audited
  external_enrichment: cite_and_audit
  unknown_server: NOT_DEPLOYED
