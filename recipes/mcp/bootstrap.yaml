version: "1.0.0"
title: MCP capability bootstrap
description: Review and activate only the MCP servers declared by the registry.
instructions: |
  Read recipes/mcp/registry.yaml. Enumerate declared servers and verify their
  implementation and transport before activation. Keep MCP bound to localhost
  unless a recipe explicitly requires another boundary. Reject unknown servers,
  credential forwarding and privileged tools without approval.

  Record server name, transport, tools exposed, approval tier and verification
  result in the audit record. Unimplemented entries remain NOT_DEPLOYED.
