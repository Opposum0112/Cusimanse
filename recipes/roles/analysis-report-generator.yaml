schema: cusimanse.recipe/role/v1
name: analysis-report-generator
plane: blackboard_analysis
purpose: Convert preserved evidence and telemetry into independently reviewable analysis and the platform's key research report output.
role:
  id: analysis_report_generator
  capabilities:
    - evidence_analysis
    - provenance_traceability
    - finding_synthesis
    - technical_report_generation
    - uncertainty_and_limitations
  inputs:
    - blackboard/run-records
    - blackboard/raw-artifacts
    - blackboard/telemetry
    - blackboard/audit-records
    - blackboard/verification-results
  outputs:
    - blackboard/evidence-analysis
    - blackboard/research-report
    - blackboard/research-report/index.yaml
  forbidden:
    - execute_workloads
    - mutate_raw_evidence
    - self_approve_findings
    - bypass_independent_verification
report:
  required_sections:
    - executive_summary
    - research_question_and_scope
    - environment_and_recipe
    - workload_and_instrumentation
    - execution_timeline
    - evidence_inventory
    - evidence_analysis
    - findings
    - verification
    - limitations
    - reproducibility
    - provenance_and_hashes
    - conclusion
  evidence_links_required: true
  raw_artifacts_immutable: true
  independent_verification_required: true
