schema: cusimanse.host-state/v1
# Runtime state written by scripts/cusimanse-host.sh.
# The file is intentionally YAML so agents, CI and humans can inspect setup state.
run:
  id: generated-at-runtime
  started_at: generated-at-runtime
  completed_at: generated-at-runtime
  mode: interactive
host:
  os: detected-at-runtime
  distro: detected-at-runtime
  distro_version: detected-at-runtime
  kernel: detected-at-runtime
  architecture: detected-at-runtime
  package_manager: detected-at-runtime
planes:
  foundation:
    status: PENDING
    capabilities: [git, bash, curl, python3, ruby, go, qemu, lima]
  primary_agent:
    status: PENDING
    adapter: none
  control_learning:
    status: PENDING
    capabilities: [jq, yq, sqlite, skills, retrieval, recipes]
  observability_governance:
    status: PENDING
    capabilities: [opentelemetry, phoenix, numbat, aegis, policyctl]
  validation:
    status: PENDING
    checks: [preflight, policy, recipe-contract, architecture, token-dashboard]
vm:
  provider: lima-qemu
  status: PENDING
  runtime: limactl
  architecture: detected-at-runtime
  inventory: pending
  # Inventory is populated from limactl discovery and retains name/status/arch.
token_usage:
  command: cusimanse-token-dashboard
  policy_interface: policyctl token-dashboard
  dashboard: http://127.0.0.1:8787
  ledger: reports/token-usage/usage.json
  environment_file: ~/.config/cusimanse/token-optimization.env
  tools: [ponytail, numbat, miller]
  fallback: declarative-skill-guidance
  authorization: false
evidence:
  state_file: recipes/host-state.yaml
  last_preflight: pending
