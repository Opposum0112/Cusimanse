id: https://cusimanse.dev/schema/agent-runtime/v1
name: cusimanse_agent_runtime
prefixes:
  linkml: https://w3id.org/linkml/
  car: https://cusimanse.dev/schema/agent-runtime/v1/
imports:
  - linkml:types

enums:
  OperationKind:
    permissible_values:
      tool: {}
      api: {}
      vm: {}
      shell: {}
      file: {}
      network: {}
      evidence: {}
  EvidenceKind:
    permissible_values:
      file: {}
      network: {}
      process: {}
      log: {}
      artifact: {}
      other: {}
  ExecutionRuntime:
    permissible_values:
      local: {}
      temporal: {}
      graph: {}
  ComputeProvider:
    permissible_values:
      lima: {}
      multipass: {}
      firecracker: {}
      cloud: {}
      mock: {}
  SkillLifecycle:
    permissible_values:
      candidate: {}
      validated: {}

classes:
  CapabilityIntent:
    description: Declarative intent compiled into a normalized CAR IR node.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      capability:
        range: string
        required: true
      parameters:
        range: JsonObject
      depends_on:
        range: string
        multivalued: true

  ResearchQuestion:
    attributes:
      id:
        identifier: true
        range: string
        required: true
      question:
        range: string
        required: true
      non_goals:
        range: string
        multivalued: true
        description: Explicitly out-of-scope actions the agent must not pursue.

  ResearchScope:
    attributes:
      networks:
        range: string
        multivalued: true
      paths:
        range: string
        multivalued: true
      hosts:
        range: string
        multivalued: true
      compute:
        range: ComputeConfiguration
      egress:
        range: JsonObject

  ComputeConfiguration:
    attributes:
      provider:
        range: ComputeProvider
        required: true
      profile:
        range: string
      disposable:
        range: boolean
        required: true
      runtime:
        range: ExecutionRuntime

  EvidenceRequirement:
    attributes:
      type:
        range: EvidenceKind
        required: true
      produced_by:
        range: string

  StopConditions:
    attributes:
      all_evidence_required:
        range: boolean
      max_proposals:
        range: integer
      max_lifetime_minutes:
        range: integer

  DestroyPolicy:
    attributes:
      capability:
        range: string
        required: true
      require_evidence_sealed:
        range: boolean
        required: true

  ExperimentRecipe:
    tree_root: true
    description: Frozen security-research contract consumed by CAR.
    attributes:
      api_version:
        range: string
        required: true
      kind:
        range: string
        required: true
      experiment_id:
        identifier: true
        range: string
        required: true
      contract_version:
        range: string
      description:
        range: string
      research_question:
        range: ResearchQuestion
      scope:
        range: ResearchScope
      allowed_capabilities:
        range: string
        multivalued: true
        description: Capabilities legal for this experiment. Omitted means no extra allowlist gate.
      intents:
        range: CapabilityIntent
        multivalued: true
      operation_kinds:
        range: OperationKind
        multivalued: true
      evidence_required:
        range: EvidenceRequirement
        multivalued: true
      stop_when:
        range: StopConditions
      destroy:
        range: DestroyPolicy
      runtime:
        range: ExecutionRuntime
      skill_lifecycle:
        range: SkillLifecycle

slots:
  JsonObject:
    range: string
    description: JSON-serializable object represented as structured recipe data.
