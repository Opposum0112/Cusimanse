id: https://cusimanse.dev/schema/agent-runtime/v1
name: cusimanse_agent_runtime
prefixes:
  linkml: https://w3id.org/linkml/
  car: https://cusimanse.dev/schema/agent-runtime/v1/
imports:
  - linkml:types

enums:
  OperationKind:
    permissible_values:
      tool: {}
      api: {}
      vm: {}
      shell: {}
      file: {}
      network: {}
      evidence: {}

classes:
  CapabilityIntent:
    attributes:
      id:
        identifier: true
        range: string
      capability:
        required: true
        range: string
      parameters:
        range: string
      depends_on:
        range: string
        multivalued: true

  ExperimentRecipe:
    tree_root: true
    attributes:
      api_version:
        required: true
        range: string
      kind:
        required: true
        range: string
      experiment_id:
        required: true
        range: string
      intents:
        range: CapabilityIntent
        multivalued: true
