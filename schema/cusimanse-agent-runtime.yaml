id: https://cusimanse.dev/schema/agent-runtime/v1
name: cusimanse_agent_runtime
prefixes:
  linkml: https://w3id.org/linkml/
  car: https://cusimanse.dev/schema/agent-runtime/v1/
imports:
  - linkml:types

enums:
  OperationKind:
    permissible_values:
      tool: {}
      api: {}
      vm: {}
      shell: {}
      file: {}
      network: {}
      evidence: {}

classes:
  CapabilityIntent:
    description: Declarative intent compiled into a normalized CAR IR node.
    attributes:
      id:
        identifier: true
        range: string
        required: true
      capability:
        range: string
        required: true
      parameters:
        range: JsonObject
      depends_on:
        range: string
        multivalued: true

  ResearchQuestion:
    attributes:
      id:
        identifier: true
        range: string
        required: true
      question:
        range: string
        required: true

  ResearchScope:
    attributes:
      networks:
        range: string
        multivalued: true
      paths:
        range: string
        multivalued: true
      hosts:
        range: string
        multivalued: true

  ExperimentRecipe:
    tree_root: true
    description: LinkML-governed security-research contract consumed by CAR.
    attributes:
      api_version:
        range: string
        required: true
      kind:
        range: string
        required: true
      experiment_id:
        identifier: true
        range: string
        required: true
      description:
        range: string
      research_question:
        range: ResearchQuestion
      scope:
        range: ResearchScope
      intents:
        range: CapabilityIntent
        multivalued: true
      operation_kinds:
        range: OperationKind
        multivalued: true

slots:
  JsonObject:
    range: string
    description: JSON-serializable object represented as structured recipe data.
