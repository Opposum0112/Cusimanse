# From 04-security-model.md
schema_version: "1.0"
tiers:
  read:
    default: allow
    examples: [cat, rg, jq, git-diff]
  project-write:
    default: allow
    constraint: workspace-boundary
  git:
    default: approval
  vm:
    default: controlled
  network:
    default: deny
  credentials:
    default: deny
  host-root:
    default: deny
privileged_operations:
  - sudo
  - host-filesystem
  - ssh
  - cloud-credentials
  - network-reconfiguration
  - destructive-delete-outside-vm
