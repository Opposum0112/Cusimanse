# Paths that must never be mounted into experiment VMs.
schema_version: "1.0"
deny:
  - "~/.ssh"
  - "~/.gnupg"
  - "~/.aws"
  - "~/.config/gh"
  - "~/.config/gcloud"
  - "/etc/shadow"
  - "/home"
  - "/"
rules:
  - "mounts: [] is the default for every Lima profile in this repository."
  - "Evidence export uses limactl copy, not a host bind mount."
