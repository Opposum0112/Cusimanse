id: go-install-001
name: "Go package installation observation"
objective: "Observe and analyze a pinned Go package installation inside a disposable Lima/QEMU VM."
hypothesis: "The package installation will produce observable process, filesystem, DNS and network activity that can be correlated with expected Go module behavior."

target:
  command: "go install <package>@<version>"
  package: "<select-during-planning>"
  version: "<select-during-planning>"

vm_profile: security-research
network_policy: controlled

instrumentation:
  - process
  - syscall
  - filesystem
  - dns
  - network
  - packet
  - security-events

evidence:
  raw: true
  reduced: true
  hashes: true

verification:
  independent_agent: true

cleanup:
  delete_vm_after_evidence_preservation: true
