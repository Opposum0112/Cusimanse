id: stage-10-acceptance
name: Seven-level acceptance matrix
objective: Score host, execution, agent, security, model, observability and experiment levels.
hypothesis: NOT_DEPLOYED is a valid honest state and must not be reported as PASS.
document: 10-validation-and-acceptance.md
stage: 10
target:
  command: python3 -m labctl accept
vm_profile: null
network_policy: none
instrumentation:
  - filesystem
evidence:
  raw: true
  reduced: true
  hashes: true
verification:
  independent_agent: true
cleanup:
  delete_vm_after_evidence_preservation: false
success_criteria:
  - scorecard YAML written
  - each check is PASS, PARTIAL, FAIL, or NOT_DEPLOYED
