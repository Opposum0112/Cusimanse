# yaml-language-server: $schema=../schemas/experiment.schema.json
apiVersion: cusimanse.dev/v1
kind: Experiment
metadata:
  id: npm-lifecycle-001
  title: Controlled npm lifecycle
spec:
  question: Observe controlled local npm lifecycle hooks inside disposable compute.
  hostPrep: default
  roles: [operator, verifier, reporter]
  scope:
    include: [disposable-linux-vm, local-lifecycle]
    exclude: [host-execution, credentials, public-registry-attack, agent-escape]
  requirements:
    execution: disposable
    os: linux
    workload: npm-lifecycle
    network: localhost-only
    instrumentation: [process, syscall, filesystem, network]
  policyChecks: [vm, network, mounts]
  acceptance:
    - lifecycle runs only in the guest
    - evidence hashed before destroy
  operator: goose
  observability:
    host: [clawmetry, goose-logs, token-usage]
    experiment: [session, evidence-hash]
