kind: cusimanse-tool-inventory
version: 4
branch_scope: goose-native
purpose: >-
  Single declarative inventory of host, agent, control-plane, gateway,
  disposable-compute, guest-instrumentation and evidence tooling used by the
  Goose-native security-research stack.
source_of_truth:
  linkml_schema: schemas/cusimanse.yaml
  experiment_instances: experiments/
  host_recipe: recipes/host/security-research.yaml
  gateway_recipe: recipes/gateway/mandatory.yaml
  instrumentation_recipe: recipes/instrumentation/security-research.yaml
  observability_recipe: recipes/observability/mandatory.yaml
  policy: policies/host-policy.yaml
  capability_registry: recipes/profiles/registry.yaml
  adapters: recipes/agents/adapter-matrix.yaml
  runtime_experiments: recipes/experiments/
  goose_session_recipe: recipes/goose/session.yaml
  goose_experiment_recipe: recipes/<id>/recipe.yaml
  outputs: runs/<session-id>/
planes:
  research_agent:
    required: [goose]
    optional: [opencode, hermes, antigravity, pi]
    authority: none
  control_policy:
    required: [cusimanse, policy-engine, capability-resolver, preflight, validation]
    authority: policy_and_lifecycle
  capability_execution:
    required: [lima, qemu, linux-guest]
    authority: constrained_by_go_runtime_and_policy
  gateway:
    required: [litellm, omniroute]
    endpoints: [127.0.0.1:4000, 127.0.0.1:20128]
    installation: scripts/install.sh
    authority: none
  instrumentation:
    scope: disposable_linux_guest
    process: [ps, pgrep, lsof]
    syscall: [strace]
    network: [ss, ip, tcpdump]
    dns: [dig, getent]
    filesystem: [find, stat, sha256sum, inotifywait, file]
    security: [dmesg, journalctl]
    optional: [bpftrace]
    access: agent_and_go_runtime_managed
    installation: recipes/lima/security-research.yaml
  evidence_observability:
    required: [numbat, aegis, phoenix, opentelemetry, clawmetry]
    report_artifacts: [runs/<session-id>/research-report/report.md, runs/<session-id>/research-report/report.yaml]
host_bootstrap:
  required_commands: [git, bash, curl, python3, node, npm, go, jq, yq, rg, goose]
  installers: [scripts/install.sh, scripts/install.ps1]
  allow_list: host-prep/default.yaml
external_boundaries:
  host_shell: bootstrap_and_external_tooling_only
  agent_shell: planning_handoff_and_analysis_only
  guest_shell: disposable_guest_execution
  go_api: authoritative_capability_boundary
inventory_commands:
  capabilities: go run ./cmd/cusimanse capability list
  resolve: go run ./cmd/cusimanse resolve <experiment-id>
  validate: go run ./cmd/cusimanse validate
  observability: go run ./cmd/cusimanse observability status
  goose_session: goose recipe validate recipes/goose/session.yaml
  goose_experiment: goose recipe validate recipes/npm-install-001/recipe.yaml
safety:
  credentials: denied
  unrestricted_mounts: denied
  public_mcp: denied
  public_gateway: denied
  untrusted_host_execution: denied
  evidence_hashing: required
  preserve_before_destroy: required
  report_generation: required_research_artifact
legacy_removed: [retired-compiler-cli]
