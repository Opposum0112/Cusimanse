# Agent visibility event log (Numbat stand-in).
# Events are append-only JSONL. Do not put secrets in fields.

schema_version: "1.0"
product: labctl-events
mode: monitor
event_log: events/numbat.jsonl

capture:
  tool_calls: true
  commands: true
  sessions: true
  policy_decisions: true

redact:
  - "api_key"
  - "token"
  - "password"
  - "authorization"
  - "secret"
