# Disposable experiment VM — profile: minimal
# Generated from profiles.yaml + 03-deployment-runbook.md
vmType: qemu
cpus: 2
memory: "2GiB"
disk: "12GiB"

# Explicitly empty. Never mount host home, credentials, or SSH keys.
mounts: []

containerd:
  system: false
  user: false

plain: false

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

# NAT only. Do not bridge onto the lab host's LAN.
networks:
  - lima: user-v2

ssh:
  localPort: 0
  loadDotSSHPubKeys: false
