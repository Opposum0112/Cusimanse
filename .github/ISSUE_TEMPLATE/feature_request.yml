name: Feature request
description: Propose a focused improvement to Cusimanse.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or research need
      description: What problem would this solve for researchers or operators?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change and its intended behavior.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and policy impact
      description: Explain any effect on execution authority, isolation, evidence, credentials, networking or policy.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing capabilities or approaches you considered.
