name: Bug report
description: Report a reproducible defect in Cusimanse.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest safe reproduction and commands.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or branch
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js, OS, compute provider, runtime, and relevant versions.
