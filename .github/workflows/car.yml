name: CAR

on:
  push:
    branches: [agentic-runtime, harness-neutral-runtime, crewai]
  pull_request:
    branches: [agentic-runtime, harness-neutral-runtime]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx cusimanse compile recipes/examples/npm-install.yaml
      - run: go test ./probe/...
