name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build source packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="cusimanse-${GITHUB_REF_NAME}/" "$GITHUB_REF_NAME" > "dist/cusimanse-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=zip --prefix="cusimanse-${GITHUB_REF_NAME}/" "$GITHUB_REF_NAME" > "dist/cusimanse-${GITHUB_REF_NAME}.zip"
          sha256sum dist/* > dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* --title "Cusimanse ${GITHUB_REF_NAME}" --generate-notes
