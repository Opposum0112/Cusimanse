name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.22.x'
          cache: true
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          sudo curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Compiler and experiment contracts
        run: |
          go test ./internal/compiler ./cmd/compile ./cmd/cusimanse
          for id in npm-install-001 npm-lifecycle-001 npm-threat-001 go-install-001; do
            go run ./cmd/compile validate "$id"
            go run ./cmd/compile resolve "$id"
            go run ./cmd/compile host-prep "$id"
          done
      - name: Validate executable scripts
        run: |
          while IFS= read -r -d '' f; do
            echo "Checking $f"
            test -x "$f"
            bash -n "$f"
            shellcheck --severity=error "$f" || { shellcheck "$f"; exit 1; }
          done < <(find scripts -type f \( -name '*.sh' -o -name 'policyctl' \) -print0)
      - name: Legacy control-plane validate
        run: bash ./scripts/tests/validate.sh || true
      - name: Integration tests
        run: bash ./scripts/tests/integration.sh
