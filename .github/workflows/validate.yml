name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  recipe-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML and shell syntax
        run: ./scripts/tests/validate-recipes.sh
      - name: Build policyctl
        run: go build ./cmd/policyctl
      - name: Policy defaults
        run: ./policyctl check
      - name: Policy dashboard help/build smoke test
        run: ./policyctl token-dashboard --help

  legacy-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python3 -m compileall -q scripts
      - name: Legacy CLI self-test
        run: PYTHONPATH=scripts python3 scripts/labctl/selftest.py
