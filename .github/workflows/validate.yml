name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.22.x'
          cache: true
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml yq
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
      - name: Validate executable scripts
        run: |
          while IFS= read -r -d '' f; do
            echo "Checking $f"
            test -x "$f"
            bash -n "$f"
            shellcheck --severity=error "$f" || { shellcheck "$f"; exit 1; }
          done < <(find scripts -type f \( -name '*.sh' -o -name 'policyctl' \) -print0)
      - name: Validate project and control plane
        run: bash ./scripts/tests/validate.sh
      - name: Validate Goose recipes explicitly
        run: |
          set -euo pipefail
          for f in recipes/*/recipe.yaml recipes/subrecipes/*.yaml; do
            echo "Validating Goose recipe: $f"
            goose recipe validate "$f"
          done
      - name: Run functional control-plane tests
        run: bash ./scripts/tests/runtime.sh
      - name: Run integration tests
        run: bash ./scripts/tests/integration.sh
