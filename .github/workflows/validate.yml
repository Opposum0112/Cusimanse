name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install host validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
      - name: Validate shell scripts
        run: |
          while IFS= read -r -d '' f; do test -x "$f"; bash -n "$f"; shellcheck --severity=error "$f"; done < <(find scripts -type f -name '*.sh' -print0)
      - name: Validate project and Goose recipes
        run: bash ./scripts/tests/validate.sh
