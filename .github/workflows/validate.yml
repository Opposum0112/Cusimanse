name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests
        run: go test ./...
      - name: Build labctl
        run: go build -o labctl ./cmd/labctl
      - name: Validate project contract
        run: ./labctl validate
      - name: Go control-plane self-test
        run: ./labctl self-test

  python-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python3 -m compileall -q scripts
      - name: Legacy CLI help
        run: PYTHONPATH=scripts python3 -m labctl --help
      - name: Legacy CLI stages
        run: PYTHONPATH=scripts python3 -m labctl stages
      - name: Legacy CLI experiments
        run: PYTHONPATH=scripts python3 -m labctl experiment list
      - name: Legacy CLI dry-run init
        run: PYTHONPATH=scripts python3 -m labctl --dry-run init
      - name: Legacy controller self-test
        run: PYTHONPATH=scripts python3 scripts/labctl/selftest.py
