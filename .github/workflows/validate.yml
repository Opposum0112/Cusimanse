name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          command -v yq >/dev/null || sudo snap install yq

      - name: Validate executable scripts
        run: |
          shellcheck scripts/install.sh scripts/tests/*.sh

      - name: Validate Go module
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run repository validation
        run: bash ./scripts/tests/validate.sh

      - name: Run Go tests
        run: go test ./...

      - name: Run runtime checks
        run: bash ./scripts/tests/runtime.sh

      - name: Run integration checks
        run: bash ./scripts/tests/integration.sh
