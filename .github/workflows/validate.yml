name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.22.x'
          cache: true
      - name: Native Go tests
        run: go test ./...
      - name: Native CLI sanity
        run: |
          go run ./cmd/cusimanse capability list
          go run ./cmd/cusimanse resolve npm-install-001
          go run ./cmd/cusimanse policy validate
      - name: Script syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f"
            bash -n "$f"
          done
      - name: Integration tests
        run: bash ./scripts/tests/integration.sh
      - name: Goose recipe validation
        run: |
          command -v goose
          goose recipe validate recipes/goose/session.yaml
          for f in recipes/subrecipes/*.yaml; do goose recipe validate "$f"; done
