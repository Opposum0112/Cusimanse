name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.22.x'
          cache: true
      - name: Compiler tests and catalog
        run: |
          go test ./internal/compiler ./cmd/compile ./cmd/cusimanse ./internal/validation
          go run ./cmd/compile catalog
          for id in npm-install-001 npm-lifecycle-001 npm-threat-001 go-install-001; do
            go run ./cmd/compile validate "$id"
            go run ./cmd/compile resolve "$id"
            go run ./cmd/compile host-prep "$id"
          done
      - name: Script syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f"
            bash -n "$f"
          done
      - name: Integration tests
        run: bash ./scripts/tests/integration.sh
