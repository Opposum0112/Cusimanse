name: agentic-native

on:
  push:
    branches: [goose-native]
  pull_request:
    branches: [goose-native, main]

permissions:
  contents: read

jobs:
  schema-and-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.22.x'
          cache: true
      - name: Native unit and sanity tests
        run: go test ./cmd/cusimanse ./internal/policy ./internal/preflight ./internal/validation ./internal/model
      - name: Catalog and experiments
        run: |
          set -euo pipefail
          go run ./cmd/cusimanse capability list
          go run ./cmd/cusimanse policy validate
          for id in npm-install-001 npm-lifecycle-001 npm-threat-001 go-install-001; do
            go run ./cmd/cusimanse resolve "$id"
          done
      - name: Integration
        run: bash ./scripts/tests/integration.sh
