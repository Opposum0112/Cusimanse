<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cusimanse CrewAI orchestration architecture</title>
  <desc id="desc">Goose remains the project operator and lifecycle authority. CrewAI coordinates specialist research roles and returns structured results. Policy, approval, VM enforcement, evidence and audit remain outside CrewAI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0"/><stop offset="1" stop-color="#16213e"/></linearGradient>
    <linearGradient id="crew" x1="0" y1="0" x2="1" y2="1"><stop offset="0"/><stop offset="1" stop-color="#243b55"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z"/></marker>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <text x="800" y="70" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700">Cusimanse · CrewAI Orchestration</text>
  <text x="800" y="108" text-anchor="middle" fill="#b9c7e6" font-family="Inter,Arial,sans-serif" font-size="20">Optional specialist-role coordination — not the security boundary</text>

  <g filter="url(#shadow)">
    <rect x="500" y="145" width="600" height="105" rx="22" fill="#1f6feb"/>
    <text x="800" y="187" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">Experiment Contract</text>
    <text x="800" y="220" text-anchor="middle" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="18">Scope · hypotheses · constraints · acceptance criteria</text>
  </g>
  <path d="M800 250 V285" stroke="#c9d6ee" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="500" y="300" width="600" height="105" rx="22" fill="#2d7d46"/>
    <text x="800" y="342" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">Goose · Primary Operator</text>
    <text x="800" y="375" text-anchor="middle" fill="#dcfce7" font-family="Inter,Arial,sans-serif" font-size="18">Execution · lifecycle · approvals · evidence authority</text>
  </g>
  <path d="M800 405 V440" stroke="#c9d6ee" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="250" y="455" width="1100" height="260" rx="28" fill="url(#crew)" stroke="#8aa4d6" stroke-width="2"/>
    <text x="800" y="495" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">CrewAI · Optional Research Role Layer</text>
    <text x="800" y="525" text-anchor="middle" fill="#b9c7e6" font-family="Inter,Arial,sans-serif" font-size="17">Bounded roles consume declared inputs and return structured results to Goose</text>

    <g fill="#304b70" stroke="#91a9d4" stroke-width="1.5">
      <rect x="285" y="560" width="170" height="92" rx="16"/><rect x="480" y="560" width="170" height="92" rx="16"/>
      <rect x="675" y="560" width="170" height="92" rx="16"/><rect x="870" y="560" width="170" height="92" rx="16"/>
      <rect x="1065" y="560" width="170" height="92" rx="16"/>
    </g>
    <g fill="white" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle">
      <text x="370" y="597">Planner</text><text x="370" y="623" fill="#b9c7e6" font-size="14" font-weight="400">bounded plan</text>
      <text x="565" y="597">Researcher</text><text x="565" y="623" fill="#b9c7e6" font-size="14" font-weight="400">hypotheses</text>
      <text x="760" y="597">Runtime Analyst</text><text x="760" y="623" fill="#b9c7e6" font-size="14" font-weight="400">telemetry</text>
      <text x="955" y="597">Forensics</text><text x="955" y="623" fill="#b9c7e6" font-size="14" font-weight="400">evidence</text>
      <text x="1150" y="597">Verifier</text><text x="1150" y="623" fill="#b9c7e6" font-size="14" font-weight="400">independent check</text>
    </g>
    <text x="800" y="684" text-anchor="middle" fill="#f6d365" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">CrewAI cannot approve, bypass policy, access the host directly, destroy evidence, or replace Goose.</text>
  </g>

  <path d="M800 715 V750" stroke="#c9d6ee" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="350" y="765" width="900" height="80" rx="20" fill="#5b3f8c"/>
    <text x="800" y="798" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Policy + Approval + VM/OS Enforcement</text>
    <text x="800" y="826" text-anchor="middle" fill="#eadcff" font-family="Inter,Arial,sans-serif" font-size="15">Disposable Lima/QEMU execution · instrumentation · evidence · audit · verification</text>
  </g>
  <text x="800" y="878" text-anchor="middle" fill="#8fa4c7" font-family="Inter,Arial,sans-serif" font-size="14">Security boundary: VM/OS, mounts, credentials, network controls and explicit approvals — never the agent framework.</text>
</svg>