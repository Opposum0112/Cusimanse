<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<title>Cusimanse self-learning loop</title><style>text{font-family:Arial,sans-serif;fill:#111}.b{fill:#f7f7f7;stroke:#222;stroke-width:2}.a{stroke:#222;stroke-width:3;fill:none;marker-end:url(#m)}.h{font-size:25px;font-weight:bold}.s{font-size:18px}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#222"/></marker></defs>
<text x="600" y="45" text-anchor="middle" class="h">Cusimanse Voyager-style Skill Learning Loop</text>
<rect x="80" y="100" width="220" height="90" rx="12" class="b"/><text x="190" y="140" text-anchor="middle" class="h">Task</text><text x="190" y="168" text-anchor="middle" class="s">campaign + artifact</text>
<rect x="360" y="100" width="220" height="90" rx="12" class="b"/><text x="470" y="140" text-anchor="middle" class="h">Retrieve</text><text x="470" y="168" text-anchor="middle" class="s">top-k candidate skills</text>
<rect x="640" y="100" width="220" height="90" rx="12" class="b"/><text x="750" y="140" text-anchor="middle" class="h">Execute</text><text x="750" y="168" text-anchor="middle" class="s">inside approved VM</text>
<rect x="920" y="100" width="220" height="90" rx="12" class="b"/><text x="1030" y="140" text-anchor="middle" class="h">Observe</text><text x="1030" y="168" text-anchor="middle" class="s">evidence + traces</text>
<path d="M300 145 H360 M580 145 H640 M860 145 H920" class="a"/>
<rect x="360" y="300" width="220" height="90" rx="12" class="b"/><text x="470" y="340" text-anchor="middle" class="h">Evaluate</text><text x="470" y="368" text-anchor="middle" class="s">result / failure</text>
<rect x="640" y="300" width="220" height="90" rx="12" class="b"/><text x="750" y="340" text-anchor="middle" class="h">Refine</text><text x="750" y="368" text-anchor="middle" class="s">repair candidate</text>
<rect x="920" y="300" width="220" height="90" rx="12" class="b"/><text x="1030" y="340" text-anchor="middle" class="h">Candidate</text><text x="1030" y="368" text-anchor="middle" class="s">SKILL.md + scripts</text>
<path d="M1030 190 V300 M920 345 H860 M640 345 H580" class="a"/>
<path d="M750 300 C750 230 700 210 750 190" class="a"/>
<rect x="260" y="500" width="280" height="100" rx="12" class="b"/><text x="400" y="540" text-anchor="middle" class="h">Replay</text><text x="400" y="570" text-anchor="middle" class="s">distinct artifact(s)</text>
<rect x="650" y="500" width="280" height="100" rx="12" class="b"/><text x="790" y="540" text-anchor="middle" class="h">Verify + Approve</text><text x="790" y="570" text-anchor="middle" class="s">independent + human gate</text>
<path d="M1030 390 C1030 460 900 500 930 550" class="a"/><path d="M650 550 H540" class="a"/>
<text x="600" y="665" text-anchor="middle" class="s">Only promoted skills return to the retrieval index. Failure evidence remains recorded.</text>
</svg>