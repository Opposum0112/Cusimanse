<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <title>Cusimanse Architecture Refactor</title>
  <style>text{font-family:Arial,sans-serif;fill:#111} .box{fill:#f7f7f7;stroke:#222;stroke-width:2} .boundary{fill:#fff;stroke:#111;stroke-width:3} .arrow{stroke:#222;stroke-width:3;fill:none;marker-end:url(#m)} .small{font-size:18px}.title{font-size:30px;font-weight:bold}.head{font-size:22px;font-weight:bold}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#222"/></marker></defs>
  <text x="700" y="45" text-anchor="middle" class="title">Cusimanse — Architecture Refactor</text>
  <rect x="60" y="80" width="1280" height="760" rx="18" class="boundary"/>
  <rect x="100" y="110" width="260" height="100" rx="12" class="box"/><text x="230" y="145" text-anchor="middle" class="head">Campaign / Recipe</text><text x="230" y="178" text-anchor="middle" class="small">Cusimanse YAML + Taskflow-style</text>
  <rect x="420" y="110" width="260" height="100" rx="12" class="box"/><text x="550" y="145" text-anchor="middle" class="head">Stateful Runtime</text><text x="550" y="178" text-anchor="middle" class="small">LangGraph checkpoints</text>
  <rect x="740" y="110" width="260" height="100" rx="12" class="box"/><text x="870" y="145" text-anchor="middle" class="head">Primary Agent</text><text x="870" y="178" text-anchor="middle" class="small">Goose / Prime / Hermes / etc.</text>
  <rect x="1060" y="110" width="220" height="100" rx="12" class="box"/><text x="1170" y="145" text-anchor="middle" class="head">MCP</text><text x="1170" y="178" text-anchor="middle" class="small">Scoped tools / research</text>
  <path d="M360 160 H420 M680 160 H740 M1000 160 H1060" class="arrow"/>

  <rect x="280" y="280" width="840" height="160" rx="16" class="boundary"/>
  <text x="700" y="315" text-anchor="middle" class="head">CUSIMANSE SECURITY EXPERIMENT</text>
  <rect x="330" y="340" width="220" height="70" rx="10" class="box"/><text x="440" y="382" text-anchor="middle" class="small">Lima</text>
  <rect x="590" y="340" width="220" height="70" rx="10" class="box"/><text x="700" y="382" text-anchor="middle" class="small">QEMU / VM / OS</text>
  <rect x="850" y="340" width="220" height="70" rx="10" class="box"/><text x="960" y="382" text-anchor="middle" class="small">Instrumentation</text>
  <path d="M440 340 V250 M700 340 V250 M960 340 V250" class="arrow"/>

  <rect x="100" y="500" width="300" height="110" rx="12" class="box"/><text x="250" y="535" text-anchor="middle" class="head">Evidence / Case Store</text><text x="250" y="568" text-anchor="middle" class="small">Artifacts · findings · provenance</text><text x="250" y="593" text-anchor="middle" class="small">executions · verification</text>
  <rect x="550" y="500" width="300" height="110" rx="12" class="box"/><text x="700" y="535" text-anchor="middle" class="head">Voyager-style Learning</text><text x="700" y="568" text-anchor="middle" class="small">retrieve → execute → refine</text><text x="700" y="593" text-anchor="middle" class="small">evaluate → verify → promote</text>
  <rect x="1000" y="500" width="300" height="110" rx="12" class="box"/><text x="1150" y="535" text-anchor="middle" class="head">Skill Library</text><text x="1150" y="568" text-anchor="middle" class="small">SKILL.md + scripts + eval</text><text x="1150" y="593" text-anchor="middle" class="small">versioned validated capabilities</text>
  <path d="M250 500 V440 M700 500 V440 M1150 500 V440" class="arrow"/>
  <path d="M400 555 H550 M850 555 H1000" class="arrow"/>
  <path d="M1150 610 C1150 700 700 700 700 610" class="arrow"/>

  <rect x="100" y="680" width="520" height="110" rx="12" class="box"/><text x="360" y="715" text-anchor="middle" class="head">Verification / Promotion Gates</text><text x="360" y="748" text-anchor="middle" class="small">replay · distinct artifacts · independent verification</text><text x="360" y="773" text-anchor="middle" class="small">provenance · human approval</text>
  <rect x="760" y="680" width="540" height="110" rx="12" class="box"/><text x="1030" y="715" text-anchor="middle" class="head">Host Policy (outside agent control plane)</text><text x="1030" y="748" text-anchor="middle" class="small">policyctl · configuration · token observability</text><text x="1030" y="773" text-anchor="middle" class="small">not the sandbox or enforcement boundary</text>
  <path d="M700 610 V680" class="arrow"/>
  <text x="700" y="825" text-anchor="middle" class="small">Security boundary: VM/OS + mounts + credentials + privilege + network controls</text>
</svg>