<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Cusimanse primary agent shell deployment architecture</title>
<desc id="desc">The selected primary agent shell owns the complete operator, execution and orchestration lifecycle while Lima QEMU VM and OS controls provide the security boundary.</desc>
<defs>
<style>.h{font:700 25px Arial,sans-serif;fill:#f8fafc}.t{font:600 18px Arial,sans-serif;fill:#e2e8f0}.s{font:16px Arial,sans-serif;fill:#94a3b8}.a{fill:#0b1830;stroke:#38bdf8;stroke-width:2}.b{fill:#111f38;stroke:#60a5fa;stroke-width:2}.v{fill:#102a4f;stroke:#38bdf8;stroke-width:3}.e{fill:#0b1628;stroke:#8b5cf6;stroke-width:2}.p{fill:#172554;stroke:#f59e0b;stroke-width:3}.line{fill:none;stroke:#60a5fa;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}</style>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#60a5fa"/></marker>
</defs>
<rect width="1500" height="900" rx="28" fill="#07111f"/>
<text x="70" y="60" class="h" font-size="34">Cusimanse Deployment Architecture</text>
<text x="70" y="90" class="s">Terminal-first • primary-agent-shell driven • disposable VM security boundary • evidence-led research</text>

<rect x="70" y="125" width="260" height="100" rx="16" class="a"/><text x="200" y="165" text-anchor="middle" class="h">Human / CI</text><text x="200" y="194" text-anchor="middle" class="s">intent • scope • authorization</text><text x="200" y="216" text-anchor="middle" class="s">experiment request</text>
<rect x="390" y="125" width="300" height="100" rx="16" class="b"/><text x="540" y="165" text-anchor="middle" class="h">Research Contract</text><text x="540" y="194" text-anchor="middle" class="s">Markdown + YAML</text><text x="540" y="216" text-anchor="middle" class="s">what + evidence + acceptance</text>
<rect x="750" y="110" width="390" height="130" rx="16" class="p"/><text x="945" y="150" text-anchor="middle" class="h">SELECTED PRIMARY AGENT SHELL</text><text x="945" y="180" text-anchor="middle" class="t">Goose | OpenCode | Grok | Antigravity</text><text x="945" y="205" text-anchor="middle" class="t">Pi | Hermes | Codex | Prime Agent</text><text x="945" y="228" text-anchor="middle" class="s">operator • execution • orchestration • lifecycle</text>
<rect x="1190" y="125" width="240" height="100" rx="16" class="e"/><text x="1310" y="165" text-anchor="middle" class="h">Policy + Registries</text><text x="1310" y="194" text-anchor="middle" class="s">policyctl • MCP • skills</text><text x="1310" y="216" text-anchor="middle" class="s">audit configuration</text>
<path d="M330 175 H390" class="line"/><path d="M690 175 H750" class="line"/><path d="M1140 175 H1190" class="dash"/>

<rect x="70" y="280" width="1360" height="300" rx="24" class="v"/>
<text x="105" y="320" class="h">Complete Agent-Shell Operator / Execution / Orchestration Cycle</text>
<text x="105" y="347" class="s">The selected shell remains the operator; host scripts only bootstrap, validate and preflight.</text>
<rect x="105" y="380" width="245" height="145" rx="14" class="a"/><text x="227" y="420" text-anchor="middle" class="h">Discover / Validate</text><text x="227" y="450" text-anchor="middle" class="s">load contracts</text><text x="227" y="474" text-anchor="middle" class="s">load recipe graph</text><text x="227" y="498" text-anchor="middle" class="s">preflight</text>
<rect x="390" y="380" width="245" height="145" rx="14" class="a"/><text x="512" y="420" text-anchor="middle" class="h">Plan / Review</text><text x="512" y="450" text-anchor="middle" class="s">plan actions</text><text x="512" y="474" text-anchor="middle" class="s">request approval</text><text x="512" y="498" text-anchor="middle" class="s">record audit</text>
<rect x="675" y="380" width="245" height="145" rx="14" class="a"/><text x="797" y="420" text-anchor="middle" class="h">Provision / Execute</text><text x="797" y="450" text-anchor="middle" class="s">VM + instrumentation</text><text x="797" y="474" text-anchor="middle" class="s">approved workload</text><text x="797" y="498" text-anchor="middle" class="s">observe runtime</text>
<rect x="960" y="380" width="245" height="145" rx="14" class="a"/><text x="1082" y="420" text-anchor="middle" class="h">Collect / Verify</text><text x="1082" y="450" text-anchor="middle" class="s">raw evidence</text><text x="1082" y="474" text-anchor="middle" class="s">forensics</text><text x="1082" y="498" text-anchor="middle" class="s">independent verify</text>
<rect x="1245" y="380" width="145" height="145" rx="14" class="a"/><text x="1317" y="420" text-anchor="middle" class="h">Report</text><text x="1317" y="450" text-anchor="middle" class="s">preserve</text><text x="1317" y="474" text-anchor="middle" class="s">destroy</text>
<path d="M350 452 H390" class="line"/><path d="M635 452 H675" class="line"/><path d="M920 452 H960" class="line"/><path d="M1205 452 H1245" class="line"/>

<rect x="70" y="625" width="430" height="150" rx="16" class="e"/><text x="285" y="665" text-anchor="middle" class="h">Evidence + Verification</text><text x="285" y="695" text-anchor="middle" class="s">telemetry • blackboard • raw artifacts</text><text x="285" y="720" text-anchor="middle" class="s">reduction • forensics • independent verification</text><text x="285" y="748" text-anchor="middle" class="s">model output is never evidence</text>
<rect x="535" y="625" width="430" height="150" rx="16" class="e"/><text x="750" y="665" text-anchor="middle" class="h">Preservation</text><text x="750" y="695" text-anchor="middle" class="s">hash • manifest • report</text><text x="750" y="720" text-anchor="middle" class="s">preserve before VM destruction</text><text x="750" y="748" text-anchor="middle" class="s">replayable run inputs</text>
<rect x="1000" y="625" width="430" height="150" rx="16" class="v"/><text x="1215" y="665" text-anchor="middle" class="h">SECURITY BOUNDARY</text><text x="1215" y="695" text-anchor="middle" class="t">Disposable Lima / QEMU VM + OS</text><text x="1215" y="720" text-anchor="middle" class="s">filesystem/mount controls</text><text x="1215" y="744" text-anchor="middle" class="s">credentials • network • privileges</text>
<path d="M285 525 V610" class="line"/><path d="M797 525 V610 H750 V625" class="line"/><path d="M1082 525 V610 H1215 V625" class="line"/>
<text x="70" y="840" class="s">Design rule: Markdown specifies • YAML configures • primary agent shell operates/orchestrates • adapters translate • policy constrains • audit records • evidence proves • VM/OS controls contain.</text>
</svg>
