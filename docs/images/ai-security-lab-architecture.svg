<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="white"/><g font-family="Arial,sans-serif" fill="#17335f"><text x="40" y="48" font-size="32" font-weight="700">AI Security Lab — Goose-Driven Architecture</text><text x="40" y="76" font-size="16">Markdown specifies • YAML configures • Goose operates and executes • policyctl configures policy • evidence verifies</text><rect x="40" y="110" width="1120" height="105" rx="14" fill="#eef5ff" stroke="#789" stroke-width="2"/><text x="600" y="145" text-anchor="middle" font-size="22" font-weight="700">PROJECT CONTRACTS</text><text x="600" y="178" text-anchor="middle" font-size="16">Markdown contracts + recipes/goose/project.yaml + modular YAML recipes</text><path d="M600 215V255" stroke="#526b87" stroke-width="3"/><polygon points="600,265 590,248 610,248" fill="#526b87"/><rect x="40" y="270" width="700" height="180" rx="14" fill="#f1edff" stroke="#789" stroke-width="2"/><text x="390" y="305" text-anchor="middle" font-size="22" font-weight="700">GOOSE — AGENTIC PROJECT PLANE</text><text x="75" y="345" font-size="16">Planner → Reviewer → Operator → Executor</text><text x="75" y="375" font-size="16">Preflight → Plan → Approval → Provision → Instrument</text><text x="75" y="405" font-size="16">Execute → Collect → Forensics → Independent Verify → Report</text><text x="75" y="435" font-size="16">Token dashboard → Destroy → optional Git checkpoint</text><rect x="770" y="270" width="390" height="180" rx="14" fill="#fff0f0" stroke="#789" stroke-width="2"/><text x="965" y="305" text-anchor="middle" font-size="22" font-weight="700">POLICY</text><text x="805" y="345" font-size="16">policyctl</text><text x="805" y="375" font-size="16">credentials / mounts / privilege</text><text x="805" y="405" font-size="16">human approval / fail closed</text><text x="805" y="435" font-size="16">configuration only — no orchestration</text><path d="M740 360H770" stroke="#526b87" stroke-width="3"/><rect x="40" y="500" width="1120" height="100" rx="14" fill="#fff7e6" stroke="#789" stroke-width="2"/><text x="600" y="535" text-anchor="middle" font-size="22" font-weight="700">DISPOSABLE EXECUTION</text><text x="600" y="570" text-anchor="middle" font-size="16">Lima / QEMU → host profile + VM profile + tools + instrumentation + workload</text><path d="M390 450V490" stroke="#526b87" stroke-width="3"/><path d="M965 450V490" stroke="#526b87" stroke-width="3"/><rect x="40" y="635" width="1120" height="80" rx="14" fill="#edf9f2" stroke="#789" stroke-width="2"/><text x="600" y="668" text-anchor="middle" font-size="22" font-weight="700">EVIDENCE &amp; OBSERVABILITY</text><text x="600" y="695" text-anchor="middle" font-size="15">Numbat • Phoenix/OTel • logs • JSONL • PCAP • hashes → deterministic reduction → verification → reports</text><path d="M600 600V625" stroke="#526b87" stroke-width="3"/></g></svg>