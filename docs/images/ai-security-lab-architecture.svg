<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980"><defs><style>.title{font:700 34px Arial,sans-serif;fill:#17335f}.sub{font:16px Arial,sans-serif;fill:#45566f}.h{font:700 19px Arial,sans-serif;fill:#17335f}.t{font:15px Arial,sans-serif;fill:#23344d}.small{font:13px Arial,sans-serif;fill:#40516a}.box{stroke:#8aa0bb;stroke-width:2;rx:12}.human{fill:#f5f5f5}.agent{fill:#f1edff}.control{fill:#eaf8f0}.policy{fill:#fff0f0}.model{fill:#eaf4ff}.iso{fill:#fff7e6}.evidence{fill:#edf9f2}.obs{fill:#eeeaff}.recipe{fill:#fffdf0}.arrow{stroke:#526b87;stroke-width:2.5;fill:none;marker-end:url(#a)}.dash{stroke:#7a8ca3;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#526b87"/></marker></defs><rect width="1400" height="980" fill="white"/><text x="45" y="52" class="title">AI Security Lab — Fully Agentic Project Architecture</text><text x="45" y="80" class="sub">Goose operates the research lifecycle; Go executes deterministically; recipes customize; evidence verifies.</text><rect x="35" y="115" width="1330" height="155" class="box human"/><text x="700" y="146" text-anchor="middle" class="h">INTENT &amp; KNOWLEDGE PLANE</text><rect x="60" y="165" width="250" height="80" class="box human"/><text x="185" y="193" text-anchor="middle" class="h">Human / CI Intent</text><text x="185" y="220" text-anchor="middle" class="small">research goal • approval • constraints</text><rect x="350" y="165" width="300" height="80" class="box recipe"/><text x="500" y="193" text-anchor="middle" class="h">Research Contracts</text><text x="500" y="220" text-anchor="middle" class="small">Markdown • policy • acceptance criteria</text><rect x="690" y="165" width="300" height="80" class="box recipe"/><text x="840" y="193" text-anchor="middle" class="h">Recipe Source of Truth</text><text x="840" y="220" text-anchor="middle" class="small">YAML • workload • VM • agents • install • routing</text><rect x="1030" y="165" width="300" height="80" class="box human"/><text x="1180" y="193" text-anchor="middle" class="h">Git / Versioning</text><text x="1180" y="220" text-anchor="middle" class="small">manifests • reports • reproducibility</text><rect x="35" y="305" width="430" height="315" class="box agent"/><text x="250" y="338" text-anchor="middle" class="h">GOOSE — AGENTIC OPERATIONS PLANE</text><text x="60" y="375" class="t">Planner — resolve goal → recipes → execution graph</text><text x="60" y="410" class="t">Reviewer — prerequisites → policy → safety → evidence</text><text x="60" y="445" class="t">Executor — invoke approved control-plane operations</text><text x="60" y="480" class="t">Forensic Reviewer — analyze reduced evidence</text><text x="60" y="515" class="t">Independent Reviewer — challenge findings</text><text x="60" y="550" class="t">Report / Token Agent — produce artifacts and usage data</text><text x="60" y="590" class="small">Goose is the reasoning/orchestration layer, not the security boundary.</text><rect x="500" y="305" width="410" height="315" class="box control"/><text x="705" y="338" text-anchor="middle" class="h">GO CONTROL PLANE — DETERMINISTIC OPS</text><text x="525" y="375" class="t">labctl — CLI/API façade for the Go engine</text><text x="525" y="410" class="t">Recipe loader / validator / resolver</text><text x="525" y="445" class="t">Capability detection / platform matching</text><text x="525" y="480" class="t">Policy / approval / credential &amp; mount controls</text><text x="525" y="515" class="t">Execution / VM / instrumentation backends</text><text x="525" y="550" class="t">Evidence / monitoring / reporting interfaces</text><text x="525" y="590" class="small">Go executes approved plans; it does not make research decisions.</text><rect x="945" y="305" width="420" height="315" class="box model"/><text x="1155" y="338" text-anchor="middle" class="h">MODEL &amp; HARNESS ROUTING</text><text x="970" y="375" class="t">Harness Router — Goose / other approved harnesses</text><text x="970" y="410" class="t">LLM Gateway / LiteLLM / OmniRoute</text><text x="970" y="445" class="t">Model selection / fallback / context policy</text><text x="970" y="480" class="t">Token, latency, retry and cache telemetry</text><text x="970" y="515" class="t">Raw evidence stays outside LLM context</text><text x="970" y="550" class="t">Reduced evidence is supplied to reasoning agents</text><text x="970" y="590" class="small">Routing changes models, not execution authority.</text><path d="M310 205 H350" class="arrow"/><path d="M650 205 H690" class="arrow"/><path d="M990 205 H1030" class="arrow"/><path d="M250 270 V305" class="arrow"/><path d="M840 270 V305" class="arrow"/><path d="M465 460 H500" class="arrow"/><path d="M910 460 H945" class="dash"/><rect x="35" y="655" width="1330" height="205" class="box iso"/><text x="700" y="688" text-anchor="middle" class="h">EXPERIMENT PLANE — DISPOSABLE EXECUTION</text><rect x="60" y="715" width="260" height="110" class="box iso"/><text x="190" y="744" text-anchor="middle" class="h">VM / Backend</text><text x="190" y="770" text-anchor="middle" class="t">Lima • QEMU • KVM</text><text x="190" y="797" text-anchor="middle" class="small">future backend adapters</text><rect x="350" y="715" width="340" height="110" class="box iso"/><text x="520" y="744" text-anchor="middle" class="h">Workload</text><text x="520" y="770" text-anchor="middle" class="t">npm • Go • pip • cargo • scripts</text><text x="520" y="797" text-anchor="middle" class="small">untrusted actions stay isolated</text><rect x="720" y="715" width="280" height="110" class="box obs"/><text x="860" y="744" text-anchor="middle" class="h">Instrumentation</text><text x="860" y="770" text-anchor="middle" class="t">syscalls • network • filesystem</text><text x="860" y="797" text-anchor="middle" class="small">eBPF where capability permits</text><rect x="1030" y="715" width="305" height="110" class="box obs"/><text x="1182" y="744" text-anchor="middle" class="h">Agent Monitoring</text><text x="1182" y="770" text-anchor="middle" class="t">Numbat • Phoenix • OTel</text><text x="1182" y="797" text-anchor="middle" class="small">agent/tool/runtime telemetry</text><path d="M705 620 V655" class="arrow"/><path d="M190 825 V860" class="arrow"/><path d="M520 825 V860" class="arrow"/><path d="M860 825 V860" class="arrow"/><path d="M1182 825 V860" class="arrow"/><rect x="35" y="895" width="1330" height="60" class="box evidence"/><text x="700" y="922" text-anchor="middle" class="h">EVIDENCE → REDUCTION → FORENSICS → INDEPENDENT VERIFICATION → REPORT / TOKEN DASHBOARD → GIT</text></svg>