<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920"><style>text{font-family:Arial,sans-serif;fill:#10243e}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#49627a}.head{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.box{fill:#fff;stroke:#2b83c6;stroke-width:2}.group{fill:#eef7ff;stroke:#6aa9d8;stroke-width:2}.mandatory{fill:#eefaf5;stroke:#39a36b;stroke-width:2}.optional{fill:#f7f7f7;stroke:#888;stroke-width:2;stroke-dasharray:8 6}.gov{fill:#fff1f1;stroke:#d45b5b;stroke-width:2}.arrow{stroke:#2b83c6;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="3" orient="auto"><path d="M0,0 L11,3 L0,6z" fill="#2b83c6"/></marker></defs>
<rect width="1400" height="920" fill="#fbfdff"/><text x="700" y="45" text-anchor="middle" class="title">Cusimanse — Declarative, Agent-Neutral Security Research</text><text x="700" y="72" text-anchor="middle" class="sub">Goose is the reference operator; the recipe remains the experiment source of truth.</text>
<rect x="30" y="95" width="1340" height="150" rx="18" class="group"/><text x="55" y="125" class="head">1. Research definition</text><rect x="70" y="150" width="260" height="65" rx="10" class="box"/><text x="200" y="178" text-anchor="middle" class="head">Researcher</text><text x="200" y="200" text-anchor="middle" class="small">question • scope • safety</text><rect x="410" y="150" width="320" height="65" rx="10" class="box"/><text x="570" y="178" text-anchor="middle" class="head">Contract</text><text x="570" y="200" text-anchor="middle" class="small">intent • authorization • acceptance</text><rect x="810" y="150" width="480" height="65" rx="10" class="box"/><text x="1050" y="178" text-anchor="middle" class="head">Agent-neutral YAML experiment recipe</text><text x="1050" y="200" text-anchor="middle" class="small">VM • tools • instrumentation • workload • outputs • learning</text><path d="M330 182H410M730 182H810" class="arrow"/>
<rect x="30" y="270" width="1340" height="205" rx="18" class="group"/><text x="55" y="300" class="head">2. Primary-agent operation</text><rect x="70" y="325" width="330" height="115" rx="10" class="box"/><text x="235" y="355" text-anchor="middle" class="head">Goose — reference operator</text><text x="95" y="382" class="body">• Plan / Todo</text><text x="95" y="406" class="body">• native multiagent / subagent delegation</text><text x="95" y="430" class="body">• execute recipes and manage session</text><rect x="455" y="325" width="390" height="115" rx="10" class="box"/><text x="650" y="355" text-anchor="middle" class="head">Specialist roles</text><text x="485" y="382" class="body">Planner • Researcher • Runtime Analyst</text><text x="485" y="406" class="body">Forensics • Detection • Verifier</text><text x="485" y="430" class="body">Report Generator</text><rect x="900" y="325" width="390" height="115" rx="10" class="box"/><text x="1095" y="355" text-anchor="middle" class="head">Native capabilities</text><text x="930" y="382" class="body">Skills • MCP • Developer tools</text><text x="930" y="406" class="body">Other validated primary agents use</text><text x="930" y="430" class="body">the same recipe through adapters/prompts</text><path d="M1050 215V270M400 382H455M845 382H900" class="arrow"/>
<rect x="30" y="500" width="1340" height="135" rx="18" class="mandatory"/><text x="55" y="530" class="head">3. Mandatory host layer — installed and configured by ./scripts/install.sh from YAML</text><text x="75" y="565" class="body">Goose • Lima • QEMU • Go • Node/npm • forensic/network tools • LiteLLM • OmniRoute</text><text x="75" y="592" class="body">Numbat • Aegis • Phoenix/OpenTelemetry • ClawMetry • jq/yq/rg and supporting utilities</text><text x="75" y="618" class="small">Declaration: recipes/host/security-research.yaml   |   Access: ./scripts/tools.sh list | versions | config</text>
<rect x="30" y="660" width="1340" height="125" rx="18" class="group"/><text x="55" y="690" class="head">4. Disposable execution — workload is run by the recipe and primary agent</text><rect x="70" y="715" width="300" height="45" rx="9" class="box"/><text x="220" y="743" text-anchor="middle" class="body">Lima + QEMU VM / guest OS</text><rect x="455" y="715" width="300" height="45" rx="9" class="box"/><text x="605" y="743" text-anchor="middle" class="body">Instrumentation profile</text><rect x="840" y="715" width="420" height="45" rx="9" class="box"/><text x="1050" y="743" text-anchor="middle" class="body">Recipe-defined workload</text><path d="M235 440V500M700 635V660M220 760H455M755 760H840" class="arrow"/>
<rect x="30" y="810" width="1340" height="80" rx="18" class="group"/><text x="55" y="840" class="head">5. Evidence and results</text><text x="55" y="868" class="body">Evidence → session.yaml → analysis → independent verification → research-report/report.md + report.yaml → preservation → VM destruction</text><text x="55" y="887" class="small">Learning is opt-in after verification: set session.yaml learning.enabled=true, then obtain explicit human approval before promotion.</text>
<rect x="1090" y="35" width="250" height="38" rx="10" class="optional"/><text x="1215" y="60" text-anchor="middle" class="small">Container Use: optional</text></svg>