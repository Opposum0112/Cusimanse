<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc"><title id="title">Cusimanse native Go security research architecture</title><desc id="desc">A bounded security research loop from intent through ADK reasoning, Cusimanse policy and capabilities, disposable execution, evidence, verification and reporting.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker><style>.t{font:700 28px sans-serif;fill:#0f172a}.s{font:700 18px sans-serif;fill:#334155}.h{font:700 15px sans-serif;fill:#0f172a}.b{font:14px sans-serif;fill:#334155}.box{fill:#fff;stroke:#64748b;stroke-width:1.5}.arrow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}.loop{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#a)}</style></defs><rect width="1400" height="1000" fill="#fff"/><text x="700" y="40" text-anchor="middle" class="t">Cusimanse — Native Go Security Research Agent</text><text x="700" y="67" text-anchor="middle" class="b">LLM reasons • ADK orchestrates • Cusimanse authorizes • disposable compute executes • evidence proves</text><rect x="40" y="95" width="1320" height="135" rx="16" fill="#eef5ff" stroke="#7aa2d6"/><text x="65" y="125" class="s">1. RESEARCH INTAKE &amp; PLANNING</text><rect x="75" y="145" width="270" height="62" rx="10" class="box"/><text x="210" y="171" text-anchor="middle" class="h">Research Intent</text><text x="95" y="193" class="b">question • scope • authorization</text><rect x="390" y="145" width="300" height="62" rx="10" class="box"/><text x="540" y="171" text-anchor="middle" class="h">ADK Planner</text><text x="410" y="193" class="b">plan • assumptions • acceptance</text><rect x="735" y="145" width="300" height="62" rx="10" class="box"/><text x="885" y="171" text-anchor="middle" class="h">Research State</text><text x="755" y="193" class="b">session • iteration • durable checkpoints</text><rect x="1080" y="145" width="245" height="62" rx="10" class="box"/><text x="1202" y="171" text-anchor="middle" class="h">Memory</text><text x="1100" y="193" class="b">prior research context</text><path d="M345 176H390M690 176H735M1035 176H1080" class="arrow"/><rect x="40" y="250" width="1320" height="160" rx="16" fill="#f4efff" stroke="#a98bd1"/><text x="65" y="280" class="s">2. ADK AGENT &amp; CUSIMANSE AUTHORITY BOUNDARY</text><rect x="75" y="305" width="320" height="78" rx="10" class="box"/><text x="235" y="332" text-anchor="middle" class="h">ADK Go 2 Workflow</text><text x="95" y="355" class="b">planner • researcher • analyzer</text><text x="95" y="373" class="b">verifier • reporter • HITL</text><rect x="440" y="295" width="400" height="98" rx="12" fill="#f0e8ff" stroke="#7450a5" stroke-width="2.5"/><text x="640" y="324" text-anchor="middle" class="h">Cusimanse Go Authority</text><text x="465" y="348" class="b">contracts • capability registry • policy</text><text x="465" y="369" class="b">Check() • Execute() • journal • provenance</text><rect x="885" y="305" width="200" height="78" rx="10" class="box"/><text x="985" y="332" text-anchor="middle" class="h">HITL Gate</text><text x="905" y="355" class="b">approval before</text><text x="905" y="373" class="b">sensitive execution</text><rect x="1130" y="305" width="195" height="78" rx="10" class="box"/><text x="1227" y="332" text-anchor="middle" class="h">Fail Closed</text><text x="1150" y="355" class="b">unknown = deny</text><text x="1150" y="373" class="b">policy cannot be bypassed</text><path d="M395 344H440M840 344H885M1085 344H1130" class="arrow"/><rect x="40" y="430" width="1320" height="165" rx="16" fill="#fff1f1" stroke="#b94a4a"/><text x="65" y="460" class="s">3. CAPABILITY REQUEST → POLICY → CONTROLLED EXECUTION</text><rect x="75" y="485" width="260" height="78" rx="10" class="box"/><text x="205" y="512" text-anchor="middle" class="h">Capability Request</text><text x="95" y="535" class="b">intent + parameters + run ID</text><rect x="380" y="475" width="280" height="98" rx="10" class="box"/><text x="520" y="502" text-anchor="middle" class="h">Policy Gate</text><text x="400" y="526" class="b">ALLOW / DENY / APPROVAL</text><text x="400" y="548" class="b">then deterministic Check()</text><rect x="705" y="485" width="270" height="78" rx="10" class="box"/><text x="840" y="512" text-anchor="middle" class="h">Execution Journal</text><text x="725" y="535" class="b">intent • running • outcome</text><text x="725" y="552" class="b">replay / ambiguous-effect guard</text><rect x="1020" y="485" width="305" height="78" rx="10" class="box"/><text x="1172" y="512" text-anchor="middle" class="h">Capability Execute()</text><text x="1040" y="535" class="b">only registered, checked operation</text><path d="M335 524H380M660 524H705M975 524H1020" class="arrow"/><rect x="40" y="615" width="1320" height="155" rx="16" fill="#fff4e5" stroke="#d38a32"/><text x="65" y="645" class="s">4. DISPOSABLE RESEARCH ENVIRONMENT</text><rect x="75" y="670" width="290" height="75" rx="10" class="box"/><text x="220" y="697" text-anchor="middle" class="h">Lima / QEMU / Docker</text><text x="95" y="720" class="b">isolated compute lifecycle</text><text x="95" y="738" class="b">destroy after preservation</text><rect x="410" y="660" width="300" height="95" rx="10" class="box"/><text x="560" y="687" text-anchor="middle" class="h">Workload</text><text x="430" y="711" class="b">npm • Go • package fixtures</text><text x="430" y="731" class="b">reproducible research target</text><rect x="755" y="670" width="250" height="75" rx="10" class="box"/><text x="880" y="697" text-anchor="middle" class="h">Instrumentation</text><text x="775" y="720" class="b">process • syscall • FS • network</text><rect x="1050" y="670" width="275" height="75" rx="10" class="box"/><text x="1187" y="697" text-anchor="middle" class="h">Observation Collection</text><text x="1070" y="720" class="b">raw telemetry + timestamps</text><path d="M365 707H410M710 707H755M1005 707H1050" class="arrow"/><rect x="40" y="790" width="1320" height="165" rx="16" fill="#edf8ef" stroke="#78a983"/><text x="65" y="820" class="s">5. EVIDENCE → ANALYSIS → VERIFICATION → REPORT</text><rect x="75" y="845" width="230" height="78" rx="10" class="box"/><text x="190" y="872" text-anchor="middle" class="h">Evidence Store</text><text x="95" y="895" class="b">immutable observations</text><text x="95" y="913" class="b">SHA-256 provenance</text><rect x="340" y="845" width="230" height="78" rx="10" class="box"/><text x="455" y="872" text-anchor="middle" class="h">Analyzer</text><text x="360" y="895" class="b">facts vs hypotheses</text><text x="360" y="913" class="b">evidence gaps</text><rect x="605" y="845" width="230" height="78" rx="10" class="box"/><text x="720" y="872" text-anchor="middle" class="h">Independent Verifier</text><text x="625" y="895" class="b">acceptance criteria</text><text x="625" y="913" class="b">PASS / GAP</text><rect x="870" y="845" width="205" height="78" rx="10" class="box"/><text x="972" y="872" text-anchor="middle" class="h">Report</text><text x="890" y="895" class="b">verified result</text><text x="890" y="913" class="b">limitations</text><rect x="1110" y="845" width="215" height="78" rx="10" class="box"/><text x="1217" y="872" text-anchor="middle" class="h">Preserve / Cleanup</text><text x="1130" y="895" class="b">bundle evidence</text><text x="1130" y="913" class="b">destroy compute</text><path d="M305 884H340M570 884H605M835 884H870M1075 884H1110" class="arrow"/><path d="M720 845C720 805 560 785 560 755" class="loop"/><text x="585" y="792" class="b">GAP → refine plan → bounded next iteration</text></svg>