<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Cusimanse Declarative Agentic Pluggable Security Research Platform</title>
<desc id="desc">Markdown contracts specify research semantics, YAML recipes configure modular components, one selected agent adapter operates and executes, an optional CrewAI specialist plane supplies pluggable roles and skills through MCP, disposable Lima QEMU VMs enforce isolation, and a blackboard preserves evidence, audit, runs and analysis for reports and self learning.</desc>
<defs><style>.h{font:700 24px Arial,sans-serif;fill:#f8fafc}.t{font:600 17px Arial,sans-serif;fill:#e2e8f0}.s{font:15px Arial,sans-serif;fill:#94a3b8}.box{fill:#0b1830;stroke:#60a5fa;stroke-width:2}.plane{fill:#111f38;stroke:#8b5cf6;stroke-width:2}.plug{fill:#172554;stroke:#f59e0b;stroke-width:3}.exec{fill:#102a4f;stroke:#38bdf8;stroke-width:3}.data{fill:#0b1628;stroke:#a78bfa;stroke-width:2}.gov{fill:#171c2e;stroke:#f59e0b;stroke-width:2}.line{fill:none;stroke:#60a5fa;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#60a5fa"/></marker></defs>
<rect width="1600" height="1000" rx="28" fill="#07111f"/>
<text x="800" y="48" text-anchor="middle" class="h" font-size="34">Cusimanse — Declarative Agentic Pluggable Security Research Platform</text>
<text x="800" y="78" text-anchor="middle" class="s">Markdown specifies • YAML configures • adapter operates • CrewAI coordinates specialist roles • blackboard preserves evidence • VM/OS enforces</text>

<rect x="55" y="110" width="1490" height="120" rx="18" class="box"/>
<text x="800" y="145" text-anchor="middle" class="h">1 · DECLARATIVE CONTRACT &amp; RECIPE PLANE</text>
<text x="800" y="176" text-anchor="middle" class="t">Markdown contracts: intent, scope, hypotheses, acceptance, safety, evidence and promotion gates</text>
<text x="800" y="203" text-anchor="middle" class="t">YAML recipes: campaign • workload • VM • tools • instrumentation • adapter • roles • skills • MCP • audit • reporting</text>

<rect x="55" y="260" width="1490" height="170" rx="18" class="plug"/>
<text x="800" y="296" text-anchor="middle" class="h">2 · MODULAR PLUGGABLE OPERATOR PLANE</text>
<rect x="90" y="325" width="270" height="75" rx="12" class="box"/><text x="225" y="355" text-anchor="middle" class="t">Selected Agent Adapter</text><text x="225" y="380" text-anchor="middle" class="s">Goose • OpenCode • Grok • Pi • Hermes • Codex • Prime • future</text>
<rect x="390" y="325" width="270" height="75" rx="12" class="box"/><text x="525" y="355" text-anchor="middle" class="t">CrewAI Specialist Layer</text><text x="525" y="380" text-anchor="middle" class="s">optional role orchestration</text>
<rect x="690" y="325" width="270" height="75" rx="12" class="box"/><text x="825" y="355" text-anchor="middle" class="t">Role Plugins</text><text x="825" y="380" text-anchor="middle" class="s">planner • researcher • analyst • verifier • reporter</text>
<rect x="990" y="325" width="270" height="75" rx="12" class="box"/><text x="1125" y="355" text-anchor="middle" class="t">Skill Plugins</text><text x="1125" y="380" text-anchor="middle" class="s">SKILL.md • scripts • eval • provenance</text>
<rect x="1290" y="325" width="215" height="75" rx="12" class="box"/><text x="1397" y="355" text-anchor="middle" class="t">MCP Plugins</text><text x="1397" y="380" text-anchor="middle" class="s">scoped tools</text>
<path d="M360 362H390 M660 362H690 M960 362H990 M1260 362H1290" class="line"/>

<rect x="55" y="460" width="1490" height="180" rx="18" class="exec"/>
<text x="800" y="495" text-anchor="middle" class="h">3 · AGENT-OPERATED RESEARCH EXECUTION PLANE</text>
<rect x="90" y="525" width="250" height="80" rx="12" class="box"/><text x="215" y="555" text-anchor="middle" class="t">Discover / Validate</text><text x="215" y="580" text-anchor="middle" class="s">contracts • recipes • preflight</text>
<rect x="375" y="525" width="250" height="80" rx="12" class="box"/><text x="500" y="555" text-anchor="middle" class="t">Plan / Review / Approve</text><text x="500" y="580" text-anchor="middle" class="s">roles • gates • audit</text>
<rect x="660" y="525" width="250" height="80" rx="12" class="box"/><text x="785" y="555" text-anchor="middle" class="t">Provision / Instrument</text><text x="785" y="580" text-anchor="middle" class="s">Lima • QEMU • telemetry</text>
<rect x="945" y="525" width="250" height="80" rx="12" class="box"/><text x="1070" y="555" text-anchor="middle" class="t">Execute / Collect / Analyze</text><text x="1070" y="580" text-anchor="middle" class="s">workload • raw evidence • forensics</text>
<rect x="1230" y="525" width="275" height="80" rx="12" class="box"/><text x="1367" y="555" text-anchor="middle" class="t">Verify / Report / Preserve</text><text x="1367" y="580" text-anchor="middle" class="s">independent check • hashes • report</text>
<path d="M340 565H375 M625 565H660 M910 565H945 M1195 565H1230" class="line"/>

<rect x="55" y="670" width="700" height="180" rx="18" class="data"/>
<text x="405" y="706" text-anchor="middle" class="h">4 · BLACKBOARD / DURABLE CASE PLANE</text>
<text x="405" y="738" text-anchor="middle" class="t">Runs + audit + raw artifacts + telemetry + findings + provenance</text>
<text x="405" y="765" text-anchor="middle" class="t">evidence analysis + verification + execution relations</text>
<text x="405" y="792" text-anchor="middle" class="s">case ID • campaign • execution • artifact • finding • verification • skill candidate</text>
<text x="405" y="819" text-anchor="middle" class="s">Preserve and hash before VM destruction; model output is never evidence</text>

<rect x="795" y="670" width="750" height="180" rx="18" class="plane"/>
<text x="1170" y="706" text-anchor="middle" class="h">5 · SELF-LEARNING &amp; PROMOTION PLANE</text>
<text x="1170" y="738" text-anchor="middle" class="t">retrieve → execute → evaluate → refine → replay on distinct artifacts</text>
<text x="1170" y="765" text-anchor="middle" class="t">→ independent verification → human approval → validated skill → indexed retrieval</text>
<text x="1170" y="792" text-anchor="middle" class="s">Agent and campaign can propose skill/recipe improvements; base contracts remain immutable</text>
<text x="1170" y="819" text-anchor="middle" class="s">Candidate ≠ trusted capability; failed candidates remain retained for learning</text>
<path d="M755 760H795" class="dash"/>

<rect x="55" y="880" width="1490" height="75" rx="18" class="gov"/>
<text x="800" y="912" text-anchor="middle" class="t">6 · GOVERNANCE / SECURITY BOUNDARY</text>
<text x="800" y="938" text-anchor="middle" class="s">policyctl is outside the agent control plane • approvals/audit constrain actions • Lima/QEMU + VM/OS enforce mounts, credentials, privilege and network</text>
<text x="800" y="978" text-anchor="middle" class="s">Security invariant: no agent, role, skill, MCP server or orchestrator is the sandbox or may bypass the VM/OS boundary.</text>

<path d="M800 230V260 M800 430V460 M500 640V670 M1100 640V670" class="line"/>
</svg>