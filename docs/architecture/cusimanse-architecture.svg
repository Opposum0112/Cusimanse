<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc"><title id="title">Cusimanse agent-operated capability architecture</title><desc id="desc">Research requirements flow to a primary agent, Go capability API, policy control, reusable profiles, disposable Lima or QEMU compute, instrumentation, evidence, verification and reporting.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.t{font:700 28px sans-serif;fill:#0f172a}.s{font:700 17px sans-serif;fill:#334155}.h{font:700 15px sans-serif;fill:#0f172a}.b{font:14px sans-serif;fill:#334155}.box{fill:#fff;stroke:#64748b;stroke-width:1.5}.arrow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}.dash{stroke-dasharray:7 6}</style></defs><rect width="1400" height="980" fill="#fff"/><text x="700" y="38" text-anchor="middle" class="t">Cusimanse — Agent-Operated Security Research</text><text x="700" y="64" text-anchor="middle" class="b">Declare requirements → agent selects capabilities → policy gate → Go API provisions/executes → evidence → verify → report</text><rect x="35" y="88" width="1330" height="135" rx="16" fill="#eef5ff" stroke="#7aa2d6"/><text x="55" y="116" class="s">1. DECLARATION &amp; CAPABILITY PLANE</text><rect x="70" y="138" width="280" height="62" rx="10" class="box"/><text x="210" y="164" text-anchor="middle" class="h">Research Contract</text><text x="90" y="186" class="b">purpose • scope • authorization</text><rect x="390" y="138" width="330" height="62" rx="10" class="box"/><text x="555" y="164" text-anchor="middle" class="h">Experiment Requirements</text><text x="410" y="186" class="b">workload • OS • isolation • network • telemetry</text><rect x="760" y="138" width="270" height="62" rx="10" class="box"/><text x="895" y="164" text-anchor="middle" class="h">Capability Registry</text><text x="780" y="186" class="b">versioned host/workload profiles</text><rect x="1070" y="138" width="260" height="62" rx="10" class="box"/><text x="1200" y="164" text-anchor="middle" class="h">Pluggable Providers</text><text x="1090" y="186" class="b">Lima • QEMU • WSL2 • future</text><path d="M350 169H390M720 169H760M1030 169H1070" class="arrow"/><rect x="35" y="243" width="1330" height="150" rx="16" fill="#f4efff" stroke="#a98bd1"/><text x="55" y="271" class="s">2. AGENT &amp; GO CAPABILITY API</text><rect x="70" y="293" width="280" height="75" rx="10" class="box"/><text x="210" y="320" text-anchor="middle" class="h">Primary Agent / Goose</text><text x="90" y="343" class="b">plan • select • operate • adapt</text><text x="90" y="361" class="b">specialist roles + Skills</text><rect x="390" y="283" width="430" height="95" rx="10" fill="#f0e8ff" stroke="#7450a5" stroke-width="2.5"/><text x="605" y="311" text-anchor="middle" class="h">Cusimanse Go Capability API</text><text x="415" y="335" class="b">resolve • provision • configure • execute</text><text x="415" y="355" class="b">collect • destroy</text><rect x="860" y="293" width="230" height="75" rx="10" class="box"/><text x="975" y="320" text-anchor="middle" class="h">Host Profile</text><text x="880" y="343" class="b">platform + VM capability</text><text x="880" y="361" class="b">no model-generated setup</text><rect x="1130" y="293" width="200" height="75" rx="10" class="box"/><text x="1230" y="320" text-anchor="middle" class="h">Workload Profile</text><text x="1150" y="343" class="b">fixed handler</text><text x="1150" y="361" class="b">fixture + telemetry</text><path d="M350 330H390M820 330H860M1090 330H1130" class="arrow"/><rect x="35" y="413" width="1330" height="130" rx="16" fill="#fff1f1" stroke="#b94a4a"/><text x="55" y="441" class="s">3. POLICY CONTROL</text><rect x="70" y="463" width="340" height="60" rx="10" class="box"/><text x="240" y="489" text-anchor="middle" class="h">policyctl</text><text x="90" y="511" class="b">validate • check • require • audit</text><rect x="450" y="463" width="320" height="60" rx="10" class="box"/><text x="610" y="489" text-anchor="middle" class="h">Decision</text><text x="470" y="511" class="b">ALLOW • DENY • APPROVAL REQUIRED</text><rect x="810" y="463" width="520" height="60" rx="10" class="box"/><text x="1070" y="489" text-anchor="middle" class="h">Fail-closed boundary</text><text x="830" y="511" class="b">agent can operate declared capabilities; cannot expand authority</text><path d="M605 378V463M410 493H450M770 493H810" class="arrow"/><rect x="35" y="563" width="1330" height="155" rx="16" fill="#fff4e5" stroke="#d38a32"/><text x="55" y="591" class="s">4. EXECUTION &amp; CONTAINMENT</text><rect x="70" y="613" width="300" height="80" rx="10" class="box"/><text x="220" y="640" text-anchor="middle" class="h">Go Runtime</text><text x="90" y="662" class="b">provider lifecycle + fixed handlers</text><text x="90" y="680" class="b">agent-operated, policy-gated</text><rect x="410" y="603" width="370" height="100" rx="12" fill="#ffe8e8" stroke="#a33" stroke-width="2.5"/><text x="595" y="631" text-anchor="middle" class="h">Lima / QEMU Disposable VM</text><text x="435" y="654" class="b">guest = execution / isolation boundary</text><text x="435" y="676" class="b">ephemeral and destroyed after preservation</text><rect x="820" y="613" width="230" height="80" rx="10" class="box"/><text x="935" y="640" text-anchor="middle" class="h">Instrumentation</text><text x="840" y="662" class="b">process • syscall • filesystem</text><text x="840" y="680" class="b">network • timestamps</text><rect x="1090" y="613" width="240" height="80" rx="10" class="box"/><text x="1210" y="640" text-anchor="middle" class="h">Workload</text><text x="1110" y="662" class="b">Go • npm • fixtures</text><text x="1110" y="680" class="b">no host execution</text><path d="M370 653H410M780 653H820M1050 653H1090" class="arrow"/><rect x="35" y="738" width="1330" height="155" rx="16" fill="#edf8ef" stroke="#78a983"/><text x="55" y="766" class="s">5. EVIDENCE, VERIFICATION &amp; RESEARCH</text><rect x="70" y="788" width="230" height="75" rx="10" class="box"/><text x="185" y="815" text-anchor="middle" class="h">Evidence</text><text x="90" y="838" class="b">raw observations + audit</text><text x="90" y="856" class="b">session bundle</text><rect x="325" y="788" width="230" height="75" rx="10" class="box"/><text x="440" y="815" text-anchor="middle" class="h">Provenance</text><text x="345" y="838" class="b">SHA-256 + manifests</text><text x="345" y="856" class="b">recipe/tool versions</text><rect x="580" y="788" width="230" height="75" rx="10" class="box"/><text x="695" y="815" text-anchor="middle" class="h">Specialists</text><text x="600" y="838" class="b">runtime • forensics</text><text x="600" y="856" class="b">detection analysis</text><rect x="835" y="788" width="230" height="75" rx="10" class="box"/><text x="950" y="815" text-anchor="middle" class="h">Verifier</text><text x="855" y="838" class="b">independent cross-check</text><text x="855" y="856" class="b">reproducibility</text><rect x="1090" y="788" width="240" height="75" rx="10" class="box"/><text x="1210" y="815" text-anchor="middle" class="h">Report → Preserve → Destroy</text><text x="1110" y="838" class="b">research conclusion</text><text x="1110" y="856" class="b">then clean up compute</text><path d="M1210 693V788M300 825H325M555 825H580M810 825H835M1065 825H1090" class="arrow"/><path d="M1070 200V293M895 200V293M605 393V413" class="arrow dash"/></svg>