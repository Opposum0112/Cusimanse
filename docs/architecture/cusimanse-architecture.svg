<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.t{font-size:30px;font-weight:800}.h{font-size:19px;font-weight:800}.b{font-size:15px}.s{font-size:13px;fill:#536174}.card{fill:#fff;stroke:#94a3b8;stroke-width:2}.plane{fill:#f8fafc;stroke:#64748b;stroke-width:2}.boundary{fill:#fff7ed;stroke:#c2410c;stroke-width:3;stroke-dasharray:9 7}.policy{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.learn{fill:#faf5ff;stroke:#9333ea;stroke-width:2}.obs{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}</style></defs><text x="700" y="42" text-anchor="middle" class="t">Cusimanse — Declarative Agentic Security Research Platform</text><text x="700" y="68" text-anchor="middle" class="s">Markdown contracts + YAML composition · pluggable agent/role/skill plane · disposable VM boundary · evidence blackboard · self-learning</text>
<rect x="45" y="95" width="1310" height="105" rx="18" class="card"/><text x="70" y="130" class="h">DECLARATIVE RESEARCH PLANE</text><text x="70" y="158" class="b">Markdown contracts define invariants and semantics · YAML recipes compose campaigns, workloads, agents, roles, skills, MCP, instrumentation and reporting</text><text x="70" y="182" class="s">Recipes configure; they do not become the security boundary.</text>
<rect x="45" y="225" width="1310" height="180" rx="18" class="plane"/><text x="70" y="260" class="h">PLUGGABLE AGENT / ROLE / SKILL PLANE</text><rect x="70" y="282" width="300" height="95" rx="12" class="card"/><text x="220" y="312" text-anchor="middle" class="h">Agent Adapter</text><text x="220" y="339" text-anchor="middle" class="b">Goose · OpenCode · Codex · Prime · Hermes · …</text><text x="220" y="363" text-anchor="middle" class="s">one selected primary operator</text><rect x="400" y="282" width="300" height="95" rx="12" class="card"/><text x="550" y="312" text-anchor="middle" class="h">Specialist Roles</text><text x="550" y="339" text-anchor="middle" class="b">planner · researcher · runtime · forensics</text><text x="550" y="363" text-anchor="middle" class="s">CrewAI optional; role definitions are portable</text><rect x="730" y="282" width="300" height="95" rx="12" class="card"/><text x="880" y="312" text-anchor="middle" class="h">Pluggable Skills</text><text x="880" y="339" text-anchor="middle" class="b">SKILL.md · scripts · references · eval</text><text x="880" y="363" text-anchor="middle" class="s">versioned capability, not authority</text><rect x="1060" y="282" width="265" height="95" rx="12" class="card"/><text x="1192" y="312" text-anchor="middle" class="h">MCP / Tools</text><text x="1192" y="339" text-anchor="middle" class="b">scoped integrations</text><text x="1192" y="363" text-anchor="middle" class="s">loopback / approval / audit</text><path d="M370 330 H400 M700 330 H730 M1030 330 H1060" class="arrow"/>
<rect x="45" y="430" width="1310" height="125" rx="18" class="obs"/><text x="70" y="465" class="h">STATE / OBSERVABILITY / GOVERNANCE</text><text x="70" y="493" class="b">LangGraph case state · OpenTelemetry · Phoenix · Numbat · Aegis · token/tool telemetry</text><text x="70" y="518" class="s">State and observability explain execution; neither is the workload isolation boundary.</text><path d="M685 405 V430" class="arrow"/>
<rect x="170" y="580" width="1060" height="180" rx="22" class="boundary"/><text x="700" y="613" text-anchor="middle" class="h">EXECUTION SECURITY BOUNDARY</text><rect x="215" y="640" width="430" height="82" rx="12" class="card"/><text x="430" y="674" text-anchor="middle" class="h">Lima + QEMU + VM/OS</text><text x="430" y="697" text-anchor="middle" class="s">filesystem · mounts · credentials · privilege · network</text><rect x="755" y="640" width="430" height="82" rx="12" class="card"/><text x="970" y="674" text-anchor="middle" class="h">UNTRUSTED WORKLOAD</text><text x="970" y="697" text-anchor="middle" class="s">commands execute here, never on host</text><path d="M645 681 H755" class="arrow"/>
<rect x="45" y="790" width="620" height="125" rx="18" class="learn"/><text x="70" y="825" class="h">EVIDENCE BLACKBOARD</text><text x="70" y="852" class="b">run · audit · raw artifacts · telemetry · findings · analysis · verification</text><text x="70" y="878" class="s">durable case/report context and provenance; preserved before VM destruction</text><rect x="700" y="790" width="655" height="125" rx="18" class="learn"/><text x="725" y="825" class="h">SELF-LEARNING SKILL LIFECYCLE</text><text x="725" y="852" class="b">observe → candidate → evaluate → replay on distinct artifact</text><text x="725" y="878" class="s">→ independent verify → human approval → validated skill → retrieval</text><path d="M430 722 V790 M970 722 V790" class="arrow"/><path d="M665 852 H700" class="arrow"/>
<rect x="45" y="935" width="1310" height="32" rx="10" class="policy"/><text x="700" y="957" text-anchor="middle" class="b">HOST POLICY PLANE: policyctl is independent and outside the agent control plane; VM/OS controls remain the enforcement boundary.</text><path d="M1180 790 V740" class="dash"/></svg>