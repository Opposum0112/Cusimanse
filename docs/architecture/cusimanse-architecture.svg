<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">Cusimanse simplified multi-plane architecture</title>
<desc id="desc">Research intent becomes a Markdown contract and YAML recipe, then a primary agent orchestrates specialist role recipes. Policyctl remains outside the agent control plane. Model gateways route traffic. Disposable Lima QEMU execution produces evidence for verification and reporting. Optional learning happens after research and requires replay, independent verification and human approval.</desc>
<defs>
<style>.bg{fill:#07111f}.plane{fill:#0b1830;stroke:#60a5fa;stroke-width:2}.agent{fill:#172554;stroke:#f59e0b;stroke-width:3}.gw{fill:#10251c;stroke:#34d399;stroke-width:3}.exec{fill:#102a4f;stroke:#38bdf8;stroke-width:3}.data{fill:#17132a;stroke:#a78bfa;stroke-width:2}.gov{fill:#171c2e;stroke:#f59e0b;stroke-width:2}.h{font:700 24px Arial,sans-serif;fill:#f8fafc}.t{font:600 17px Arial,sans-serif;fill:#e2e8f0}.s{font:15px Arial,sans-serif;fill:#94a3b8}.line{fill:none;stroke:#60a5fa;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#a)}</style>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#60a5fa"/></marker>
</defs>
<rect width="1600" height="1100" rx="28" class="bg"/>
<text x="800" y="45" text-anchor="middle" class="h" font-size="34">Cusimanse — Simplified Multiagentic Architecture</text>
<text x="800" y="74" text-anchor="middle" class="s">Contracts define intent • recipes define execution • primary agent orchestrates • VM/OS controls enforce isolation</text>

<rect x="55" y="105" width="1490" height="120" rx="18" class="plane"/>
<text x="800" y="138" text-anchor="middle" class="h">1 · DECLARATIVE / CONTROL PLANE</text>
<text x="800" y="168" text-anchor="middle" class="t">Research contract → experiment recipe → session/profile snapshot</text>
<text x="800" y="195" text-anchor="middle" class="s">Contracts: purpose, scope, safety, evidence, acceptance • Recipes: workload, VM, tools, instrumentation, roles, agents, MCP, routing, audit, reporting</text>

<rect x="55" y="255" width="1490" height="210" rx="18" class="agent"/>
<text x="800" y="288" text-anchor="middle" class="h">2 · MULTIAGENTIC OPERATOR PLANE</text>
<rect x="90" y="315" width="300" height="105" rx="12" class="plane"/><text x="240" y="348" text-anchor="middle" class="t">Primary Agent Adapter</text><text x="240" y="375" text-anchor="middle" class="s">lifecycle + execution authority</text><text x="240" y="398" text-anchor="middle" class="s">Goose • OpenCode • Grok • Pi • Hermes • Codex • Prime</text>
<rect x="425" y="315" width="360" height="105" rx="12" class="plane"/><text x="605" y="348" text-anchor="middle" class="t">Specialist Role Recipes</text><text x="605" y="375" text-anchor="middle" class="s">planner • researcher • runtime • forensics</text><text x="605" y="398" text-anchor="middle" class="s">detection • analysis • verifier • reporter</text>
<rect x="820" y="315" width="300" height="105" rx="12" class="plane"/><text x="970" y="348" text-anchor="middle" class="t">Capabilities</text><text x="970" y="375" text-anchor="middle" class="s">versioned skills • scoped MCP</text><text x="970" y="398" text-anchor="middle" class="s">coordination, not security boundary</text>
<rect x="1155" y="315" width="355" height="105" rx="12" class="plane"/><text x="1332" y="348" text-anchor="middle" class="t">Native Orchestration</text><text x="1332" y="375" text-anchor="middle" class="s">primary agent delegates roles</text><text x="1332" y="398" text-anchor="middle" class="s">no competing core orchestrator</text>
<path d="M390 367H425 M785 367H820 M1120 367H1155" class="line"/>

<rect x="55" y="495" width="1490" height="130" rx="18" class="gw"/>
<text x="800" y="528" text-anchor="middle" class="h">3 · MODEL / ROUTING PLANE — OPTIONAL</text>
<rect x="150" y="548" width="560" height="55" rx="10" class="plane"/><text x="430" y="582" text-anchor="middle" class="t">LiteLLM — model routing + fallback + telemetry</text>
<rect x="890" y="548" width="560" height="55" rx="10" class="plane"/><text x="1170" y="582" text-anchor="middle" class="t">OmniRoute — provider routing + fallback</text>

<rect x="55" y="655" width="1490" height="190" rx="18" class="exec"/>
<text x="800" y="688" text-anchor="middle" class="h">4 · CONTROLLED EXECUTION PLANE</text>
<rect x="90" y="715" width="280" height="85" rx="12" class="plane"/><text x="230" y="748" text-anchor="middle" class="t">Policy / Review / Approval</text><text x="230" y="774" text-anchor="middle" class="s">policyctl decision + audit</text>
<rect x="405" y="715" width="280" height="85" rx="12" class="plane"/><text x="545" y="748" text-anchor="middle" class="t">Disposable Compute</text><text x="545" y="774" text-anchor="middle" class="s">Lima / QEMU + VM / OS</text>
<rect x="720" y="715" width="350" height="85" rx="12" class="plane"/><text x="895" y="748" text-anchor="middle" class="t">Instrumentation + Workload</text><text x="895" y="774" text-anchor="middle" class="s">approved workload runs inside VM</text>
<rect x="1105" y="715" width="405" height="85" rx="12" class="plane"/><text x="1307" y="748" text-anchor="middle" class="t">Raw Evidence + Telemetry</text><text x="1307" y="774" text-anchor="middle" class="s">collect → hash → preserve</text>
<path d="M370 757H405 M685 757H720 M1070 757H1105" class="line"/>

<rect x="55" y="875" width="725" height="165" rx="18" class="data"/>
<text x="417" y="908" text-anchor="middle" class="h">5 · EVIDENCE / BLACKBOARD PLANE</text>
<text x="417" y="939" text-anchor="middle" class="t">Run records • audit • artifacts • telemetry • hashes • provenance</text>
<text x="417" y="967" text-anchor="middle" class="s">Analysis consumes preserved evidence; model output is not evidence.</text>
<text x="417" y="995" text-anchor="middle" class="s">Independent verification can challenge findings without rewriting raw evidence.</text>

<rect x="815" y="875" width="730" height="165" rx="18" class="data"/>
<text x="1180" y="908" text-anchor="middle" class="h">6 · VERIFICATION / REPORT / LEARNING PLANE</text>
<text x="1180" y="939" text-anchor="middle" class="t">Independent verification → research report → preserve → finalize dashboard</text>
<text x="1180" y="967" text-anchor="middle" class="s">Optional learning: Taskflow / LangGraph → replay → independent verification</text>
<text x="1180" y="995" text-anchor="middle" class="s">HUMAN APPROVAL → skills/validated or recipe improvement • rollback on regression</text>

<rect x="55" y="1060" width="1490" height="30" rx="12" class="gov"/>
<text x="800" y="1081" text-anchor="middle" class="s">Governance invariant: policyctl is outside the agent control plane; agents, roles, skills, MCP, gateways and observability do not enforce isolation; VM/OS controls do.</text>

<path d="M800 225V255 M800 465V495 M800 625V655 M500 845V875 M1100 845V875" class="line"/>
<path d="M90 420 Q800 510 1510 420" class="dash"/>
</svg>
