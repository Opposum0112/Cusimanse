<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z"/></marker><style>text{font-family:Arial,sans-serif;fill:#111}.box{fill:#fff;stroke:#333;stroke-width:2}.boundary{fill:#f7f7f7;stroke:#222;stroke-width:3;stroke-dasharray:8 6}.arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#a)}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.small{font-size:15px}</style></defs>
<text x="600" y="42" text-anchor="middle" class="title">Cusimanse — Production Architecture &amp; Security Planes</text>
<rect x="40" y="80" width="1120" height="110" rx="14" class="box"/>
<text x="70" y="112" class="head">NORMAL HOST SHELL — Researcher</text><text x="70" y="142" class="small">Install • preflight • select primary agent • inspect results</text><text x="70" y="168" class="small">policyctl remains here and is never invoked by the agent</text>
<rect x="40" y="220" width="1120" height="150" rx="14" class="box"/>
<text x="70" y="252" class="head">AGENT / OPERATOR PLANE</text><text x="70" y="280" class="small">One selected primary terminal agent: adapter-neutral operator</text>
<text x="70" y="308" class="small">YAML contracts + campaigns • Taskflow stages • LangGraph case state • scoped MCP</text><text x="70" y="338" class="small">The agent drives the workflow; prompts and skills do not provide isolation</text>
<rect x="170" y="410" width="860" height="190" rx="18" class="boundary"/>
<text x="600" y="442" text-anchor="middle" class="head">EXECUTION SECURITY BOUNDARY</text>
<rect x="220" y="470" width="330" height="85" rx="10" class="box"/><text x="385" y="503" text-anchor="middle" class="head">Lima + QEMU + VM/OS</text><text x="385" y="530" text-anchor="middle" class="small">mounts • credentials • privilege • network</text>
<rect x="650" y="470" width="330" height="85" rx="10" class="box"/><text x="815" y="503" text-anchor="middle" class="head">UNTRUSTED WORKLOAD</text><text x="815" y="530" text-anchor="middle" class="small">experiment under test</text>
<rect x="40" y="640" width="520" height="90" rx="14" class="box"/><text x="70" y="672" class="head">EVIDENCE / CASE PLANE</text><text x="70" y="700" class="small">artifacts • telemetry • audit • verification • provenance</text>
<rect x="600" y="640" width="560" height="90" rx="14" class="box"/><text x="630" y="672" class="head">LEARNING PLANE</text><text x="630" y="700" class="small">CANDIDATE → replay → independent verification → approval → VALIDATED</text>
<path d="M600 190 L600 220" class="arrow"/><path d="M600 370 L600 410" class="arrow"/><path d="M550 512 L650 512" class="arrow"/><path d="M815 555 L815 640" class="arrow"/><path d="M385 555 L300 640" class="arrow"/><path d="M560 685 L600 685" class="arrow"/>
<text x="50" y="748" class="small">Security boundary = VM/OS and configured resource, filesystem, credential, privilege and network controls.</text>
</svg>