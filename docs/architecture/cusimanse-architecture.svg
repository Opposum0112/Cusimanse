<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980"><defs><style>.title{font:700 30px sans-serif;fill:#102a43}.sub{font:16px sans-serif;fill:#486581}.h{font:700 18px sans-serif;fill:#102a43}.t{font:15px sans-serif;fill:#243b53}.small{font:13px sans-serif;fill:#334e68}.box{stroke:#7b8794;stroke-width:2;rx:14}.blue{fill:#eaf4ff}.green{fill:#edf9f0}.purple{fill:#f2edff}.orange{fill:#fff3e6}.red{fill:#fff0f0}.gray{fill:#f4f6f8}.gold{fill:#fff8df}.arrow{stroke:#52606d;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs><rect width="1500" height="980" fill="#fff"/><text x="60" y="58" class="title">Cusimanse — Declarative, Agent-Neutral Security Research</text><text x="60" y="88" class="sub">Goose is the reference operator; recipes remain the experiment source of truth; Lima/QEMU remains the execution boundary.</text><rect x="50" y="120" width="260" height="100" class="box blue"/><text x="180" y="153" text-anchor="middle" class="h">Researcher</text><text x="180" y="180" text-anchor="middle" class="t">Question / hypothesis</text><text x="180" y="202" text-anchor="middle" class="small">Select contract + experiment</text><rect x="350" y="120" width="310" height="100" class="box orange"/><text x="505" y="153" text-anchor="middle" class="h">Contract</text><text x="505" y="180" text-anchor="middle" class="t">Scope • safety • evidence • acceptance</text><text x="505" y="202" text-anchor="middle" class="small">What and why</text><rect x="700" y="120" width="350" height="100" class="box purple"/><text x="875" y="153" text-anchor="middle" class="h">Experiment Recipe YAML</text><text x="875" y="180" text-anchor="middle" class="t">Workload • tools • VM • instrumentation</text><text x="875" y="202" text-anchor="middle" class="small">Agent-neutral source of truth</text><rect x="1090" y="120" width="350" height="100" class="box green"/><text x="1265" y="153" text-anchor="middle" class="h">Primary Agent</text><text x="1265" y="180" text-anchor="middle" class="t">Goose reference • validated adapters</text><text x="1265" y="202" text-anchor="middle" class="small">Plan • delegate • execute • report</text><path d="M310 170 H350M660 170 H700M1050 170 H1090" class="arrow"/><rect x="50" y="255" width="1400" height="145" class="box gray"/><text x="75" y="286" class="h">Mandatory Host Layer — installed/configured by scripts/install.sh from recipes/host/security-research.yaml</text><text x="85" y="325" class="t">Goose • Lima + QEMU • LiteLLM + OmniRoute • Numbat • Aegis • Phoenix/OpenTelemetry • ClawMetry • Go/Node/npm • forensic/network tools</text><text x="85" y="357" class="small">YAML declares the inventory and configuration. install.sh installs it; preflight verifies it; tools.sh lists paths, versions and configuration locations.</text><path d="M1265 220 V255" class="arrow"/><rect x="70" y="440" width="300" height="120" class="box blue"/><text x="220" y="472" text-anchor="middle" class="h">Native delegation</text><text x="220" y="500" text-anchor="middle" class="t">Subagents / subrecipes / Skills</text><text x="220" y="525" text-anchor="middle" class="small">Specialist role definitions remain</text><rect x="420" y="440" width="330" height="120" class="box green"/><text x="585" y="472" text-anchor="middle" class="h">Execution Environment</text><text x="585" y="500" text-anchor="middle" class="t">Lima VM + QEMU</text><text x="585" y="525" text-anchor="middle" class="small">Instrumentation profile attached</text><rect x="800" y="440" width="300" height="120" class="box purple"/><text x="950" y="472" text-anchor="middle" class="h">Recipe Workload</text><text x="950" y="500" text-anchor="middle" class="t">Agent executes commands</text><text x="950" y="525" text-anchor="middle" class="small">Researcher does not run workload on host</text><rect x="1150" y="440" width="290" height="120" class="box orange"/><text x="1295" y="472" text-anchor="middle" class="h">Evidence</text><text x="1295" y="500" text-anchor="middle" class="t">Logs • traces • files • network</text><text x="1295" y="525" text-anchor="middle" class="small">Captured before VM destruction</text><path d="M370 500 H420M750 500 H800M1100 500 H1150M1090 220 C1000 280 650 290 585 440" class="arrow"/><rect x="150" y="615" width="300" height="105" class="box gray"/><text x="300" y="648" text-anchor="middle" class="h">Session State</text><text x="300" y="676" text-anchor="middle" class="t">runs/&lt;session-id&gt;/session.yaml</text><text x="300" y="699" text-anchor="middle" class="small">Lifecycle • approvals • provenance</text><rect x="500" y="615" width="300" height="105" class="box blue"/><text x="650" y="648" text-anchor="middle" class="h">Analysis</text><text x="650" y="676" text-anchor="middle" class="t">Evidence + forensics</text><text x="650" y="699" text-anchor="middle" class="small">Observed facts vs inference</text><rect x="850" y="615" width="300" height="105" class="box green"/><text x="1000" y="648" text-anchor="middle" class="h">Verification</text><text x="1000" y="676" text-anchor="middle" class="t">Independent challenge</text><text x="1000" y="699" text-anchor="middle" class="small">Verified / partial / not verified</text><rect x="1200" y="615" width="240" height="105" class="box purple"/><text x="1320" y="648" text-anchor="middle" class="h">Research Report</text><text x="1320" y="676" text-anchor="middle" class="t">report.md + report.yaml</text><text x="1320" y="699" text-anchor="middle" class="small">Primary researcher output</text><path d="M1295 560 V615M450 667 H500M800 667 H850M1150 667 H1200" class="arrow"/><rect x="170" y="780" width="430" height="130" class="box gold"/><text x="385" y="813" text-anchor="middle" class="h">Learning — explicitly enabled</text><text x="385" y="842" text-anchor="middle" class="t">retrieve → propose → execute → evaluate</text><text x="385" y="865" text-anchor="middle" class="t">→ refine → replay → verify → approve → promote</text><text x="385" y="892" text-anchor="middle" class="small">Human approval required; base contracts immutable</text><rect x="650" y="780" width="350" height="130" class="box red"/><text x="825" y="813" text-anchor="middle" class="h">Preservation</text><text x="825" y="842" text-anchor="middle" class="t">Hashes • provenance • report • telemetry</text><text x="825" y="868" text-anchor="middle" class="small">Preserve before destroying disposable VM</text><rect x="1050" y="780" width="350" height="130" class="box green"/><text x="1225" y="813" text-anchor="middle" class="h">Complete</text><text x="1225" y="842" text-anchor="middle" class="t">Destroy VM after preservation</text><text x="1225" y="868" text-anchor="middle" class="small">Evidence remains in the session artifact</text><path d="M1320 720 V760 H385 V780M600 845 H650M1000 845 H1050" class="arrow"/><text x="60" y="950" class="small">Container Use can add another isolated environment, but it does not replace the Lima/QEMU experiment boundary.</text></svg>