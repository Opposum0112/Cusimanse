<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".16"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:800}.subtitle{font-size:16px;fill:#536174}.h{font-size:18px;font-weight:800}.b{font-size:15px}.s{font-size:13px;fill:#536174}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.plane{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.boundary{fill:#fff7ed;stroke:#c2410c;stroke-width:3;stroke-dasharray:9 7}.obs{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.policy{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.learn{fill:#faf5ff;stroke:#9333ea;stroke-width:2}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1400" height="900" fill="url(#bg)"/><text x="700" y="45" text-anchor="middle" class="title">Cusimanse — Architecture, Security &amp; Observability Planes</text><text x="700" y="72" text-anchor="middle" class="subtitle">Agent-driven research workflow with an independent host policy plane and disposable VM execution boundary</text>
<rect x="45" y="100" width="1310" height="105" rx="18" class="card" filter="url(#shadow)"/><text x="75" y="135" class="h">NORMAL HOST SHELL · RESEARCHER</text><text x="75" y="164" class="b">Install / repair execute bits / configure PATH · select one primary agent · inspect preserved evidence</text><text x="75" y="188" class="s">Host setup and policy controls stay outside the agent prompt.</text>
<rect x="45" y="235" width="1310" height="185" rx="18" class="plane"/><text x="75" y="270" class="h">AGENT / OPERATOR PLANE</text><rect x="75" y="292" width="390" height="95" rx="12" class="card"/><text x="95" y="321" class="h">Primary terminal agent</text><text x="95" y="348" class="b">Prime / Hermes / other adapters</text><text x="95" y="373" class="s">One selected operator owns the case workflow</text><rect x="495" y="292" width="400" height="95" rx="12" class="card"/><text x="515" y="321" class="h">Cusimanse control logic</text><text x="515" y="348" class="b">YAML · campaigns · Taskflow · LangGraph</text><text x="515" y="373" class="s">Stateful execution, contracts and scoped MCP</text><rect x="925" y="292" width="395" height="95" rx="12" class="card"/><text x="945" y="321" class="h">Tool / skill access</text><text x="945" y="348" class="b">MCP · SKILL.md · research databases</text><text x="945" y="373" class="s">Capability metadata never grants authority</text>
<rect x="45" y="450" width="1310" height="135" rx="18" class="obs"/><text x="75" y="485" class="h">AGENT OBSERVABILITY &amp; GOVERNANCE PLANE</text><text x="75" y="512" class="b">OpenTelemetry traces · metrics · logs</text><rect x="75" y="528" width="300" height="42" rx="9" class="card"/><text x="225" y="555" text-anchor="middle" class="b">Phoenix · tracing / evaluation</text><rect x="410" y="528" width="300" height="42" rx="9" class="card"/><text x="560" y="555" text-anchor="middle" class="b">Numbat · agent observability</text><rect x="745" y="528" width="300" height="42" rx="9" class="card"/><text x="895" y="555" text-anchor="middle" class="b">Aegis · governance / controls</text><text x="1080" y="552" class="s">Not an isolation boundary</text>
<rect x="175" y="620" width="1050" height="150" rx="22" class="boundary"/><text x="700" y="653" text-anchor="middle" class="h">EXECUTION SECURITY BOUNDARY</text><rect x="220" y="675" width="420" height="65" rx="12" class="card"/><text x="430" y="703" text-anchor="middle" class="h">Lima + QEMU + VM/OS</text><text x="430" y="725" text-anchor="middle" class="s">filesystem · credentials · privilege · network</text><rect x="760" y="675" width="420" height="65" rx="12" class="card"/><text x="970" y="703" text-anchor="middle" class="h">UNTRUSTED WORKLOAD</text><text x="970" y="725" text-anchor="middle" class="s">commands execute here, never on host</text>
<rect x="45" y="805" width="620" height="65" rx="15" class="policy"/><text x="70" y="833" class="h">HOST POLICY PLANE</text><text x="70" y="855" class="b">policyctl · independent · outside agent control plane</text><rect x="700" y="805" width="655" height="65" rx="15" class="learn"/><text x="725" y="833" class="h">EVIDENCE + LEARNING PLANE</text><text x="725" y="855" class="b">artifacts → candidate → replay → independent verification → approval → validated</text>
<path d="M700 205 L700 235" class="arrow"/><path d="M700 420 L700 450" class="arrow"/><path d="M700 585 L700 620" class="arrow"/><path d="M640 707 L760 707" class="arrow"/><path d="M970 740 L970 805" class="arrow"/><path d="M430 740 L300 805" class="arrow"/><path d="M1045 420 L1045 450" class="arrow"/><path d="M1180 205 L1180 620" class="dash"/><path d="M355 805 L355 770" class="dash"/>
</svg>