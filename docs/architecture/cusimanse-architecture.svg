<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<style>text{font-family:Arial,sans-serif;fill:#10243e}.title{font-size:30px;font-weight:700}.box{fill:#fff;stroke:#177ddc;stroke-width:2}.group{fill:#eef7ff;stroke:#4b9fe1;stroke-width:2}.optional{fill:#f4f4f4;stroke:#777;stroke-width:2;stroke-dasharray:8 6}.small{font-size:15px}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6z" fill="#177ddc"/></marker></defs>
<text x="600" y="36" text-anchor="middle" class="title">Cusimanse — declarative, agent-neutral security research</text>
<rect x="30" y="60" width="1140" height="105" rx="16" class="group"/><text x="55" y="90" font-weight="700">Research definition</text>
<rect x="70" y="110" width="250" height="38" rx="8" class="box"/><text x="195" y="135" text-anchor="middle">Contract</text>
<rect x="450" y="110" width="300" height="38" rx="8" class="box"/><text x="600" y="135" text-anchor="middle">Agent-neutral YAML recipe</text>
<rect x="880" y="110" width="230" height="38" rx="8" class="box"/><text x="995" y="135" text-anchor="middle">Primary agent</text>
<path d="M320 129H450M750 129H880" stroke="#177ddc" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="190" width="1140" height="150" rx="16" class="group"/><text x="55" y="220" font-weight="700">Agent operation</text>
<rect x="70" y="245" width="200" height="65" rx="8" class="box"/><text x="170" y="270" text-anchor="middle">Plan / Todo</text><text x="170" y="292" text-anchor="middle" class="small">Skills</text>
<rect x="350" y="245" width="270" height="65" rx="8" class="box"/><text x="485" y="270" text-anchor="middle">Summon specialist agents</text><text x="485" y="292" text-anchor="middle" class="small">subrecipes / parallel work</text>
<rect x="700" y="245" width="190" height="65" rx="8" class="box"/><text x="795" y="270" text-anchor="middle">MCP / Developer</text><text x="795" y="292" text-anchor="middle" class="small">declared capabilities</text>
<rect x="960" y="245" width="150" height="65" rx="8" class="box"/><text x="1035" y="282" text-anchor="middle">Approval</text>
<path d="M995 148V245" stroke="#177ddc" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="365" width="1140" height="110" rx="16" class="group"/><text x="55" y="395" font-weight="700">Mandatory host toolchain — installed/configured by scripts/install.sh</text>
<text x="70" y="435" class="small">Goose · Lima · QEMU · Go · Node/npm · forensic tools · LiteLLM · OmniRoute · Numbat · Aegis · Phoenix/OpenTelemetry · ClawMetry</text>
<text x="70" y="458" class="small">Inventory and access: recipes/host/security-research.yaml + scripts/tools.sh</text>
<rect x="30" y="500" width="1140" height="120" rx="16" class="group"/><text x="55" y="530" font-weight="700">Disposable experiment</text>
<rect x="70" y="550" width="300" height="45" rx="8" class="box"/><text x="220" y="578" text-anchor="middle">Lima + QEMU VM / guest OS</text>
<rect x="450" y="550" width="250" height="45" rx="8" class="box"/><text x="575" y="578" text-anchor="middle">Instrumentation profile</text>
<rect x="780" y="550" width="300" height="45" rx="8" class="box"/><text x="930" y="578" text-anchor="middle">Recipe-defined workload</text>
<path d="M220 475V550M575 595V650M700 272H575V550M575 595H780" stroke="#177ddc" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="650" width="1140" height="80" rx="16" class="group"/><text x="55" y="680" font-weight="700">Evidence → session.yaml → analysis → independent verification → research report → preservation → destroy</text>
<text x="55" y="706" class="small">Learning is enabled explicitly in session.yaml only after report + independent verification.</text>
<rect x="900" y="700" width="240" height="40" rx="8" class="optional"/><text x="1020" y="725" text-anchor="middle" class="small">Container Use: optional</text>
