<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180" role="img" aria-labelledby="title desc"><title id="title">Cusimanse architecture with policy control</title><desc id="desc">Layered Cusimanse architecture showing research contracts, experiment configuration, Goose and adapters, policyctl enforcement, disposable Lima QEMU execution, guest instrumentation, evidence, independent verification, reporting and optional learning.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334155"/></marker><style>.t{font:700 30px sans-serif;fill:#0f172a}.s{font:700 18px sans-serif;fill:#334155}.h{font:700 16px sans-serif;fill:#0f172a}.b{font:14px sans-serif;fill:#334155}.sm{font:12px sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:1.5}.arrow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}.dash{stroke-dasharray:7 6}</style></defs><rect width="1400" height="1180" fill="#fff"/><text x="700" y="40" text-anchor="middle" class="t">Cusimanse — Declarative, Agent-Neutral Security Research</text><text x="700" y="66" text-anchor="middle" class="sm">Declare → select agent → validate policy → contain execution → observe → verify → report</text><rect x="35" y="90" width="1330" height="150" rx="16" fill="#eef5ff" stroke="#7aa2d6"/><text x="55" y="118" class="s">1. CONTROL &amp; DECLARATION PLANE</text><rect x="70" y="140" width="290" height="75" rx="10" class="box"/><text x="215" y="167" text-anchor="middle" class="h">Research Contract</text><text x="90" y="190" class="b">why • scope • authorization • acceptance</text><text x="90" y="208" class="sm">Security intent, not an execution script</text><rect x="395" y="140" width="390" height="75" rx="10" class="box"/><text x="590" y="167" text-anchor="middle" class="h">Cusimanse Experiment Configuration</text><text x="415" y="190" class="b">workload • compute • policy • instrumentation</text><text x="415" y="208" class="sm">evidence • roles • integrations</text><rect x="820" y="140" width="240" height="75" rx="10" class="box"/><text x="940" y="167" text-anchor="middle" class="h">Goose Recipe</text><text x="840" y="190" class="b">title • description</text><text x="840" y="208" class="sm">instructions / prompt</text><rect x="1095" y="140" width="235" height="75" rx="10" class="box"/><text x="1212" y="167" text-anchor="middle" class="h">Prompt Reference</text><text x="1115" y="190" class="b">non-Goose handoff</text><text x="1115" y="208" class="sm">same experiment definition</text><path d="M360 177H395M785 177H820M785 195H1095" class="arrow"/><rect x="35" y="260" width="1330" height="150" rx="16" fill="#f4efff" stroke="#a98bd1"/><text x="55" y="288" class="s">2. AGENT &amp; ORCHESTRATION PLANE</text><rect x="70" y="310" width="240" height="75" rx="10" class="box"/><text x="190" y="337" text-anchor="middle" class="h">Selected Primary Agent</text><text x="90" y="360" class="b">one operator owns lifecycle</text><text x="90" y="378" class="sm">capability gaps are recorded</text><rect x="340" y="310" width="310" height="75" rx="10" class="box"/><text x="495" y="337" text-anchor="middle" class="h">Goose — Reference Operator</text><text x="360" y="360" class="b">Recipes • Skills • Summon • MCP</text><text x="360" y="378" class="sm">native orchestration path</text><rect x="680" y="310" width="310" height="75" rx="10" class="box"/><text x="835" y="337" text-anchor="middle" class="h">Validated Adapter Layer</text><text x="700" y="360" class="b">OpenCode • Hermes • Antigravity • Pi</text><text x="700" y="378" class="sm">no experiment recipe fork</text><rect x="1020" y="310" width="310" height="75" rx="10" class="box"/><text x="1175" y="337" text-anchor="middle" class="h">Specialist Roles</text><text x="1040" y="360" class="b">planner • research • runtime • forensics</text><text x="1040" y="378" class="sm">detection • verifier • report</text><path d="M940 215V310M1212 215V310M310 347H340M650 347H680M990 347H1020" class="arrow"/><rect x="35" y="430" width="1330" height="190" rx="16" fill="#fff1f1" stroke="#b94a4a"/><text x="55" y="458" class="s">3. POLICY CONTROL PLANE</text><rect x="70" y="480" width="330" height="110" rx="10" class="box"/><text x="235" y="507" text-anchor="middle" class="h">policyctl — Policy Interface</text><text x="90" y="530" class="b">show • validate • check</text><text x="90" y="550" class="b">require • enforce • audit</text><text x="90" y="570" class="sm">fail closed for deny / missing approval</text><rect x="430" y="480" width="290" height="110" rx="10" class="box"/><text x="575" y="507" text-anchor="middle" class="h">Policy Sources</text><text x="450" y="530" class="b">host-policy.yaml</text><text x="450" y="550" class="b">mount-denylist.yaml</text><text x="450" y="570" class="b">permission-tiers.yaml</text><rect x="750" y="480" width="270" height="110" rx="10" class="box"/><text x="885" y="507" text-anchor="middle" class="h">Decision</text><text x="770" y="530" class="b">ALLOW</text><text x="770" y="550" class="b">DENY</text><text x="770" y="570" class="b">APPROVAL REQUIRED</text><rect x="1050" y="480" width="280" height="110" rx="10" class="box"/><text x="1190" y="507" text-anchor="middle" class="h">Audit</text><text x="1070" y="530" class="b">policy-decision JSONL</text><text x="1070" y="550" class="b">action • decision • timestamp</text><text x="1070" y="570" class="sm">auditable control-plane evidence</text><path d="M400 535H430M720 535H750M1020 535H1050" class="arrow"/><path d="M1175 385V430M190 385V480" class="arrow dash"/><rect x="35" y="640" width="1330" height="205" rx="16" fill="#fff4e5" stroke="#d38a32"/><text x="55" y="668" class="s">4. EXECUTION &amp; SECURITY PLANE — CONTAINMENT BOUNDARY</text><rect x="70" y="690" width="270" height="125" rx="10" fill="#ffe8e8" stroke="#a33" stroke-width="2.5"/><text x="205" y="718" text-anchor="middle" class="h">Policy-Gated Plan</text><text x="90" y="742" class="b">scope • authorization</text><text x="90" y="762" class="b">network • mounts • privilege</text><text x="90" y="782" class="b">approval checkpoint</text><text x="90" y="802" class="sm">No bypass on DENY</text><rect x="380" y="680" width="400" height="145" rx="12" fill="#ffe8e8" stroke="#a33" stroke-width="2.5"/><text x="580" y="708" text-anchor="middle" class="h">Lima / QEMU Disposable VM</text><text x="405" y="735" class="b">Guest OS = execution / isolation boundary</text><text x="405" y="757" class="b">ephemeral workload environment</text><text x="405" y="779" class="b">destroy after preservation</text><text x="405" y="801" class="sm">Container Use is optional additional environment</text><rect x="820" y="690" width="240" height="125" rx="10" class="box"/><text x="940" y="718" text-anchor="middle" class="h">Guest Instrumentation</text><text x="840" y="742" class="b">process • syscall</text><text x="840" y="762" class="b">filesystem • network</text><text x="840" y="782" class="b">timestamps / versions</text><text x="840" y="802" class="sm">starts before workload</text><rect x="1100" y="690" width="230" height="125" rx="10" class="box"/><text x="1215" y="718" text-anchor="middle" class="h">Recipe Workload</text><text x="1120" y="742" class="b">Go / npm baselines</text><text x="1120" y="762" class="b">controlled threat fixtures</text><text x="1120" y="782" class="b">no host execution</text><text x="1120" y="802" class="sm">deterministic commands</text><path d="M340 752H380M780 752H820M1060 752H1100" class="arrow"/><rect x="35" y="865" width="1330" height="160" rx="16" fill="#edf8ef" stroke="#78a983"/><text x="55" y="893" class="s">5. EVIDENCE, VERIFICATION &amp; RESEARCH PLANE</text><rect x="70" y="915" width="240" height="85" rx="10" class="box"/><text x="190" y="942" text-anchor="middle" class="h">Evidence Bundle</text><text x="90" y="965" class="b">session • audit • raw observations</text><text x="90" y="985" class="sm">evidence index</text><rect x="335" y="915" width="240" height="85" rx="10" class="box"/><text x="455" y="942" text-anchor="middle" class="h">Integrity + Provenance</text><text x="355" y="965" class="b">SHA-256 hashes</text><text x="355" y="985" class="sm">recipe / tool / Git provenance</text><rect x="600" y="915" width="240" height="85" rx="10" class="box"/><text x="720" y="942" text-anchor="middle" class="h">Specialist Analysis</text><text x="620" y="965" class="b">runtime • forensics • detection</text><text x="620" y="985" class="sm">findings cite evidence</text><rect x="865" y="915" width="240" height="85" rx="10" class="box"/><text x="985" y="942" text-anchor="middle" class="h">Independent Verification</text><text x="885" y="965" class="b">separate verifier</text><text x="885" y="985" class="sm">reproduce / challenge</text><rect x="1130" y="915" width="200" height="85" rx="10" class="box"/><text x="1230" y="942" text-anchor="middle" class="h">Report + Preserve</text><text x="1150" y="965" class="b">report + metadata</text><text x="1150" y="985" class="sm">preserve before destroy</text><path d="M1215 815V915M310 957H335M575 957H600M840 957H865M1105 957H1130" class="arrow"/><rect x="35" y="1045" width="1330" height="80" rx="14" fill="#f5f5f5" stroke="#888"/><text x="55" y="1072" class="s">6. INTEGRATION &amp; OPTIONAL LEARNING</text><text x="55" y="1096" class="sm">Host preflight • OmniRoute → LiteLLM • Numbat / Aegis / Phoenix-OTel / ClawMetry • Skills/MCP • learning: retrieve → replay → verify → human approval → validated</text><text x="55" y="1114" class="sm">Integrations extend the agent; they do not become the workload containment boundary.</text></svg>