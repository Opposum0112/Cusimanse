<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Cusimanse Agent Runtime</title>
  <desc id="desc">A researcher writes a contract. Any operator proposes the next observation. The runtime checks the contract, authorizes, executes on disposable compute, and returns evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}
      .guard{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:14}
      .agent{fill:#eef2ff;stroke:#4338ca;stroke-width:2;rx:14}
      .ev{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:14}
      .title{font:700 24px sans-serif;fill:#0f172a}
      .label{font:600 16px sans-serif;fill:#0f172a}
      .small{font:13px sans-serif;fill:#475569}
      .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dashed{stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1200" height="780" fill="white"/>
  <text x="600" y="40" text-anchor="middle" class="title">Cusimanse Agent Runtime</text>
  <text x="600" y="64" text-anchor="middle" class="small">The operator proposes. The contract and runtime decide what may run.</text>

  <rect x="40" y="95" width="270" height="96" class="agent"/>
  <text x="175" y="128" text-anchor="middle" class="label">Researcher</text>
  <text x="175" y="152" text-anchor="middle" class="small">writes contract + fixtures</text>
  <text x="175" y="174" text-anchor="middle" class="small">reviews evidence</text>

  <rect x="340" y="95" width="270" height="96" class="agent"/>
  <text x="475" y="128" text-anchor="middle" class="label">Operator</text>
  <text x="475" y="152" text-anchor="middle" class="small">any harness, model, or human</text>
  <text x="475" y="174" text-anchor="middle" class="small">proposal JSON only</text>

  <rect x="640" y="95" width="250" height="96" class="box"/>
  <text x="765" y="128" text-anchor="middle" class="label">Skill registry</text>
  <text x="765" y="152" text-anchor="middle" class="small">role → skill → capability</text>
  <text x="765" y="174" text-anchor="middle" class="small">vocabulary, not power</text>

  <rect x="920" y="95" width="240" height="96" class="box"/>
  <text x="1040" y="128" text-anchor="middle" class="label">Local lab port</text>
  <text x="1040" y="152" text-anchor="middle" class="small">propose / state / evidence</text>
  <text x="1040" y="174" text-anchor="middle" class="small">127.0.0.1</text>

  <path d="M310 143 H340" class="arrow"/>
  <path d="M610 143 H640" class="arrow"/>
  <path d="M890 143 H920" class="arrow"/>

  <rect x="40" y="250" width="270" height="96" class="guard"/>
  <text x="175" y="283" text-anchor="middle" class="label">Frozen contract</text>
  <text x="175" y="307" text-anchor="middle" class="small">question • scope • allowlist</text>
  <text x="175" y="329" text-anchor="middle" class="small">evidence • stop • destroy</text>

  <rect x="340" y="250" width="270" height="96" class="guard"/>
  <text x="475" y="283" text-anchor="middle" class="label">Contract + policy checks</text>
  <text x="475" y="307" text-anchor="middle" class="small">allowlist • scope • seal</text>
  <text x="475" y="329" text-anchor="middle" class="small">then allow / approve / deny</text>

  <rect x="640" y="250" width="250" height="96" class="box"/>
  <text x="765" y="283" text-anchor="middle" class="label">Adapters</text>
  <text x="765" y="307" text-anchor="middle" class="small">declared workloads only</text>
  <text x="765" y="329" text-anchor="middle" class="small">no operator shell</text>

  <rect x="920" y="250" width="240" height="96" class="box"/>
  <text x="1040" y="283" text-anchor="middle" class="label">Disposable VM</text>
  <text x="1040" y="307" text-anchor="middle" class="small">create → observe</text>
  <text x="1040" y="329" text-anchor="middle" class="small">seal → destroy</text>

  <path d="M175 191 V250" class="arrow"/>
  <path d="M1040 191 V220 H475 V250" class="arrow"/>
  <path d="M310 298 H340" class="arrow"/>
  <path d="M610 298 H640" class="arrow"/>
  <path d="M890 298 H920" class="arrow"/>

  <rect x="250" y="410" width="320" height="96" class="ev"/>
  <text x="410" y="443" text-anchor="middle" class="label">Evidence</text>
  <text x="410" y="467" text-anchor="middle" class="small">hashed artifacts + kinds</text>
  <text x="410" y="489" text-anchor="middle" class="small">process • network • log</text>

  <rect x="630" y="410" width="320" height="96" class="box"/>
  <text x="790" y="443" text-anchor="middle" class="label">Lab state</text>
  <text x="790" y="467" text-anchor="middle" class="small">events • phase • denials</text>
  <text x="790" y="489" text-anchor="middle" class="small">read-only to the operator</text>

  <path d="M1040 346 V378 H410 V410" class="arrow"/>
  <path d="M570 458 H630" class="arrow"/>
  <path d="M790 410 V380 H475 V191" class="arrow dashed"/>

  <text x="600" y="560" text-anchor="middle" class="small">Dashed path: operator reads state and evidence, then proposes again or sets complete.</text>
  <text x="600" y="590" text-anchor="middle" class="small">The operator never receives a tool that runs shell, changes policy, or approves itself.</text>
</svg>
